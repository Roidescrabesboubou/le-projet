<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Panel admin – Salle de jeux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0fa;--card:#fff;--text:#1d1a3a;--muted:#5c5880;--line:#d5d8ec;--accent:#ff4f7b;--ok:#1f9a66;--warn:#f5b31f;--off:#8a87a8;--encre:#1d1a3a;--bord:var(--encre)}
@media (prefers-color-scheme:dark){:root{--bg:#13112a;--card:#1f1c3c;--text:#f1efff;--muted:#a6a2cc;--line:#36325f;--encre:#06051a;--bord:#4b467d}}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:2px solid var(--line);flex-wrap:wrap;background:var(--card)}
header a{color:var(--muted);text-decoration:none;font-weight:700}
h1{font-family:"Bricolage Grotesque",Nunito,sans-serif;font-weight:800;font-size:1.5rem;margin:0}
h2{font-family:"Bricolage Grotesque",Nunito,sans-serif;font-weight:800;font-size:1.2rem;margin:0 0 4px}
main{max-width:900px;margin:0 auto;padding:24px 16px 60px}
.panel{background:var(--card);border:2px solid var(--bord);box-shadow:0 4px 0 var(--encre);border-radius:18px;padding:18px;margin-bottom:18px}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 12px}
button,.btn{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--accent);color:#fff;text-decoration:none;display:inline-block}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
textarea,input[type=text]{width:100%;font:inherit;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jeux{display:flex;flex-direction:column;gap:8px}
.jeu{display:grid;grid-template-columns:22px 30px 44px 1fr auto;gap:10px;align-items:center;padding:10px;border:2px solid var(--line);border-radius:14px;background:var(--bg)}
.jeu .em{font-size:1.7rem;text-align:center}
.jeu b{display:block}
.jeu small{color:var(--muted)}
.jeu .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border-radius:0;background:var(--card);color:var(--text);padding:6px 10px;font-size:.85rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.dispo{background:var(--ok);color:#fff}
.seg button.on.bientot{background:var(--warn);color:#22192b}
.seg button.on.cache{background:var(--off);color:#fff}
.badge-in{width:110px!important;padding:6px 9px!important;font-size:.85rem}
.mini{font-size:.8rem;padding:5px 9px}
.def{color:var(--muted);font-size:.75rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.toast.err{background:#d64545;color:#fff}
.centre{text-align:center;padding:40px 18px}
.centre .big{font-size:3rem}
ol{padding-left:20px;line-height:1.7}
code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:.88em}
.fleches{display:flex;flex-direction:column;gap:2px}
.poignee{display:flex;align-items:center;justify-content:center;align-self:stretch;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--muted);font-size:1.15rem;border-radius:8px}
.poignee:hover{background:var(--card);color:var(--text)}
.jeu.glisse{position:relative;z-index:2;background:var(--card);box-shadow:0 12px 28px rgba(0,0,0,.2);outline:2px solid var(--accent)}
.jeu.glisse .poignee{cursor:grabbing}
body.en-glisse,body.en-glisse *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
.fleches button{padding:0;width:28px;height:22px;font-size:.75rem;line-height:1;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:7px}
.fleches button:disabled{opacity:.25}
.jeu.bouge{outline:2px solid var(--accent);transition:outline-color .6s}
.onglets{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.onglets button{background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:999px;padding:7px 14px}
.onglets button:hover{border-color:var(--text)}
.onglets button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.cats-resume{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.cats-resume span{font-size:.82rem;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.jeu.cat-ligne{grid-template-columns:44px minmax(120px,200px) 1fr auto}
.puces{display:flex;flex-wrap:wrap;gap:5px}
.puces button{font-size:.8rem;padding:5px 10px;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:999px}
.puces button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cat-def{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border:2px solid var(--line);border-radius:14px;background:var(--bg);margin-bottom:8px}
.cat-def .apercu{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;border:2px solid var(--bord)}
.cat-def .champs{display:grid;grid-template-columns:70px 1fr;gap:6px}
.cat-def .champs input[type=text]{padding:6px 9px}
.cat-def .champs .large{grid-column:1/-1}
.cat-def .couleurs{display:flex;gap:6px;align-items:center;grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.cat-def .couleurs input{width:38px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.cat-def .actions{display:flex;flex-direction:column;gap:4px}
.cat-def.masquee{opacity:.55}
@media (max-width:620px){.cat-def{grid-template-columns:auto 1fr}.cat-def .actions{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}}
small.alerte{color:#d36a00;font-weight:700}
dialog.fen{border:2px solid var(--bord);border-radius:20px;background:var(--card);color:var(--text);padding:22px;width:min(520px,92vw)}
dialog.fen::backdrop{background:rgba(19,17,42,.55)}
dialog.fen code{word-break:break-all}
dialog.fen .row{margin-top:14px}
@media (max-width:620px){.jeu.cat-ligne{grid-template-columns:36px 1fr auto}.jeu.cat-ligne .puces{grid-column:1/-1}}
.tete{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
@media (max-width:620px){.jeu{grid-template-columns:22px 30px 36px 1fr}.jeu .ctl{grid-column:1/-1;justify-content:flex-start}}
</style>
</head>
<body>
<header>
  <div class="row"><a href="../">← Salle de jeux</a><h1>⭐ Panel admin</h1></div>
  <div id="compte"></div>
</header>
<main id="main"><p class="hint">Chargement…</p></main>
<div class="toast" id="toast"></div>

<script src="../jeux/commun/catalogue.js"></script>
<script src="../jeux/commun/compte.js"></script>
<script src="moderation.js"></script>
<script>
const $ = id => document.getElementById(id);
const main = $("main");
const el = (tag, txt, cls) => { const e = document.createElement(tag); if(txt) e.textContent = txt; if(cls) e.className = cls; return e; };
let tt;
function toast(t, err){ const x = $("toast"); x.textContent = t; x.className = "toast on" + (err ? " err" : ""); clearTimeout(tt); tt = setTimeout(() => x.className = "toast", 2200); }

Compte.bouton($("compte"));

function ecranCentre(icone, titre, texte, bouton){
  main.innerHTML = "";
  const p = el("div", "", "panel centre");
  p.append(el("div", icone, "big"), el("h2", titre));
  if(texte){ const t = el("p", texte, "hint"); p.appendChild(t); }
  if(bouton) p.appendChild(bouton);
  main.appendChild(p);
  return p;
}

let rendu = 0;
async function demarrer(){
  const jeton = ++rendu;
  if(!Compte.pret){
    main.innerHTML = "";
    const p = el("div", "", "panel");
    p.innerHTML = `<h2>🔧 Les comptes ne sont pas encore activés</h2>
      <ol>
        <li>Console Firebase → <b>Authentication</b> → Commencer → <b>Sign-in method</b> → active <b>E-mail/Mot de passe</b>.</li>
        <li>⚙️ Paramètres du projet → Général → copie la <b>Clé API Web</b> et colle-la dans <code>jeux/commun/compte.js</code> (ligne <code>apiKey</code>).</li>
        <li>Realtime Database → <b>Règles</b> → colle le contenu de <code>firebase-regles.json</code> → Publier.</li>
        <li>Pour le tout premier admin : Realtime Database → Données → ajoute <code>admins/&lt;ton uid&gt;: true</code>.</li>
      </ol>`;
    main.appendChild(p); return;
  }
  const s = Compte.session();
  if(!s){
    const b = el("button", "Se connecter"); b.onclick = () => Compte.ouvrir("connexion");
    ecranCentre("🔒", "Connecte-toi pour accéder au panel", "Seuls les administrateurs peuvent modifier le site.", b);
    return;
  }
  main.innerHTML = '<p class="hint">Vérification des droits…</p>';
  await Compte.actualiser();
  if(jeton !== rendu) return;
  if(!Compte.session()) return demarrer();
  if(!Compte.session().admin){
    ecranCentre("⛔", "Accès réservé", "Ce compte n'est pas administrateur. Seul un admin existant peut te donner les droits, depuis ce panel.");
    return;
  }
  panel();
}

/* ---------------- Panel ---------------- */
/* ---------------- Onglets ---------------- */
const ONGLETS = [
  ["jeux", "🎮 Jeux"], ["categories", "🗂️ Catégories"], ["comptes", "👥 Comptes"],
  ["moderation", "🛡️ Modération"], ["annonce", "📢 Annonce"]
];
async function panel(){
  main.innerHTML = "";
  let regl = {};
  try{ regl = (await Compte.db("reglages", {auth: false})) || {}; }catch(e){ toast("Réglages illisibles : " + e.message, true); }
  const barre = el("nav", "", "onglets"), zone = el("div");
  main.append(barre, zone);
  const ouvrir = id => {
    if(!ONGLETS.some(o => o[0] === id)) id = "jeux";
    try{ localStorage.setItem("admin_onglet", id); }catch(e){}
    [...barre.children].forEach(b => b.classList.toggle("on", b.dataset.id === id));
    zone.innerHTML = "";
    ({jeux: ongletJeux, categories: ongletCategories, comptes: ongletComptes, moderation: ongletModeration, annonce: ongletAnnonce})[id](zone, regl);
  };
  ONGLETS.forEach(([id, t]) => { const b = el("button", t); b.dataset.id = id; b.onclick = () => ouvrir(id); barre.appendChild(b); });
  let dernier = "jeux"; try{ dernier = localStorage.getItem("admin_onglet") || "jeux"; }catch(e){}
  ouvrir(dernier);
}

async function ongletAnnonce(main, regl){
  const pa = el("div", "", "panel");
  pa.appendChild(el("h2", "📢 Annonce sur l'accueil"));
  pa.appendChild(el("p", "Un message affiché en haut de la page d'accueil (nouveau jeu, maintenance, soirée jeux…).", "hint"));
  const ta = el("textarea"); ta.maxLength = 200; ta.value = (regl.annonce && regl.annonce.texte) || "";
  ta.placeholder = "Ex. : 🎉 Nouveau jeu : Démineur ! Soirée quiz vendredi 21 h.";
  const r = el("div", "", "row"); r.style.marginTop = "10px";
  const lab = el("label"); const cb = el("input"); cb.type = "checkbox"; cb.checked = !!(regl.annonce && regl.annonce.actif);
  lab.append(cb, " Afficher l'annonce"); lab.style.flex = "1";
  const sv = el("button", "Enregistrer");
  sv.onclick = async () => {
    sv.disabled = true;
    try{ await Compte.db("reglages/annonce", {method: "PUT", body: {texte: ta.value.trim(), actif: cb.checked}}); toast("Annonce enregistrée"); }
    catch(e){ toast(e.message, true); }
    sv.disabled = false;
  };
  r.append(lab, sv); pa.append(ta, r); main.appendChild(pa);
}

async function ongletJeux(main, regl){
  const pj = el("div", "", "panel");
  const tete = el("div", "", "tete"); tete.appendChild(el("h2", "🎮 Jeux"));
  const razOrdre = el("button", "↺ Ordre du code", "ghost mini");
  razOrdre.title = "Revenir à l'ordre défini dans catalogue.js";
  razOrdre.disabled = !regl.ordre;
  tete.appendChild(razOrdre); pj.appendChild(tete);
  pj.appendChild(el("p", "Ordre sur l'accueil : glisse un jeu par sa poignée ⠿ (ou utilise ▲▼) · Visible = sur l'accueil et jouable · Bientôt = grisé, sans lien · Caché = absent de l'accueil et bloqué par adresse directe (sauf pour les admins). Les changements sont enregistrés tout de suite.", "hint"));
  const liste = el("div", "", "jeux"); pj.appendChild(liste); main.appendChild(pj);
  const jeuxRegl = regl.jeux || {};

  /* Ordre d'affichage */
  const majFleches = () => {
    const l = [...liste.children];
    l.forEach((r, i) => { r.querySelector(".haut").disabled = i === 0; r.querySelector(".bas").disabled = i === l.length - 1; });
  };
  let tOrdre;
  const sauverOrdre = () => {
    clearTimeout(tOrdre);
    tOrdre = setTimeout(async () => {
      const ordre = [...liste.children].map(r => r.dataset.slug);
      try{ await Compte.db("reglages/ordre", {method: "PUT", body: ordre}); razOrdre.disabled = false; toast("Ordre enregistré"); }
      catch(e){ toast(e.message, true); }
    }, 500);
  };
  const deplacer = (ligne, sens) => {
    const voisin = sens < 0 ? ligne.previousElementSibling : ligne.nextElementSibling;
    if(!voisin) return;
    if(sens < 0) liste.insertBefore(ligne, voisin); else liste.insertBefore(voisin, ligne);
    ligne.classList.add("bouge"); setTimeout(() => ligne.classList.remove("bouge"), 400);
    ligne.scrollIntoView({block: "nearest", behavior: "smooth"});
    majFleches(); sauverOrdre();
  };
  razOrdre.onclick = async () => {
    if(!confirm("Remettre les jeux dans l'ordre du code ?")) return;
    razOrdre.disabled = true;
    try{
      await Compte.db("reglages/ordre", {method: "DELETE"});
      SALLE_CATALOGUE.forEach(g => { const r = liste.querySelector(`[data-slug="${g.slug}"]`); if(r) liste.appendChild(r); });
      majFleches(); toast("Ordre du code rétabli");
    }catch(e){ razOrdre.disabled = false; toast(e.message, true); }
  };

  for(const g of Compte.trier(SALLE_CATALOGUE, regl)){
    const ligne = el("div", "", "jeu"); ligne.dataset.slug = g.slug;
    const fl = el("div", "", "fleches");
    const up = el("button", "▲", "haut"); up.title = "Monter"; up.setAttribute("aria-label", "Monter " + g.title);
    const dn = el("button", "▼", "bas"); dn.title = "Descendre"; dn.setAttribute("aria-label", "Descendre " + g.title);
    up.onclick = () => deplacer(ligne, -1); dn.onclick = () => deplacer(ligne, 1);
    fl.append(up, dn);
    const poignee = el("div", "⠿", "poignee"); poignee.title = "Glisser pour déplacer"; poignee.setAttribute("aria-hidden", "true");
    let glisse = null, defile = null;
    const survoler = y => {
      for(const r of liste.children){
        if(r === ligne) continue;
        const b = r.getBoundingClientRect();
        if(y >= b.top && y <= b.bottom){
          const ref = y < b.top + b.height / 2 ? r : r.nextSibling;
          if(ref !== ligne && ref !== ligne.nextSibling) liste.insertBefore(ligne, ref);
          break;
        }
      }
    };
    poignee.onpointerdown = e => {
      if(e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      glisse = {y: e.clientY, id: e.pointerId, avant: [...liste.children].map(r => r.dataset.slug).join()};
      /* suivi au niveau de la fenêtre : déplacer la ligne dans la page ne coupe pas le glisser */
      addEventListener("pointermove", bouger);
      addEventListener("pointerup", lacher);
      addEventListener("pointercancel", lacher);
      ligne.classList.add("glisse"); document.body.classList.add("en-glisse");
      /* défilement automatique près des bords de l'écran */
      defile = setInterval(() => {
        if(!glisse) return;
        const v = glisse.y < 70 ? -14 : glisse.y > innerHeight - 70 ? 14 : 0;
        if(v){ window.scrollBy(0, v); survoler(glisse.y); }
      }, 30);
    };
    const bouger = e => { if(!glisse || e.pointerId !== glisse.id) return; e.preventDefault(); glisse.y = e.clientY; survoler(e.clientY); };
    const lacher = e => {
      if(!glisse || (e && e.pointerId !== glisse.id)) return;
      clearInterval(defile);
      removeEventListener("pointermove", bouger);
      removeEventListener("pointerup", lacher);
      removeEventListener("pointercancel", lacher);
      const change = [...liste.children].map(r => r.dataset.slug).join() !== glisse.avant;
      glisse = null;
      ligne.classList.remove("glisse"); document.body.classList.remove("en-glisse");
      majFleches();
      if(change){ ligne.classList.add("bouge"); setTimeout(() => ligne.classList.remove("bouge"), 400); sauverOrdre(); }
    };

    const em = el("div", g.emoji || "🎲", "em");
    const info = el("div"); info.appendChild(el("b", g.title + (g.ia ? " 🤖" : "")));
    const def = el("small"); info.appendChild(def);
    const ctl = el("div", "", "ctl");
    const seg = el("div", "", "seg");
    const badge = el("input", "", "badge-in"); badge.type = "text"; badge.maxLength = 20; badge.placeholder = "Badge";
    const voir = el("a", "👁", "btn ghost mini"); voir.style.cssText = "background:transparent;color:var(--text);border:1px solid var(--line)";
    voir.title = "Ouvrir le jeu"; voir.href = "../jeux/" + g.slug + "/"; voir.target = "_blank";
    const raz = el("button", "↺", "ghost mini"); raz.title = "Revenir au réglage par défaut du code";

    const maj = () => {
      const st = Compte.etatDe(g, {jeux: jeuxRegl});
      seg.querySelectorAll("button").forEach(b => b.className = b.dataset.e === st.etat ? "on " + st.etat : "");
      if(document.activeElement !== badge) badge.value = st.badge;
      const perso = !!jeuxRegl[g.slug];
      def.textContent = perso ? "Réglé depuis le panel" : "Réglage par défaut du code";
      raz.disabled = !perso;
    };
    const enregistrer = async (patch) => {
      const avant = jeuxRegl[g.slug];
      const st = Compte.etatDe(g, {jeux: jeuxRegl});
      const nv = {etat: st.etat, badge: st.badge, ...patch};
      jeuxRegl[g.slug] = nv; maj();
      try{ await Compte.db("reglages/jeux/" + g.slug, {method: "PUT", body: nv}); toast(g.title + " : enregistré"); }
      catch(e){ if(avant) jeuxRegl[g.slug] = avant; else delete jeuxRegl[g.slug]; maj(); toast(e.message, true); }
    };
    [["dispo", "Visible"], ["bientot", "Bientôt"], ["cache", "Caché"]].forEach(([k, t]) => {
      const b = el("button", t); b.dataset.e = k;
      b.onclick = () => enregistrer({etat: k});
      seg.appendChild(b);
    });
    badge.onchange = () => enregistrer({badge: badge.value.trim()});
    raz.onclick = async () => {
      const avant = jeuxRegl[g.slug]; delete jeuxRegl[g.slug]; maj();
      try{ await Compte.db("reglages/jeux/" + g.slug, {method: "DELETE"}); toast(g.title + " : réglage par défaut"); }
      catch(e){ jeuxRegl[g.slug] = avant; maj(); toast(e.message, true); }
    };
    if(g.sansPage) voir.style.visibility = "hidden";
    ctl.append(seg, badge, voir, raz);
    ligne.append(poignee, fl, em, info, ctl);
    liste.appendChild(ligne);
    maj();
  }
  majFleches();
}

async function ongletModeration(main){
  const pm = el("div", "", "panel"); main.appendChild(pm);
  Moderation(pm);
}

async function ongletComptes(main){
  const pc = el("div", "", "panel");
  pc.appendChild(el("h2", "👥 Comptes"));
  const zc = el("div"); zc.appendChild(el("p", "Chargement…", "hint"));
  pc.appendChild(zc); main.appendChild(pc);
  try{
    const [comptes, admins0, ia0] = await Promise.all([Compte.db("comptes"), Compte.db("admins"), Compte.db("acces_ia").catch(() => null)]);
    const admins = admins0 || {}, ia = ia0 || {};
    const l = Object.entries(comptes || {}).map(([uid, c]) => ({uid, ...c})).sort((a, b) => (b.cree || 0) - (a.cree || 0));
    zc.innerHTML = "";
    const nIA = l.filter(c => admins[c.uid] || ia[c.uid]).length;
    zc.appendChild(el("p", `${l.length} compte${l.length > 1 ? "s" : ""} · ${Object.keys(admins).length} admin${Object.keys(admins).length > 1 ? "s" : ""} · ${nIA} avec accès IA. Les jeux IA (🤖) sont réservés aux comptes avec accès IA ; les autres ne peuvent que rejoindre une salle avec un lien envoyé par un membre.`, "hint"));
    if(!l.length) return;
    const t = el("table");
    t.innerHTML = "<thead><tr><th>Pseudo</th><th>Inscrit le</th><th>🤖 Accès IA</th><th>Admin</th><th></th></tr></thead>";
    const tb = el("tbody"); t.appendChild(tb);
    const moi = Compte.session().uid;
    for(const c of l){
      const tr = el("tr");
      const td1 = el("td", (c.pseudo || "?") + (c.uid === moi ? " (toi)" : ""));
      const td2 = el("td", c.cree ? new Date(c.cree).toLocaleDateString("fr-FR", {day: "numeric", month: "short", year: "numeric"}) : "—");
      const td3 = el("td");
      const tdIA = el("td");
      const bIA = el("button");
      const majIA = () => {
        if(admins[c.uid]){ bIA.textContent = "✅ Oui (admin)"; bIA.className = "ghost mini"; bIA.disabled = true; bIA.title = "Les admins ont toujours accès"; return; }
        bIA.disabled = false; bIA.title = "";
        bIA.textContent = ia[c.uid] ? "✅ Autorisé" : "Autoriser"; bIA.className = ia[c.uid] ? "mini" : "ghost mini";
      };
      bIA.onclick = async () => {
        const devient = !ia[c.uid];
        bIA.disabled = true;
        try{
          await Compte.db("acces_ia/" + c.uid, devient ? {method: "PUT", body: true} : {method: "DELETE"});
          if(devient) ia[c.uid] = true; else delete ia[c.uid];
          toast(devient ? c.pseudo + " a accès aux jeux IA" : c.pseudo + " n'a plus accès aux jeux IA");
        }catch(e){ toast(e.message, true); }
        majIA();
      };
      majIA(); tdIA.appendChild(bIA);
      const est = !!(admins && admins[c.uid]);
      const b = el("button", est ? "⭐ Admin" : "Nommer admin", est ? "mini" : "ghost mini");
      if(c.uid === moi){ b.disabled = true; b.title = "Tu ne peux pas te retirer toi-même"; }
      b.onclick = async () => {
        const devient = !(admins && admins[c.uid]);
        if(!confirm(devient ? `Donner les droits admin à ${c.pseudo} ?` : `Retirer les droits admin de ${c.pseudo} ?`)) return;
        b.disabled = true;
        try{
          await Compte.db("admins/" + c.uid, devient ? {method: "PUT", body: true} : {method: "DELETE"});
          if(devient) admins[c.uid] = true; else delete admins[c.uid];
          b.textContent = devient ? "⭐ Admin" : "Nommer admin"; b.className = devient ? "mini" : "ghost mini"; majIA();
          toast(devient ? c.pseudo + " est admin" : c.pseudo + " n'est plus admin");
        }catch(e){ toast(e.message, true); }
        b.disabled = false;
      };
      td3.appendChild(b);
      const td4 = el("td");
      const sup = el("button", "🗑️ Supprimer", "ghost mini");
      if(c.uid === moi){ sup.disabled = true; sup.title = "Tu ne peux pas supprimer ton propre compte d'ici"; }
      sup.onclick = () => {
        if(admins[c.uid]) return toast("Retire d'abord ses droits admin", true);
        supprimerCompte(c, () => tr.remove());
      };
      td4.appendChild(sup);
      tr.append(td1, td2, tdIA, td3, td4); tb.appendChild(tr);
    }
    zc.appendChild(t);
  }catch(e){
    zc.innerHTML = ""; zc.appendChild(el("p", "Impossible de lire les comptes : " + e.message, "hint"));
  }

}

/* ---------------- 🗂️ Catégories ----------------
   reglages/cats/<slug> = "jour soiree" (ou "" = aucune) : passe avant la
   liste par défaut de catalogue.js. ↺ supprime le choix du panel. */
async function ongletCategories(main, regl){
  const perso = regl.categories = regl.categories || {};
  const choix = regl.cats = regl.cats || {};
  const redessiner = () => { main.innerHTML = ""; ongletCategories(main, regl); };
  const enregistrer = async (chemin, opts, ok, applique) => {
    try{ await Compte.db("reglages/categories/" + chemin, opts); applique(); toast(ok); redessiner(); }
    catch(e){ toast(e.message, true); }
  };
  /* toutes les catégories, masquées comprises (pour pouvoir les réafficher) */
  const masquees = Object.fromEntries(Object.entries(perso).filter(([, p]) => p && p.suppr).map(([id]) => [id, true]));
  const sansMasque = Object.fromEntries(Object.entries(perso).map(([id, p]) => [id, {...p, suppr: false}]));
  const toutes = SALLE_CATS({...regl, categories: sansMasque});
  const visibles = toutes.filter(c => !masquees[c.id]);

  /* ---------- 1. Les catégories ---------- */
  const p1 = el("div", "", "panel"); main.appendChild(p1);
  const tete = el("div", "", "tete"); tete.appendChild(el("h2", "🗂️ Les catégories"));
  const nouvelle = el("button", "+ Nouvelle catégorie", "mini"); tete.appendChild(nouvelle);
  p1.appendChild(tete);
  p1.appendChild(el("p", "Crée, renomme, réordonne ou masque les catégories de l'accueil. Les catégories d'origine peuvent être masquées puis réaffichées ; celles que tu crées peuvent être supprimées.", "hint"));
  const defs = el("div"); p1.appendChild(defs);

  const carteCat = (c, i, creation) => {
    const box = el("div", "", "cat-def" + (masquees[c.id] ? " masquee" : ""));
    const apercu = el("div", c.emoji, "apercu");
    const peindre = () => { apercu.textContent = emo.value || "🎲"; apercu.style.background = `linear-gradient(135deg,${c1.value},${c2.value})`; };
    const champs = el("div", "", "champs");
    const emo = el("input"); emo.type = "text"; emo.maxLength = 8; emo.value = c.emoji; emo.placeholder = "🎲"; emo.setAttribute("aria-label", "Emoji");
    const titre = el("input"); titre.type = "text"; titre.maxLength = 40; titre.value = c.titre; titre.placeholder = "Nom de la catégorie"; titre.setAttribute("aria-label", "Nom");
    const desc = el("input", "", "large"); desc.type = "text"; desc.maxLength = 200; desc.value = c.desc || ""; desc.placeholder = "Une phrase qui dit ce qu'on y trouve"; desc.setAttribute("aria-label", "Description");
    const coul = el("div", "", "couleurs");
    const c1 = el("input"); c1.type = "color"; c1.value = c.c[0]; c1.setAttribute("aria-label", "Couleur 1");
    const c2 = el("input"); c2.type = "color"; c2.value = c.c[1]; c2.setAttribute("aria-label", "Couleur 2");
    coul.append("Couleurs", c1, c2, el("span", masquees[c.id] ? " · masquée sur l'accueil" : creation ? "" : ` · ${c.jeux.length} jeu${c.jeux.length > 1 ? "x" : ""}`));
    [emo, c1, c2].forEach(x => x.oninput = peindre);
    champs.append(emo, titre, desc, coul);
    const act = el("div", "", "actions");
    const sauv = el("button", creation ? "Créer" : "Enregistrer", "mini");
    sauv.onclick = () => {
      const t = titre.value.trim();
      if(!t) return toast("Donne un nom à la catégorie", true);
      const champsCat = {titre: t, emoji: emo.value.trim() || "🎲", desc: desc.value.trim(), c1: c1.value, c2: c2.value};
      if(creation){
        let base = t.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, "").replace(/^[0-9]+/, "").slice(0, 16) || "cat";
        if(base.length < 2) base += "x";
        let id = base, n = 2;
        while(toutes.some(x => x.id === id) || perso[id]) id = base + n++;
        const o = Math.max(0, ...toutes.map(x => x.o)) + 10;
        enregistrer(id, {method: "PUT", body: {...champsCat, o}}, `Catégorie « ${t} » créée`, () => { perso[id] = {...champsCat, o}; });
      }else enregistrer(c.id, {method: "PATCH", body: champsCat}, `« ${t} » enregistrée`, () => { perso[c.id] = {...(perso[c.id] || {}), ...champsCat}; });
    };
    act.appendChild(sauv);
    if(creation){
      const ann = el("button", "Annuler", "ghost mini"); ann.onclick = redessiner; act.appendChild(ann);
    }else{
      const fl = el("div", "", "row"); fl.style.gap = "4px";
      const haut = el("button", "▲", "ghost mini"), bas = el("button", "▼", "ghost mini");
      haut.title = "Monter"; bas.title = "Descendre";
      haut.disabled = i === 0; bas.disabled = i === toutes.length - 1;
      const echanger = voisin => {
        const a = c.o, b = voisin.o === a ? a + 1 : voisin.o;
        Promise.all([Compte.db("reglages/categories/" + c.id, {method: "PATCH", body: {o: b}}), Compte.db("reglages/categories/" + voisin.id, {method: "PATCH", body: {o: a}})])
          .then(() => { perso[c.id] = {...(perso[c.id] || {}), o: b}; perso[voisin.id] = {...(perso[voisin.id] || {}), o: a}; toast("Ordre enregistré"); redessiner(); })
          .catch(e => toast(e.message, true));
      };
      haut.onclick = () => echanger(toutes[i - 1]); bas.onclick = () => echanger(toutes[i + 1]);
      fl.append(haut, bas); act.appendChild(fl);
      if(c.code){
        const m = el("button", masquees[c.id] ? "Afficher" : "Masquer", "ghost mini");
        m.onclick = () => masquees[c.id]
          ? enregistrer(c.id + "/suppr", {method: "DELETE"}, `« ${c.titre} » réaffichée`, () => { delete perso[c.id].suppr; })
          : enregistrer(c.id, {method: "PATCH", body: {suppr: true}}, `« ${c.titre} » masquée`, () => { perso[c.id] = {...(perso[c.id] || {}), suppr: true}; });
        act.appendChild(m);
        if(perso[c.id]){
          const raz = el("button", "↺ D'origine", "ghost mini"); raz.title = "Nom, couleurs, place et affichage d'origine";
          raz.onclick = () => confirm(`Remettre « ${c.titre} » comme à l'origine ?`) && enregistrer(c.id, {method: "DELETE"}, "Catégorie remise d'origine", () => { delete perso[c.id]; });
          act.appendChild(raz);
        }
      }else{
        const sup = el("button", "Supprimer", "ghost mini");
        sup.onclick = () => confirm(`Supprimer la catégorie « ${c.titre} » ? Ses jeux restent dans leurs autres catégories (ou vont dans Arcade et solo).`)
          && enregistrer(c.id, {method: "DELETE"}, `« ${c.titre} » supprimée`, () => { delete perso[c.id]; });
        act.appendChild(sup);
      }
    }
    box.append(apercu, champs, act);
    peindre();
    return box;
  };
  toutes.forEach((c, i) => defs.appendChild(carteCat(c, i, false)));
  nouvelle.onclick = () => {
    if(defs.querySelector(".creation")) return;
    const b = carteCat({id: "", emoji: "🎲", titre: "", desc: "", c: ["#8b4dff", "#ff4f7b"], jeux: []}, -1, true);
    b.classList.add("creation"); defs.prepend(b); b.querySelector("input[aria-label=Nom]").focus();
  };

  /* ---------- 2. Les jeux de chaque catégorie ---------- */
  const p2 = el("div", "", "panel"); main.appendChild(p2);
  p2.appendChild(el("h2", "🎮 Les jeux de chaque catégorie"));
  p2.appendChild(el("p", "Touche une catégorie pour y mettre ou en retirer le jeu. Un jeu peut être dans plusieurs catégories. Un jeu sans catégorie va dans « Arcade et solo ». Enregistré tout de suite.", "hint"));
  const resume = el("div", "", "cats-resume"); p2.appendChild(resume);
  const liste = el("div", "", "jeux"); p2.appendChild(liste);
  const dansCat = g => typeof choix[g.slug] === "string" ? choix[g.slug].split(" ").filter(Boolean)
    : SALLE_CATEGORIES.filter(c => c.jeux.includes(g.slug)).map(c => c.id);
  const majResume = () => {
    resume.innerHTML = "";
    visibles.forEach(c => resume.appendChild(el("span", `${c.emoji} ${c.titre} : ${SALLE_JEUX_DE(c.id, regl).length}`)));
  };
  for(const g of Compte.trier(SALLE_CATALOGUE, regl)){
    const ligne = el("div", "", "jeu cat-ligne");
    const info = el("div"); info.appendChild(el("b", g.title + (g.ia ? " 🤖" : "")));
    const note = el("small"); info.appendChild(note);
    const puces = el("div", "", "puces");
    const raz = el("button", "↺", "ghost mini"); raz.title = "Revenir aux catégories par défaut";
    const dessiner = () => {
      const ids = dansCat(g);
      puces.querySelectorAll("button").forEach(b => b.classList.toggle("on", ids.includes(b.dataset.id)));
      const perso2 = typeof choix[g.slug] === "string";
      const aucune = !ids.some(id => visibles.some(c => c.id === id));
      note.textContent = (aucune ? "Aucune catégorie → Arcade et solo · " : "") + (perso2 ? "Choisi dans le panel" : "Par défaut");
      note.className = aucune ? "alerte" : "";
      raz.disabled = !perso2;
      majResume();
    };
    const sauver = async ids => {
      const avant = choix[g.slug];
      choix[g.slug] = ids.join(" "); dessiner();
      try{ await Compte.db("reglages/cats/" + g.slug, {method: "PUT", body: choix[g.slug]}); toast(g.title + " : catégories enregistrées"); }
      catch(e){ if(avant === undefined) delete choix[g.slug]; else choix[g.slug] = avant; dessiner(); toast(e.message, true); }
    };
    visibles.forEach(c => {
      const b = el("button", c.emoji + " " + c.titre); b.dataset.id = c.id; b.type = "button";
      b.onclick = () => {
        const ids = dansCat(g);
        sauver(ids.includes(c.id) ? ids.filter(x => x !== c.id) : [...ids, c.id]);
      };
      puces.appendChild(b);
    });
    raz.onclick = async () => {
      const avant = choix[g.slug]; delete choix[g.slug]; dessiner();
      try{ await Compte.db("reglages/cats/" + g.slug, {method: "DELETE"}); toast(g.title + " : catégories par défaut"); }
      catch(e){ choix[g.slug] = avant; dessiner(); toast(e.message, true); }
    };
    ligne.append(el("div", g.emoji || "🎲", "em"), info, puces, raz);
    liste.appendChild(ligne);
    dessiner();
  }
}

/* ---------------- 🗑️ Supprimer un compte ----------------
   Le navigateur ne peut pas effacer l'identifiant de connexion (Firebase
   Authentication) : on efface toutes ses données, on le bannit, et on
   donne le lien de la console pour supprimer la connexion elle-même. */
async function supprimerCompte(c, fini){
  const cle = Compte.cleDePseudo(c.pseudo);
  const login = cle + "@joueurs.salle-de-jeux-249d2.firebaseapp.com";
  if(!confirm(`Supprimer le compte « ${c.pseudo} » ?\n\nSes données sont effacées : profil, pseudo, amis, demandes, médailles, jetons du casino, sauvegarde de Défense. Il est aussi banni, pour qu'il ne puisse plus rien écrire.\n\nCe n'est pas annulable.`)) return;
  try{
    const u = c.uid, chemins = {};
    ["comptes", "profils", "amis", "demandes", "invitations", "medailles", "medailles_classement", "blackjack", "roulette", "rouletteLive", "defense_sauvegardes", "acces_ia"]
      .forEach(k => chemins[`${k}/${u}`] = null);
    if(cle.length >= 2 && await Compte.db("pseudos/" + cle, {auth: false}).catch(() => null) === u) chemins["pseudos/" + cle] = null;
    chemins["bannis/" + u] = true;
    await Compte.db("", {method: "PATCH", body: chemins});
    fini && fini();
    const d = document.createElement("dialog"); d.className = "fen";
    d.innerHTML = `<h2>✅ Données supprimées</h2>
      <p>Il reste son <b>identifiant de connexion</b>, que seul toi peux effacer, dans la console Firebase. Tant qu'il existe, le pseudo reste pris.</p>
      <ol><li>Ouvre la page des utilisateurs (bouton ci-dessous).</li><li>Cherche cet identifiant :</li></ol>
      <p><code class="login"></code> <button class="ghost mini copier">Copier</button></p>
      <ol start="3"><li>Menu ⋮ de la ligne → <b>Supprimer le compte</b>.</li></ol>
      <p class="hint">Ses scores des défis et des jeux solo sont rangés sous une autre identité (celle de son appareil) : supprime-les si besoin depuis l'onglet 🛡️ Modération.</p>
      <div class="row"><a class="btn" target="_blank" rel="noopener" href="https://console.firebase.google.com/project/salle-de-jeux-249d2/authentication/users">Ouvrir la console Firebase</a><button class="ghost fermer">Fermer</button></div>`;
    d.querySelector(".login").textContent = login;
    d.querySelector(".copier").onclick = () => navigator.clipboard.writeText(login).then(() => toast("Identifiant copié"), () => toast("Copie impossible", true));
    d.querySelector(".fermer").onclick = () => d.close();
    d.addEventListener("close", () => d.remove());
    document.body.appendChild(d); d.showModal();
  }catch(e){
    toast(/refusé/.test(e.message) ? "Refusé par la base : règles Firebase pas encore publiées ?" : e.message, true);
  }
}

/* On ne relance que si l'utilisateur ou ses droits changent (sinon boucle) */
const cleEtat = () => { const s = Compte.session(); return s ? s.uid + ":" + s.admin : ""; };
let dernier = cleEtat();
Compte.surChangement(() => { const k = cleEtat(); if(k !== dernier){ dernier = k; demarrer(); } });
demarrer();
</script>
