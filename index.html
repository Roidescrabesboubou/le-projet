<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salle de jeux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ef;--card:#fff;--text:#22192b;--muted:#776c80;--line:#ecdfd2;--accent:#e86a92;--soon:#c9bfd2}
@media (prefers-color-scheme:dark){:root{--bg:#17131c;--card:#231d2b;--text:#f3ecf6;--muted:#a99bb3;--line:#352c40;--soon:#4a4055}}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(circle at 15% 10%,rgba(232,106,146,.12),transparent 40%),radial-gradient(circle at 85% 30%,rgba(91,107,208,.12),transparent 40%)}
main{max-width:980px;margin:0 auto;padding:48px 16px 40px}
.hero{text-align:center;margin-bottom:36px}
.hero .logo{font-size:3rem;line-height:1}
h1{font-family:Fredoka,sans-serif;font-size:clamp(2rem,6vw,3.2rem);margin:10px 0 6px;letter-spacing:.5px}
.hero p{color:var(--muted);margin:0 auto;max-width:520px}
.filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:22px 0 28px}
.filters button{font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 16px}
.filters button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .18s,box-shadow .18s}
a.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.12)}
.cover{height:130px;display:flex;align-items:center;justify-content:center;font-size:3.4rem;background:linear-gradient(135deg,var(--c1),var(--c2))}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{font-family:Fredoka,sans-serif;font-size:1.25rem;margin:0}
.body p{margin:0;color:var(--muted);font-size:.92rem;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.play{align-self:flex-start;margin-top:4px;font-weight:700;background:var(--accent);color:#fff;border-radius:10px;padding:8px 16px}
.badge{position:absolute;top:10px;right:10px;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;background:#fff;color:#22192b}
.card.soon{opacity:.75}
.card.soon .cover{background:var(--soon);filter:grayscale(.4)}
.card.soon .play{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px}

.topbar{position:absolute;top:14px;right:16px;z-index:10;display:flex;align-items:center;gap:8px}
.reglages{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-decoration:none;font-size:1.15rem}
.reglages:hover{transform:rotate(30deg)}
.record{font-size:.82rem;font-weight:700;color:var(--text);background:var(--bg);border-radius:10px;padding:5px 9px;align-self:flex-start}
.annonce{margin:0 auto 24px;max-width:720px;padding:12px 18px;border-radius:14px;background:var(--card);border:2px dashed var(--accent);text-align:center;font-weight:700;white-space:pre-wrap}
.card.hidden-admin{opacity:.6;outline:2px dashed var(--muted)}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:40px}
</style>
</head>
<body>
<div class="topbar"><a class="reglages" href="reglages/" title="Réglages : pseudo, avatar, clés IA, sauvegarde">⚙️</a><div id="compte"></div></div>
<main>
  <div class="annonce" id="annonce" hidden></div>
  <section class="hero">
    <div class="logo">🎮</div>
    <h1>Salle de jeux</h1>
    <p>Une collection de mini-jeux à lancer directement dans ton navigateur. De nouveaux jeux arrivent régulièrement !</p>
  </section>

  <nav class="filters" id="filters"></nav>
  <section class="grid" id="grid"></section>

  <footer><span id="count"></span></footer>
</main>

<script src="jeux/commun/catalogue.js"></script>
<script src="jeux/commun/compte.js"></script>
<script src="jeux/commun/groupe.js"></script>
<script src="jeux/commun/base.js"></script>
<script>
const GAMES = window.SALLE_CATALOGUE;
const grid = document.getElementById("grid");
const filters = document.getElementById("filters");
let active = "Tous", regl = {};

Compte.bouton(document.getElementById("compte"));

/* Jeux tels qu'ils doivent apparaître (réglages admin appliqués) */
function visibles(){
  const admin = !!(Compte.session() && Compte.session().admin);
  return Compte.trier(GAMES, regl).map(g => ({...g, ...Compte.etatDe(g, regl)}))
    .filter(g => g.etat !== "cache" || admin);
}

function render(){
  grid.innerHTML = "";
  const list = visibles().filter(g => active === "Tous" || (g.tags || []).includes(active));
  if(!list.length){ grid.innerHTML = '<p class="empty">Aucun jeu dans cette catégorie pour l\'instant.</p>'; return; }
  for(const g of list){
    const ready = g.etat !== "bientot" && !g.sansPage;
    const cache = g.etat === "cache";
    const el = document.createElement(ready ? "a" : "div");
    el.className = "card" + (ready ? "" : " soon") + (cache ? " hidden-admin" : "");
    if(ready) el.href = "jeux/" + g.slug + "/";
    const [c1, c2] = g.colors || ["#ddd", "#bbb"];
    el.style.setProperty("--c1", c1);
    el.style.setProperty("--c2", c2);
    const badge = cache ? "🙈 Caché (visible car admin)" : ready ? (g.badge || "") : "Bientôt";
    el.innerHTML = `
      ${badge ? `<span class="badge"></span>` : ""}
      <div class="cover"></div>
      <div class="body">
        <h2></h2><p></p>
        <div class="tags"></div>
        ${ready && recordDe(g.slug) ? `<span class="record"></span>` : ""}
        <span class="play">${ready ? "▶ Jouer" : "En préparation"}</span>
      </div>`;
    if(badge) el.querySelector(".badge").textContent = badge;
    el.querySelector(".cover").textContent = g.emoji || "🎲";
    el.querySelector("h2").textContent = g.title;
    el.querySelector("p").textContent = g.desc || "";
    const rec = el.querySelector(".record");
    if(rec) rec.textContent = recordDe(g.slug);
    const t = el.querySelector(".tags");
    (g.tags || []).forEach(x => { const s = document.createElement("span"); s.textContent = x; t.appendChild(s); });
    grid.appendChild(el);
  }
}

/* Record du joueur sur cet appareil, affiché sur la carte du jeu.
   Les nouveaux jeux passent par Base.record() ; les anciens sont lus ici. */
function lireLS(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } }
const DLE = ["wordle", "loldle", "onepiecedle", "pokedle", "paysdle", "connexions", "anidle"];
function recordDe(slug){
  try{
    const r = Base.records()[slug];
    if(r && r.texte) return "🏆 " + r.texte;
    if(DLE.includes(slug)){
      const s = lireLS(slug + "_statsDaily", null);
      if(s && (s.best || s.streak)) return `🔥 Série ${s.streak || 0} · record ${s.best || 0}`;
    }
    if(slug === "blocs" || slug === "labyrinthe"){
      const l = lireLS(slug + "_scores", []);
      if(l.length) return "🏆 " + Math.max(...l.map(e => e.s || 0)).toLocaleString("fr-FR") + " pts";
    }
    if(slug === "demineur"){
      const a = lireLS("demineur_scores", {});
      for(const [k, n] of [["expert", "Expert"], ["moyen", "Moyen"], ["facile", "Facile"]])
        if(a[k] && a[k][0]) return `🏆 ${n} : ${(a[k][0].t / 1000).toLocaleString("fr-FR", {maximumFractionDigits: 1})} s`;
    }
    if(slug === "quiz"){
      const l = lireLS("qz_best", []);
      if(l[0]) return "🏆 " + l[0].sc.toLocaleString("fr-FR") + " pts";
    }
  }catch(e){}
  return "";
}

function renderFilters(){
  const tags = ["Tous", ...new Set(visibles().flatMap(g => g.tags || []))];
  if(!tags.includes(active)) active = "Tous";
  filters.innerHTML = "";
  for(const t of tags){
    const b = document.createElement("button");
    b.textContent = t;
    if(t === active) b.className = "on";
    b.onclick = () => { active = t; renderFilters(); render(); };
    filters.appendChild(b);
  }
}

function renderAnnonce(){
  const a = regl.annonce, box = document.getElementById("annonce");
  if(a && a.actif && a.texte){ box.textContent = a.texte; box.hidden = false; }
  else box.hidden = true;
}

function tout(){
  const n = visibles().filter(g => g.etat === "dispo" && !g.sansPage).length;
  document.getElementById("count").textContent = `${n} jeu${n > 1 ? "x" : ""} disponible${n > 1 ? "s" : ""} · d'autres arrivent bientôt`;
  renderAnnonce(); renderFilters(); render();
}

/* On attend les réglages (max ~3 s) pour ne pas montrer un jeu caché par erreur */
grid.innerHTML = '<p class="empty">Chargement des jeux…</p>';
Promise.race([Compte.reglages(), new Promise(r => setTimeout(() => r({}), 3000))])
  .then(r => { regl = r || {}; tout(); });
Compte.reglages().then(r => { if(JSON.stringify(r) !== JSON.stringify(regl)){ regl = r || {}; tout(); } });
Compte.surChangement(() => tout());
</script>
</body>
</html>
