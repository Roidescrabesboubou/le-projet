<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salle de jeux</title>
<meta name="description" content="Des mini-jeux à lancer dans le navigateur : défis du jour, parties entre amis en ligne, casino, jeux avec IA.">
<meta name="theme-color" content="#1d1a3a">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta property="og:title" content="Salle de jeux">
<meta property="og:description" content="Des mini-jeux à lancer dans le navigateur, seul ou entre amis.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* Salle de jeux — accueil. Idée : une boîte de jeux. Bords encrés, ombres pleines
   « en carton » décalées vers le bas, tuiles de lettres pour le titre. */
:root{
  --bg:#eef0fa;--card:#fff;--text:#1d1a3a;--muted:#5c5880;--line:#d5d8ec;--soft:#e2e5f5;
  --encre:#1d1a3a;--accent:#ff4f7b;--jeton:#ffc23d;--ok:#1f9a66;--soon:#c7c9dd;
  --bord:var(--encre);--ombre:0 4px 0 var(--encre);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13112a;--card:#1f1c3c;--text:#f1efff;--muted:#a6a2cc;--line:#36325f;--soft:#2a2650;
  --encre:#06051a;--bord:#4b467d;--soon:#3b3760;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:22px 22px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
main{max-width:1060px;margin:0 auto;padding:24px 16px 48px}

/* ---------- Haut de page ---------- */
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;max-width:1060px;margin:0 auto;padding:14px 16px 0}
.reglages{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--card);border:2px solid var(--line);text-decoration:none;font-size:1.1rem;transition:transform .2s}
.reglages:hover{transform:rotate(40deg)}
.md-compteur{height:40px;padding:0 12px;border-radius:12px;background:var(--card);border:2px solid var(--line);color:var(--text);font:800 .95rem Nunito,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.md-compteur:hover{border-color:var(--jeton)}
.topbar .cp-btn{border-width:2px;height:40px}

.hero{text-align:center;margin:6px 0 26px}
.tuiles{display:flex;justify-content:center;flex-wrap:wrap;gap:clamp(4px,1vw,8px);margin:0 0 18px;padding:0;font-size:clamp(1.5rem,6.2vw,3.3rem)}
.tuiles .mot{display:flex;gap:inherit}
.tuiles .mot+.mot{margin-left:clamp(8px,2.4vw,22px)}
.tuile{display:inline-flex;align-items:center;justify-content:center;width:1.3em;height:1.4em;border-radius:.22em;
  font-family:"Bricolage Grotesque",Nunito,sans-serif;font-weight:800;line-height:1;color:#fff;
  background:var(--t);border:3px solid var(--encre);box-shadow:0 .12em 0 var(--encre);transform:rotate(var(--r));
  text-shadow:0 2px 0 rgba(0,0,0,.2);animation:pose .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i) * 45ms)}
@keyframes pose{from{opacity:0;transform:translateY(-.8em) rotate(calc(var(--r) * -3))}}
@media (prefers-reduced-motion:reduce){.tuile{animation:none}}
.hero p{color:var(--muted);margin:0 auto;max-width:34em;font-size:1.05rem;line-height:1.5}

/* ---------- Annonce de l'admin ---------- */
.annonce{margin:0 auto 24px;max-width:720px;padding:12px 18px;border-radius:14px;background:var(--jeton);color:#1d1a3a;border:2px solid var(--encre);box-shadow:var(--ombre);text-align:center;font-weight:800;white-space:pre-wrap}

/* ---------- Filtres : une barre collante ---------- */
.filters{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:0 -16px 18px;padding:10px 16px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.filters button{font:inherit;font-weight:800;font-size:.9rem;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 14px;white-space:nowrap}
.filters button:hover{border-color:var(--text)}
.filters button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
@media (max-width:640px){
  .filters{position:sticky;top:0;z-index:20;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
}

/* ---------- Défis du jour ---------- */
.defis{display:flex;justify-content:center;align-items:center;gap:10px 14px;flex-wrap:wrap;margin:0 0 26px;padding:12px 16px;border-radius:16px;
  background:var(--card);border:2px solid var(--line);font-weight:800;font-size:.92rem}
.defis[hidden]{display:none}
.defis .barre{width:150px;height:12px;border-radius:99px;background:var(--soft);border:2px solid var(--line);overflow:hidden}
.defis .barre i{display:block;height:100%;background:var(--ok);border-radius:99px}
.defis .md{color:#9a6200}
@media (prefers-color-scheme:dark){.defis .md{color:var(--jeton)}}
.defis button{font:inherit;font-size:.82rem;font-weight:800;cursor:pointer;border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:4px 12px}
.defis button:hover{border-color:var(--text)}

/* ---------- Cartes de jeux ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px 18px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:2px solid var(--bord);border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;
  box-shadow:var(--ombre);transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-3px);box-shadow:0 7px 0 var(--encre)}
a.card:active{transform:translateY(2px);box-shadow:0 2px 0 var(--encre)}
.cover{height:120px;display:flex;align-items:center;justify-content:center;font-size:3.6rem;border-bottom:2px solid var(--bord);
  background:radial-gradient(rgba(255,255,255,.22) 1.5px,transparent 1.6px) 0 0/14px 14px,linear-gradient(135deg,var(--c1),var(--c2))}
a.card .cover{transition:font-size .15s}
a.card:hover .cover{font-size:4rem}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{font-family:"Bricolage Grotesque",Nunito,sans-serif;font-weight:800;font-size:1.28rem;letter-spacing:-.01em;margin:0}
.body p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.45;flex:1}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tags span{font-size:.74rem;font-weight:800;padding:2px 8px;border-radius:7px;background:var(--soft);color:var(--muted)}
.play{align-self:flex-start;margin-top:4px;font-weight:800;background:var(--accent);color:#fff;border:2px solid var(--encre);border-radius:999px;padding:6px 16px;box-shadow:0 3px 0 var(--encre)}
.badge{position:absolute;top:10px;right:10px;font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:999px;background:#fff;color:#1d1a3a;border:2px solid #1d1a3a;transform:rotate(3deg)}
.jour{position:absolute;top:10px;left:10px;font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:999px;color:#fff;border:2px solid #1d1a3a}
.jour.fait{background:var(--ok)}.jour.afaire{background:#d36a00}
.record{font-size:.82rem;font-weight:800;color:var(--text);background:var(--soft);border-radius:10px;padding:5px 9px;align-self:flex-start}
.card.soon{border-style:dashed;border-color:var(--muted);box-shadow:none}
.card.soon .cover{background:var(--soon);filter:grayscale(.5);border-bottom:2px dashed var(--muted)}
.card.soon .play{background:transparent;color:var(--muted);border:2px dashed var(--muted);box-shadow:none}
.card.hidden-admin{opacity:.6;outline:3px dashed var(--muted);outline-offset:3px}
.empty{text-align:center;color:var(--muted);padding:30px;grid-column:1/-1}
footer{text-align:center;color:var(--muted);font-size:.9rem;font-weight:700;margin-top:44px}

/* ---------- Catégories (page d'accueil) ---------- */
.choix{font-family:"Bricolage Grotesque",Nunito,sans-serif;font-weight:800;font-size:1.35rem;margin:0 0 14px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px 18px}
.cat{display:flex;flex-direction:column;text-align:left;font:inherit;cursor:pointer;padding:0;color:inherit;background:var(--card);border:2px solid var(--bord);border-radius:22px;overflow:hidden;
  box-shadow:var(--ombre);transition:transform .15s,box-shadow .15s}
.cat:hover{transform:translateY(-3px);box-shadow:0 7px 0 var(--encre)}
.cat:active{transform:translateY(2px);box-shadow:0 2px 0 var(--encre)}
.cat .bande{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:2px solid var(--bord);
  background:radial-gradient(rgba(255,255,255,.22) 1.5px,transparent 1.6px) 0 0/14px 14px,linear-gradient(135deg,var(--c1),var(--c2))}
.cat .gros{font-size:2.9rem;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.cat .mini{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;margin-left:auto;max-width:60%}
.cat .mini span{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.85);font-size:1.15rem}
.cat .corps{display:flex;flex-direction:column;gap:6px;padding:14px 18px 16px;flex:1}
.cat h2{font-family:"Bricolage Grotesque",Nunito,sans-serif;font-weight:800;font-size:1.4rem;letter-spacing:-.01em;margin:0}
.cat p{margin:0;color:var(--muted);font-size:.93rem;line-height:1.45;flex:1}
.cat .pied{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;font-weight:800;font-size:.9rem}
.cat .nb{color:var(--muted)}
.cat .ouvrir{white-space:nowrap;background:var(--accent);color:#fff;border:2px solid var(--encre);border-radius:999px;padding:4px 14px;box-shadow:0 3px 0 var(--encre)}
.cat .etat{white-space:nowrap;font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--text)}
.cat .etat.ok{background:var(--ok);color:#fff}
.tous{display:block;margin:22px auto 0;font:inherit;font-weight:800;cursor:pointer;border:2px dashed var(--muted);background:transparent;color:var(--text);border-radius:999px;padding:9px 22px}
.tous:hover{border-style:solid;border-color:var(--text)}

/* ---------- Vue d'une catégorie ---------- */
body.vue-cat .hero{display:none}
.entete-cat{display:flex;align-items:center;gap:14px;margin:4px 0 20px;flex-wrap:wrap}
.entete-cat .gros{font-size:2.6rem;line-height:1}
.entete-cat h2{font-family:"Bricolage Grotesque",Nunito,sans-serif;font-weight:800;font-size:clamp(1.5rem,4.5vw,2.1rem);letter-spacing:-.01em;margin:0}
.entete-cat p{margin:2px 0 0;color:var(--muted)}
.retour{font:inherit;font-weight:800;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px}
.retour:hover{border-color:var(--text)}
.entete-cat .retour{flex-basis:auto}
.entete-cat .titres{flex:1;min-width:200px}

/* ---------- Mode groupe ---------- */
.bandeau-groupe{display:flex;gap:8px 12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:0 0 22px;padding:10px 16px;border-radius:16px;
  background:#3d6bff;color:#fff;border:2px solid var(--encre);box-shadow:var(--ombre);font-weight:800;text-align:center}
.bandeau-groupe[hidden]{display:none}
.bandeau-groupe button{font:inherit;font-size:.85rem;font-weight:800;cursor:pointer;border:2px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:3px 12px}
.bandeau-groupe button:hover{background:#fff;color:#3d6bff}
.bandeau-groupe.tout{background:var(--card);color:var(--text);border-color:var(--line);box-shadow:none}
.bandeau-groupe.tout button{border-color:var(--line);color:var(--text)}
.bandeau-groupe.tout button:hover{background:var(--text);color:var(--bg)}

/* ---------- Fenêtre de bienvenue ---------- */
.lien-aide{font:inherit;font-weight:800;cursor:pointer;background:none;border:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;margin-top:10px;padding:4px}
dialog.b-fen{border:2px solid var(--bord);box-shadow:0 6px 0 var(--encre);border-radius:22px;background:var(--card);color:var(--text);padding:24px;width:min(480px,92vw);max-height:88vh;overflow:auto}
dialog.b-fen::backdrop{background:rgba(19,17,42,.55);backdrop-filter:blur(3px)}
dialog.b-fen h2{font-family:"Bricolage Grotesque",Nunito,sans-serif;font-weight:800;font-size:1.5rem;margin:0 0 10px;padding-right:30px;line-height:1.2}
dialog.b-fen .b-x{position:absolute;top:12px;right:14px;border:0;background:transparent;font-size:1.5rem;color:var(--muted);cursor:pointer}
dialog.b-fen p{margin:0 0 12px;line-height:1.5}
.points{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:10px}
.points li{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:10px 12px;line-height:1.45}
.points li b{display:block}
.points .ico{font-size:1.6rem;line-height:1.1}
.btn{font:inherit;border:2px solid var(--encre);border-radius:12px;padding:9px 18px;font-weight:800;background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--encre);cursor:pointer;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--encre)}
</style>
</head>
<body>
<div class="topbar"><span id="medailles"></span><a class="reglages" href="reglages/" title="Réglages : pseudo, avatar, clés IA, sauvegarde" aria-label="Réglages">⚙️</a><div id="compte"></div></div>
<main>
  <div class="annonce" id="annonce" hidden></div>
  <section class="hero">
    <h1 class="tuiles" id="titre" aria-label="Salle de jeux">Salle de jeux</h1>
    <p>Des mini-jeux à lancer tout de suite : un défi par jour, des parties entre amis en ligne, et quelques jeux où l'IA mène la danse.</p>
    <button class="lien-aide" id="aide" type="button">Comment ça marche ?</button>
  </section>

  <div class="bandeau-groupe" id="bandeauGroupe" hidden></div>
  <div class="defis" id="defis" hidden></div>

  <section id="accueil">
    <h2 class="choix">Choisis une catégorie</h2>
    <div class="cats" id="cats"></div>
  </section>

  <section id="vueCat" hidden>
    <div class="entete-cat" id="enteteCat"></div>
    <section class="grid" id="grid"></section>
  </section>

  <footer><span id="count"></span></footer>
</main>

<script src="jeux/commun/catalogue.js"></script>
<script src="jeux/commun/compte.js"></script>
<script src="jeux/commun/groupe.js"></script>
<script src="jeux/commun/medailles.js"></script>
<script src="jeux/commun/base.js"></script>
<script>
/* Titre en tuiles de lettres (décoratif : les lecteurs d'écran lisent « Salle de jeux ») */
(function(){
  const h = document.getElementById("titre"), C = ["#ff4f7b","#f59e0b","#1f9a66","#3d6bff","#8b4dff","#ff6a2b"];
  h.textContent = ""; let i = 0;
  "SALLE DE JEUX".split(" ").forEach(m => {
    const w = document.createElement("span"); w.className = "mot"; w.setAttribute("aria-hidden", "true");
    for(const c of m){
      const t = document.createElement("span"); t.className = "tuile"; t.textContent = c;
      t.style.cssText = `--t:${C[i % C.length]};--r:${[-4,3,-2,4,-3,2,-1][i % 7]}deg;--i:${i}`;
      w.appendChild(t); i++;
    }
    h.appendChild(w);
  });
})();
const GAMES = window.SALLE_CATALOGUE;
const grid = document.getElementById("grid");
let regl = {};

Compte.bouton(document.getElementById("compte"));

/* Jeux tels qu'ils doivent apparaître (réglages admin appliqués).
   Les jeux IA ne s'affichent qu'aux comptes autorisés (accès IA donné dans l'admin) ;
   les invités venus par un lien de salle y entrent quand même par le lien. */
function visibles(){
  const s = Compte.session(), admin = !!(s && s.admin), ia = !!(s && (s.ia || s.admin));
  return Compte.trier(GAMES, regl).map(g => ({...g, ...Compte.etatDe(g, regl)}))
    .filter(g => (g.etat !== "cache" || admin) && (!g.ia || ia));
}

function render(){
  grid.innerHTML = "";
  const list = jeuxDeLaVue();
  if(!list.length){ grid.innerHTML = filtreGroupe() ? '<p class="empty">Aucun jeu à plusieurs ici. Touche « Voir tous les jeux » en haut pour tout afficher.</p>' : '<p class="empty">Aucun jeu dans cette catégorie pour l\'instant.</p>'; return; }
  for(const g of list){
    const ready = g.etat !== "bientot" && !g.sansPage;
    const cache = g.etat === "cache";
    const el = document.createElement(ready ? "a" : "div");
    el.className = "card" + (ready ? "" : " soon") + (cache ? " hidden-admin" : "");
    if(ready) el.href = "jeux/" + g.slug + "/";
    const [c1, c2] = g.colors || ["#ddd", "#bbb"];
    el.style.setProperty("--c1", c1);
    el.style.setProperty("--c2", c2);
    const badge = cache ? "🙈 Caché (visible car admin)" : ready ? (g.badge || "") : "Bientôt";
    el.innerHTML = `
      ${badge ? `<span class="badge"></span>` : ""}
      ${ready && etatJour(g.slug) ? `<span class="jour"></span>` : ""}
      <div class="cover"></div>
      <div class="body">
        <h2></h2><p></p>
        <div class="tags"></div>
        ${ready && recordDe(g.slug) ? `<span class="record"></span>` : ""}
        <span class="play">${ready ? "▶ Jouer" : "En préparation"}</span>
      </div>`;
    if(badge) el.querySelector(".badge").textContent = badge;
    el.querySelector(".cover").textContent = g.emoji || "🎲";
    el.querySelector("h2").textContent = g.title;
    el.querySelector("p").textContent = g.desc || "";
    const ej = el.querySelector(".jour");
    if(ej){ const e = etatJour(g.slug); ej.className = "jour " + (e.fait ? "fait" : "afaire");
      const md = medailleDuJour(g.slug);
      ej.textContent = e.fait ? `✅ Fait aujourd'hui${md ? ` · +${md.m} 🏅` : ""}` : e.serie ? `⏳ À faire · 🔥 ${e.serie} en jeu` : "⏳ À faire aujourd'hui"; }
    const rec = el.querySelector(".record");
    if(rec) rec.textContent = recordDe(g.slug);
    const t = el.querySelector(".tags");
    (g.tags || []).forEach(x => { const s = document.createElement("span"); s.textContent = x; t.appendChild(s); });
    grid.appendChild(el);
  }
}

/* Record du joueur sur cet appareil, affiché sur la carte du jeu.
   Les nouveaux jeux passent par Base.record() ; les anciens sont lus ici. */
function lireLS(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } }
const DLE = ["wordle", "loldle", "onepiecedle", "pokedle", "paysdle", "connexions", "anidle", "electrodle", "motscroises", "sudoku", "shikaku", "motsfleches", "chancedle"];
/* Défi du jour : fait ou pas aujourd'hui ?
   Chaque jeu numérote ses jours depuis sa date de lancement (START dans le jeu) :
   indique-la ici si elle n'est pas le 1er novembre 2026. */
const DEBUT_DLE = {anidle: [2026, 10, 3], electrodle: [2026, 10, 8], motscroises: [2026, 10, 4], shikaku: [2026, 10, 4], motsfleches: [2026, 10, 4], chancedle: [2026, 10, 10]};
function jourParis(slug){
  const [y, m, d] = new Intl.DateTimeFormat("en-CA", {timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit"}).format(new Date()).split("-").map(Number);
  const [sy, sm, sd] = DEBUT_DLE[slug] || [2026, 10, 1];
  return Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(sy, sm, sd)) / 864e5);
}
/* Médaille 🏅 gagnée aujourd'hui sur ce défi (ou null) */
function medailleDuJour(slug){
  try{ const j = window.Medailles && Medailles.etat()[Medailles.jour()]; return (j && j[slug]) || null; }catch(e){ return null; }
}
function etatJour(slug){
  if(slug === "coupdefeu"){
    const j = jourParis("coupdefeu");
    return {fait: !!(lireLS("cdf_jour_fait_" + j, 0) || medailleDuJour(slug)), serie: 0};
  }
  if(!DLE.includes(slug)) return null;
  const j = jourParis(slug), s = lireLS(slug + "_statsDaily", null) || {};
  const dernier = s.lastWin != null ? s.lastWin : s.last;
  return {fait: s.last === j || !!medailleDuJour(slug), serie: s.streak && dernier != null && dernier >= j - 1 ? s.streak : 0};
}
function renderDefis(){
  const z = document.getElementById("defis");
  if((vue && vue !== "jour") || filtreGroupe()){ z.hidden = true; return; }
  const l = visibles().filter(g => g.etat !== "bientot" && !g.sansPage && etatJour(g.slug));
  if(!l.length){ z.hidden = true; return; }
  const n = l.filter(g => etatJour(g.slug).fait).length;
  z.hidden = false; z.innerHTML = "";
  const t = document.createElement("span");
  t.textContent = n === l.length ? `🎉 Tous les défis du jour sont faits (${n}/${l.length}) !` : `📅 Défis du jour : ${n} / ${l.length} faits`;
  const b = document.createElement("div"); b.className = "barre";
  const i = document.createElement("i"); i.style.width = (n / l.length * 100) + "%"; b.appendChild(i);
  z.append(t, b);
  if(window.Medailles){
    const T = Medailles.totaux(), a = Medailles.etat()[Medailles.jour()] || {};
    const m = document.createElement("span"); m.className = "md";
    m.textContent = `🏅 +${T.auj} aujourd'hui` + (a._tous ? "" : ` · tous faits : +20 🏅`);
    const bm = document.createElement("button"); bm.textContent = "🏆 Classement"; bm.onclick = () => Medailles.fenetreClassement();
    const br = document.createElement("button"); br.textContent = "ℹ️ Médailles"; br.onclick = () => Medailles.fenetreRegles();
    z.append(m, bm, br);
  }
  if(n < l.length && vue !== "jour"){
    const bt = document.createElement("button"); bt.textContent = "Voir les défis du jour";
    bt.onclick = () => ouvrirCat("jour");
    z.appendChild(bt);
  }
}
function recordDe(slug){
  try{
    const r = Base.records()[slug];
    if(r && r.texte) return "🏆 " + r.texte;
    if(DLE.includes(slug)){
      const s = lireLS(slug + "_statsDaily", null), e = etatJour(slug);
      if(s && (s.best || s.streak)) return `🔥 Série ${e ? e.serie : s.streak || 0} · record ${s.best || 0}`;
    }
    if(slug === "blocs" || slug === "labyrinthe"){
      const l = lireLS(slug + "_scores", []);
      if(l.length) return "🏆 " + Math.max(...l.map(e => e.s || 0)).toLocaleString("fr-FR") + " pts";
    }
    if(slug === "demineur"){
      const a = lireLS("demineur_scores", {});
      for(const [k, n] of [["expert", "Expert"], ["moyen", "Moyen"], ["facile", "Facile"]])
        if(a[k] && a[k][0]) return `🏆 ${n} : ${(a[k][0].t / 1000).toLocaleString("fr-FR", {maximumFractionDigits: 1})} s`;
    }
    if(slug === "quiz"){
      const l = lireLS("qz_best", []);
      if(l[0]) return "🏆 " + l[0].sc.toLocaleString("fr-FR") + " pts";
    }
  }catch(e){}
  return "";
}


function renderAnnonce(){
  const a = regl.annonce, box = document.getElementById("annonce");
  if(a && a.actif && a.texte){ box.textContent = a.texte; box.hidden = false; }
  else box.hidden = true;
}

function tout(){
  const n = visibles().filter(g => g.etat === "dispo" && !g.sansPage).length;
  document.getElementById("count").textContent = `${n} jeu${n > 1 ? "x" : ""} disponible${n > 1 ? "s" : ""} · d'autres arrivent bientôt`;
  renderAnnonce(); afficher();
}

/* ================= Catégories, groupe et bienvenue =================
   L'accueil montre des catégories ; un clic ouvre la liste de ses jeux
   (adresse #jeux/<catégorie>, le bouton précédent revient aux catégories).
   Chaque jeu est rangé d'après ses étiquettes (tags de catalogue.js) ;
   un jeu qui n'entre dans aucune catégorie va dans « Solo et arcade ». */
const $ = id => document.getElementById(id);
const el = (tag, txt, cls) => { const e = document.createElement(tag); if(txt != null) e.textContent = txt; if(cls) e.className = cls; return e; };
const a = (g, t) => (g.tags || []).includes(t);
const pret = g => g.etat !== "bientot" && !g.sansPage;
/* Catégories choisies une par une avec le propriétaire du site : chaque catégorie
   liste ses jeux (slug). Un jeu peut figurer dans plusieurs listes. Un jeu qui
   n'est dans aucune liste (nouveau jeu oublié) va dans « Arcade et solo ». */
const CATS_FIXES = [
  {id: "jour", emoji: "📅", titre: "Défis du jour", c: ["#ffb020", "#ff6a2b"],
   desc: "Un nouveau défi chaque jour, le même pour tout le monde. Garde ta série et gagne des médailles.",
   jeux: ["wordle", "loldle", "onepiecedle", "pokedle", "electrodle", "anidle", "paysdle", "motscroises", "motsfleches", "sudoku", "connexions", "shikaku", "chancedle", "coupdefeu"]},
  {id: "soiree", emoji: "🎉", titre: "Soirée entre amis", c: ["#ff4f7b", "#8b4dff"],
   desc: "Des jeux de groupe où chacun joue sur son téléphone, il suffit d'un code de salle.",
   jeux: ["freestyle", "blindtest", "dessin", "telephone", "quiz", "imposteur", "categorie", "quiaditca", "emojis", "cadran"]},
  {id: "duels", emoji: "⚔️", titre: "Duels et plateau", c: ["#3d6bff", "#22b8cf"],
   desc: "Contre l'ordinateur ou contre un ami, sur le même écran ou en ligne.",
   jeux: ["puissance4", "bataille", "laser", "mainmise", "manufacture", "encheres"]},
  {id: "casino", emoji: "🎰", titre: "Casino", c: ["#0f7a4a", "#d4a017"],
   desc: "Poker, blackjack et roulette avec de faux jetons : 1 000 pour commencer.",
   jeux: ["poker", "blackjack", "roulette"]},
  {id: "ia", emoji: "🤖", titre: "Histoires avec l'IA", c: ["#5b2bd8", "#ff6a9a"],
   desc: "Des aventures racontées par une IA.",
   jeux: ["quintuplees", "jdr"]},
  {id: "arcade", emoji: "🕹️", titre: "Arcade et solo", c: ["#1f9a66", "#9bd34a"],
   desc: "Arcade, réflexion et gestion : des records à battre quand tu as un moment.",
   jeux: ["arene", "blocs", "labyrinthe", "demineur", "rocade", "defense", "eveil"]}
];
const categories = () => CATS_FIXES;
let CATS = CATS_FIXES;
function membresDe(cat, liste){
  const dans = liste.filter(g => cat.jeux.includes(g.slug));
  if(cat.id === "arcade") liste.forEach(g => { if(!dans.includes(g) && !CATS_FIXES.some(c => c.jeux.includes(g.slug))) dans.push(g); });
  return dans;
}

/* ---------- Groupe : seulement les jeux à plusieurs (étiquette « Multijoueur ») ---------- */
let groupe = !!(lireLS("salle_groupe_id", null) && Compte.session()), voirTout = false;
try{ voirTout = sessionStorage.getItem("salle_voir_tout") === "1"; }catch(e){}
const filtreGroupe = () => groupe && !voirTout;
function jeuxBase(){
  const l = visibles();
  return filtreGroupe() ? l.filter(g => a(g, "Multijoueur") && pret(g)) : l;
}
function renderGroupe(){
  const z = $("bandeauGroupe");
  if(!groupe){ z.hidden = true; return; }
  z.hidden = false; z.innerHTML = ""; z.className = "bandeau-groupe" + (voirTout ? " tout" : "");
  const b = el("button", voirTout ? "Seulement les jeux à plusieurs" : "Voir tous les jeux");
  b.type = "button";
  b.onclick = () => { voirTout = !voirTout; try{ sessionStorage.setItem("salle_voir_tout", voirTout ? "1" : "0"); }catch(e){} afficher(); };
  z.append(el("span", voirTout ? "👥 Tu es en groupe, tous les jeux sont affichés." : "👥 Tu es en groupe : voici les jeux à plusieurs."), b);
}

/* ---------- Navigation ---------- */
let vue = "";   // "" = catégories ; sinon l'id d'une catégorie
const lireVue = () => (location.hash.match(/^#jeux\/([a-z0-9-]+)$/) || [])[1] || "";
function ouvrirCat(id){
  if(id){ location.hash = "#jeux/" + id; return; }
  history.replaceState(null, "", location.pathname + location.search); vueChangee();
}
function vueChangee(){ vue = lireVue(); afficher(); scrollTo(0, 0); }
addEventListener("hashchange", vueChangee);

function jeuxDeLaVue(){
  const base = jeuxBase();
  const cat = CATS.find(c => c.id === vue);
  return cat ? membresDe(cat, base) : [];
}

function renderCats(){
  const z = $("cats"); z.innerHTML = "";
  const base = jeuxBase();
  for(const c of CATS){
    const l = membresDe(c, base).filter(pret);
    if(!l.length) continue;
    const b = el("button", null, "cat"); b.type = "button";
    b.style.setProperty("--c1", c.c[0]); b.style.setProperty("--c2", c.c[1]);
    const bande = el("div", null, "bande"), mini = el("div", null, "mini");
    l.slice(0, 6).forEach(g => { const s = el("span", g.emoji || "🎲"); s.title = g.title; mini.appendChild(s); });
    bande.append(el("span", c.emoji, "gros"), mini);
    const corps = el("div", null, "corps"), pied = el("div", null, "pied");
    if(c.id === "jour"){
      const dj = l.filter(g => etatJour(g.slug)), n = dj.filter(g => etatJour(g.slug).fait).length;
      pied.appendChild(el("span", n === dj.length ? `✅ ${n} / ${dj.length} faits` : `${n} / ${dj.length} faits`, "etat" + (n === dj.length ? " ok" : "")));
    }else pied.appendChild(el("span", `${l.length} jeu${l.length > 1 ? "x" : ""}`, "nb"));
    pied.appendChild(el("span", "Voir les jeux", "ouvrir"));
    corps.append(el("h2", c.titre), el("p", c.desc), pied);
    b.append(bande, corps);
    b.onclick = () => ouvrirCat(c.id);
    z.appendChild(b);
  }
  if(!z.children.length) z.appendChild(el("p", "Aucun jeu à afficher pour l'instant.", "empty"));
}

function renderEntete(cat){
  const z = $("enteteCat"); z.innerHTML = "";
  const r = el("button", "← Catégories", "retour"); r.type = "button";
  r.onclick = () => { if(history.length > 1 && lireVue()) history.back(); else ouvrirCat(""); };
  const t = el("div", null, "titres");
  t.append(el("h2", cat.titre), el("p", cat.desc));
  z.append(r, el("span", cat.emoji, "gros"), t);
}

function afficher(){
  CATS = categories(jeuxBase());
  const cat = CATS.find(c => c.id === vue) || null;
  if(vue && !cat) vue = "";
  document.body.classList.toggle("vue-cat", !!cat);
  $("accueil").hidden = !!cat; $("vueCat").hidden = !cat;
  renderGroupe(); renderDefis();
  if(!cat) return renderCats();
  renderEntete(cat);
  render();
}

/* ---------- Bienvenue (première visite) ---------- */
function bienvenue(){
  const d = el("dialog", null, "b-fen"); d.setAttribute("aria-labelledby", "bvTitre");
  d.innerHTML = `<button class="b-x" type="button" aria-label="Fermer">×</button>
    <h2 id="bvTitre">Bienvenue dans la Salle de jeux 👋</h2>
    <p>Des petits jeux qui se lancent directement dans le navigateur, sur ordinateur comme sur téléphone, sans rien installer.</p>
    <ul class="points">
      <li><span class="ico">📅</span><span><b>Un défi par jour</b>Mot du jour, sudoku, Loldle… le même pour tout le monde. Reviens chaque jour pour garder ta série.</span></li>
      <li><span class="ico">👥</span><span><b>Entre amis</b>Crée une salle et envoie le code ou le lien. Avec un groupe (bouton 👥 en bas à gauche), vous passez de jeu en jeu ensemble.</span></li>
      <li><span class="ico">🏆</span><span><b>Un compte si tu veux</b>Pas besoin de compte pour jouer. Il sert aux classements, aux médailles et aux groupes.</span></li>
    </ul>
    <p>Choisis une catégorie pour trouver ton jeu.</p>
    <button class="btn" type="button">Voir les catégories</button>`;
  d.querySelectorAll("button").forEach(b => b.onclick = () => d.close());
  d.addEventListener("click", e => { if(e.target === d) d.close(); });
  d.addEventListener("close", () => { d.remove(); try{ localStorage.setItem("salle_bienvenue_vue", "true"); }catch(e){} });
  document.body.appendChild(d); d.showModal();
}
$("aide").onclick = bienvenue;
if(!lireLS("salle_bienvenue_vue", false)){
  /* joueur déjà venu avant ce message : on ne l'embête pas */
  if(lireLS("salle_pseudo", "") || Object.keys(lireLS("salle_records", {})).length) try{ localStorage.setItem("salle_bienvenue_vue", "true"); }catch(e){}
  else setTimeout(bienvenue, 500);
}
vue = lireVue();


/* On attend les réglages (max ~3 s) pour ne pas montrer un jeu caché par erreur */
$("cats").innerHTML = '<p class="empty">Chargement des jeux…</p>';
Promise.race([Compte.reglages(), new Promise(r => setTimeout(() => r({}), 3000))])
  .then(r => { regl = r || {}; tout(); });
Compte.reglages().then(r => { if(JSON.stringify(r) !== JSON.stringify(regl)){ regl = r || {}; tout(); } });
/* Retour sur l'accueil (bouton précédent) ou passage de minuit : statuts du jour à jour */
addEventListener("pageshow", e => { if(e.persisted){ vue = lireVue(); afficher(); } });
let jourVu = jourParis("wordle");
setInterval(() => { const j = jourParis("wordle"); if(j !== jourVu){ jourVu = j; afficher(); } }, 60000);
Compte.surChangement(() => tout());
/* Médailles 🏅 : compteur en haut + mise à jour des défis */
(function attendreMedailles(){
  if(!window.Medailles) return setTimeout(attendreMedailles, 200);
  Medailles.compteur(document.getElementById("medailles"));
  Medailles.surChangement(() => afficher());
})();
/* Groupe 👥 : on ne garde que les jeux à plusieurs (re-dessin seulement quand ça change) */
(function attendreGroupe(){
  if(!(window.Groupe && Groupe.surChangement)) return setTimeout(attendreGroupe, 200);
  Groupe.surChangement(g => { if(!!g !== groupe){ groupe = !!g; afficher(); } });
})();
</script>
