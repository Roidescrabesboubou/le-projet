<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédle</title>
<link rel="stylesheet" href="../commun/base.css">
<link rel="stylesheet" href="../commun/dle.css">
<style>
:root{--accent:#e53b3b;--fond1:rgba(229,59,59,.14);--fond2:rgba(255,203,5,.16)}
.av{font-size:.72rem}td.name .av{font-size:.85rem}.found .av{font-size:1.1rem}
</style>
</head>
<body>
<script src="../commun/garde.js"></script>
<script src="../commun/base.js"></script>
<script src="../commun/classement.js"></script>
<script src="../commun/series.js"></script>
<script src="../commun/dle.js"></script>
<script src="pokemons.js"></script>
<script>
const TC={"Normal":"#9a9a78","Feu":"#ee7f30","Eau":"#6890f0","Plante":"#5fae3d","Électrik":"#e2b600","Glace":"#58b8b8","Combat":"#c03028","Poison":"#a040a0","Sol":"#c7a24a","Vol":"#8f7ad8","Psy":"#f85888","Insecte":"#98a820","Roche":"#a89038","Spectre":"#705898","Dragon":"#6f38f8","Ténèbres":"#5b4a40","Acier":"#8f8fae","Fée":"#e27aa6"};
const fr=(n,o)=>n.toLocaleString("fr-FR",o);
window.JEU=Dle.lancer({
  slug:"pokedle", titre:"Pokédle", emoji:"⚡", quoi:"Pokémon", liste:POKEMONS, graine:151025,
  question:"Devine le Pokémon mystère",
  intro:"Tape le nom de n'importe quel Pokémon (1<sup>re</sup> à 9<sup>e</sup> génération) pour commencer.",
  colonnes:[{t:"Type 1",k:"t1",cmp:(g,a)=>g.t1===a.t1?"ok":g.t1===a.t2?"mid":"no"},
    {t:"Type 2",k:"t2",cmp:(g,a)=>g.t2===a.t2?"ok":g.t2!=="Aucun"&&g.t2===a.t1?"mid":"no"},
    {t:"Couleur",k:"couleur"},{t:"Stade",k:"stade",num:true},{t:"Statut",k:"statut"},
    {t:"Taille",k:"taille",num:true,fmt:t=>t>=100?fr(t/100,{maximumFractionDigits:2})+" m":t+" cm"},
    {t:"Poids",k:"poids",num:true,fmt:p=>fr(p,{maximumFractionDigits:1})+" kg"},
    {t:"Génération",k:"gen",num:true,fmt:g=>"Gén. "+g}],
  avatar:p=>[TC[p.t1]||"#888",p.num],
  indice2:["📖 N° du Pokédex",a=>`📖 N° ${String(a.num).padStart(4,"0")}`],
  filtre:{champ:"gen",valeurs:[1,2,3,4,5,6,7,8,9],texte:"Générations (prochain Pokémon) :",min:"Garde au moins une génération"},
  legende:"↑ ↓ plus grand / plus petit",
  exemple:"ex : un type dans l'autre case",
  aide:`<li>🟧 sur un type : ce type est bien celui du Pokémon mystère, mais <b>dans l'autre case</b> (type 1 ↔ type 2).</li>
    <li>↑ / ↓ : le stade d'évolution, la taille, le poids ou la génération du Pokémon mystère est <b>plus grand</b> / <b>plus petit</b>.</li>
    <li>Stade : 1 = forme de base, 2 = 1<sup>re</sup> évolution, 3 = 2<sup>e</sup> évolution. Statut : Normal, Légendaire ou Fabuleux.</li>`,
  aideFin:"📅 Le <b>Pokémon du jour</b> change automatiquement à minuit, le même pour tout le monde. ♾️ La <b>partie libre</b> tire un Pokémon au hasard, sans limite, et te laisse choisir les générations."
});
</script>
</body>
</html>
