<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anidle</title>
<link rel="stylesheet" href="../commun/base.css">
<link rel="stylesheet" href="../commun/dle.css">
<style>:root{--accent:#d6417d;--fond1:rgba(214,65,125,.14);--fond2:rgba(91,107,208,.14)}</style>
</head>
<body>
<script src="../commun/garde.js"></script>
<script src="../commun/base.js"></script>
<script src="../commun/classement.js"></script>
<script src="../commun/series.js"></script>
<script src="../commun/dle.js"></script>
<script src="persos.js"></script>
<script>
const norm=Dle.norm, liste=s=>s.split(",").map(x=>x.trim()).filter(Boolean);
const mots=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/[^a-z0-9]+/).filter(Boolean);
const GENRES={H:"Homme",F:"Femme",A:"Autre"};

/* ---------- Données ---------- */
const OEUVRES={};
ANI_OEUVRES.trim().split("\n").forEach(l=>{
  const[titre,format,annee,autres]=l.split("|"),titres=[titre,...liste(autres||"")];
  // recherche par titre entier ou par un de ses mots (« titans », « dxd », « snk »…)
  OEUVRES[titre]={format,annee:+annee,cles:titres.flatMap(x=>[norm(x),...mots(x)])};
});
const PERSOS=ANI_PERSOS.trim().split("\n").map(l=>{
  const[name,alias,genre,especes,cheveux,pouvoirs,roles,oeuvre,jour]=l.split("|");
  return{name,genre:GENRES[genre],especes:liste(especes),cheveux:liste(cheveux),pouvoirs:liste(pouvoirs),roles:liste(roles),oeuvre,
    format:OEUVRES[oeuvre].format,annee:OEUVRES[oeuvre].annee,jour:jour==="1",cles:[name,...liste(alias)].map(norm)};
});

window.JEU=Dle.lancer({
  slug:"anidle", titre:"Anidle", emoji:"🎌", quoi:"personnage", liste:PERSOS, graine:4242, debut:Date.UTC(2026,10,3), jour:c=>c.jour,
  question:"Devine le personnage d'anime",
  intro:`${PERSOS.length} personnages de ${Object.keys(OEUVRES).length} œuvres. Tape un nom, ou le titre d'une œuvre pour voir ses personnages.`,
  colonnes:[{t:"Genre",k:"genre"},{t:"Espèce",k:"especes"},{t:"Cheveux",k:"cheveux"},{t:"Pouvoirs",k:"pouvoirs"},{t:"Rôle",k:"roles"},
    {t:"Œuvre",k:"oeuvre"},{t:"Format",k:"format"},{t:"Année",k:"annee",num:true}],
  sous:c=>c.oeuvre,
  // après les noms : tous les personnages de l'œuvre cherchée (à partir de 2 lettres)
  plus:(n,libres,noms)=>n.length<2?[]:libres.filter(c=>!noms.includes(c)&&OEUVRES[c.oeuvre].cles.some(k=>k.startsWith(n))),
  indice1:["🎬 Initiale de l'œuvre",a=>`🎬 L'œuvre commence par « ${a.oeuvre[0]} »`],
  indice2:["🔤 Initiale du personnage",a=>`🔤 Le nom commence par « ${a.name[0]} »`],
  legende:"↑ ↓ œuvre plus récente ou plus ancienne",
  exemple:"ex : un pouvoir en commun sur deux",
  aide:`<li>↑ / ↓ : l'œuvre du personnage mystère a commencé <b>plus tard</b> / <b>plus tôt</b>.</li>
    <li>Dans la recherche, tape le <b>titre d'une œuvre</b> pour voir tous ses personnages.</li>
    <li>Attention aux spoilers : espèce, rôle et pouvoirs tiennent compte de toute l'histoire.</li>`,
  aideFin:"📅 Le <b>personnage du jour</b> est tiré parmi les plus connus et change à minuit, le même pour tout le monde. ♾️ La <b>partie libre</b> tire n'importe quel personnage."
});
</script>
</body>
</html>
