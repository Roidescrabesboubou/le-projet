<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Freestyle</title>
<link rel="stylesheet" href="../commun/base.css">
<style>
:root{--accent:#e0457b;--fond1:rgba(224,69,123,.14);--fond2:rgba(255,196,0,.1)}
.b-page{max-width:820px}
.reglage{margin:14px 0}
.reglage h3{margin:0 0 6px;font-size:.95rem;text-align:center}
.options{display:flex;flex-direction:column;gap:8px;margin:14px auto;max-width:440px}
.options label{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:2px solid var(--line);border-radius:12px;cursor:pointer}
.options label input{margin-top:3px;accent-color:var(--accent)}
.options small{display:block;color:var(--muted)}
.lancer{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
#scene{padding:0;overflow:hidden;background:#15111f;border-color:#06051a}
#toile{display:block;width:100%;height:min(62vh,440px);touch-action:manipulation}
.barre{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;padding:10px 14px;background:#1d1830;color:#f1efff;border-top:2px solid #2c2547}
.barre .btn.ghost{background:transparent;color:#f1efff;border-color:#4b4370}
.compteur{font-family:Fredoka,sans-serif;font-weight:700;font-size:1.15rem}
.entendu{flex-basis:100%;font-size:.85rem;color:#a6a2cc;min-height:1.2em;font-style:italic;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.vol{display:flex;align-items:center;gap:6px;font-size:.9rem}
.vol input{width:90px;accent-color:var(--accent)}
.gros{font-family:Fredoka,sans-serif;font-size:2.6rem;margin:6px 0}
#fin audio{width:100%;margin:10px 0}
.cache{display:none!important}
</style>
</head>
<body>
<main class="b-page">

  <!-- Réglages -->
  <section class="b-carte" id="accueil" style="text-align:center">
    <p class="muted" style="margin-top:0">La boule tape les 4 temps de chaque ligne. Pose le mot affiché sur le <b>4ᵉ temps</b> : il rime avec celui de la ligne suivante.</p>

    <div class="reglage"><h3>🎧 La prod</h3><div class="pilules" id="choixProd"></div></div>
    <div class="reglage"><h3>⏱️ Vitesse</h3><div class="pilules" id="choixVitesse"></div></div>
    <div class="reglage"><h3>📏 Durée</h3><div class="pilules" id="choixDuree"></div></div>

    <div class="options">
      <label id="optJuge"><input type="checkbox" id="juge"><span>🎤 <b>Juge au micro</b><small>Le jeu écoute et compte les mots que tu places dans le temps.</small></span></label>
      <label><input type="checkbox" id="enreg"><span>🔴 <b>Enregistrer ma prise</b><small>Réécoute (et télécharge) ton freestyle sur la prod à la fin.</small></span></label>
      <label><input type="checkbox" id="theme" checked><span>💡 <b>Thème imposé</b><small>Un sujet tiré au hasard pour t'aider à démarrer.</small></span></label>
    </div>

    <div class="lancer">
      <button class="btn" id="go">▶ Lancer la prod</button>
      <button class="btn ghost" id="ecoute">🔈 Écouter la prod</button>
    </div>
  </section>

  <!-- Scène -->
  <section class="b-carte cache" id="scene">
    <canvas id="toile"></canvas>
    <div class="barre">
      <span class="compteur" id="compteur">Mesure 0</span>
      <span class="compteur" id="score"></span>
      <span class="vol">🔊 <input type="range" id="volume" min="0" max="100" value="80"></span>
      <button class="btn ghost petit" id="stop">⏹ Stop</button>
      <span class="entendu" id="entendu"></span>
    </div>
  </section>

  <!-- Fin -->
  <section class="b-carte cache" id="fin" style="text-align:center">
    <p class="gros" id="finTitre">🎤 Bien joué !</p>
    <p id="finTexte" class="muted"></p>
    <div id="finAudio"></div>
    <div class="lancer">
      <button class="btn" id="rejouer">🔁 Rejouer</button>
      <button class="btn ghost" id="reglages">⚙️ Changer les réglages</button>
    </div>
  </section>
</main>

<script src="../commun/garde.js"></script>
<script src="../commun/base.js"></script>
<script src="rimes.js"></script>
<script>
const $ = id => document.getElementById(id);
const stock = Base.stock("freestyle_");

Base.entete({
  titre: "Freestyle",
  emoji: "🎤",
  aide: `<p>Une prod tourne, une boule rebondit sur chaque ligne coupée en <b>4 temps</b>.</p>
         <ul>
           <li>Rappe ce que tu veux sur les 3 premiers temps.</li>
           <li>Sur le <b>4ᵉ temps</b>, place le mot affiché.</li>
           <li>Les lignes vont par deux : leurs mots riment (même couleur). Regarde la ligne d'après pour préparer ta rime !</li>
           <li>Avec le <b>juge au micro</b>, chaque mot posé dans le temps rapporte un point.</li>
         </ul>`
});

/* ================= Réglages ================= */
const PRODS = {
  boombap: {nom:"Boom bap", emoji:"🥁", bpm:90, swing:.16, couleur:"#ffb347",
    kick:"x.....x...x..x..", snare:"....x.......x...", hat:"x.x.x.x.x.x.x.xx", ghost:"...x.........x..",
    basse:"x.....x...x..x..", accords:[[45,[57,60,64,67]],[41,[57,60,64,65]],[38,[57,60,62,65]],[40,[56,59,62,64]]], style:"rhodes"},
  lofi: {nom:"Lo-fi", emoji:"☕", bpm:78, swing:.22, couleur:"#8fd3c7",
    kick:"x.......x.x.....", snare:"....x.......x...", hat:"x.x.x.x.x.x.x.x.", ghost:"",
    basse:"x.......x.x.....", accords:[[48,[59,64,67,71]],[45,[60,64,67,69]],[38,[60,62,65,69]],[43,[59,62,65,67]]], style:"pad", vinyle:true},
  trap: {nom:"Trap", emoji:"🔥", bpm:72, swing:0, couleur:"#b388ff",
    kick:"x......x..x.....", snare:"........x.......", hat:"xxxxxxxxxxxxxxxx", ghost:"",
    basse:"x......x..x.....", accords:[[36,[60,63,67]],[36,[60,63,67]],[44,[60,63,68]],[43,[59,62,67]]], style:"cloche", roulements:true, s808:true}
};
const VITESSES = {lent:{nom:"Tranquille", k:.88}, normal:{nom:"Normal", k:1}, rapide:{nom:"Vénère", k:1.12}};
const DUREES = {8:"8 lignes", 16:"16 lignes", 32:"32 lignes", 0:"∞ Sans fin"};

const choix = Object.assign({prod:"boombap", vitesse:"normal", duree:"16"}, stock.lire("choix", {}));
function pilules(id, obj, cle, texte){
  const box = $(id); box.innerHTML = "";
  for(const k in obj){
    const b = Base.el("button", texte(obj[k], k)); b.type = "button";
    if(String(k) === String(choix[cle])) b.classList.add("on");
    b.onclick = () => { choix[cle] = k; stock.ecrire("choix", choix); pilules(id, obj, cle, texte); };
    box.appendChild(b);
  }
}
pilules("choixProd", PRODS, "prod", p => p.emoji + " " + p.nom);
pilules("choixVitesse", VITESSES, "vitesse", v => v.nom);
pilules("choixDuree", DUREES, "duree", d => d);

const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!Reco){ $("juge").disabled = true; $("optJuge").style.opacity = .5; $("optJuge").querySelector("small").textContent = "Pas disponible sur ce navigateur (essaie Chrome ou Edge)."; }
$("juge").checked = !!Reco && stock.lire("juge", false);
$("enreg").checked = stock.lire("enreg", false);
$("theme").checked = stock.lire("theme", true);
["juge","enreg","theme"].forEach(k => $(k).onchange = () => stock.ecrire(k, $(k).checked));

/* ================= Moteur audio ================= */
let ctx = null, sortie, maitre, bruit, enregDest = null;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function initAudio(){
  if(ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = .005; comp.release.value = .15;
  maitre = ctx.createGain(); maitre.gain.value = 0;
  sortie = ctx.createGain(); sortie.gain.value = $("volume").value / 100;
  maitre.connect(comp); comp.connect(sortie); sortie.connect(ctx.destination);
  bruit = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const d = bruit.getChannelData(0);
  for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
$("volume").oninput = () => { if(sortie) sortie.gain.setTargetAtTime($("volume").value / 100, ctx.currentTime, .05); };

function env(g, t, v, a, dec){
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec);
}
function source(t, dur){ const s = ctx.createBufferSource(); s.buffer = bruit; s.start(t); s.stop(t + dur); return s; }

function kick(t, v = 1){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(48, t + .11);
  env(g, t, v, .002, .42); o.connect(g); g.connect(maitre); o.start(t); o.stop(t + .5);
}
function snare(t, v = .7){
  const s = source(t, .25), f = ctx.createBiquadFilter(), g = ctx.createGain();
  f.type = "highpass"; f.frequency.value = 1300;
  env(g, t, v, .002, .19); s.connect(f); f.connect(g); g.connect(maitre);
  const o = ctx.createOscillator(), g2 = ctx.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(140, t + .08);
  env(g2, t, v * .6, .002, .1); o.connect(g2); g2.connect(maitre); o.start(t); o.stop(t + .15);
}
function clap(t, v = .6){
  const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1600; f.Q.value = .8; f.connect(maitre);
  [0, .012, .024].forEach((dt, i) => {
    const s = source(t + dt, .2), g = ctx.createGain();
    env(g, t + dt, v, .001, i === 2 ? .16 : .012); s.connect(g); g.connect(f);
  });
}
function hat(t, v = .25, ouvert = false){
  const s = source(t, .3), f = ctx.createBiquadFilter(), g = ctx.createGain();
  f.type = "highpass"; f.frequency.value = 7500;
  env(g, t, v, .001, ouvert ? .22 : .035); s.connect(f); f.connect(g); g.connect(maitre);
}
function basse(t, m, dur){
  const o = ctx.createOscillator(), o2 = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  o.type = "triangle"; o2.type = "sine"; o.frequency.value = mtof(m); o2.frequency.value = mtof(m);
  f.type = "lowpass"; f.frequency.value = 520;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.5, t + .01);
  g.gain.setValueAtTime(.42, t + dur * .7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); o2.connect(f); f.connect(g); g.connect(maitre);
  [o, o2].forEach(x => { x.start(t); x.stop(t + dur + .05); });
}
let distorsion = null;
function b808(t, m, dur, glisse){
  if(!distorsion){
    distorsion = ctx.createWaveShaper(); const c = new Float32Array(256);
    for(let i = 0; i < 256; i++){ const x = i / 128 - 1; c[i] = Math.tanh(x * 2.2); }
    distorsion.curve = c; distorsion.connect(maitre);
  }
  const o = ctx.createOscillator(), g = ctx.createGain(), f = mtof(m);
  o.frequency.setValueAtTime(f * 1.6, t); o.frequency.exponentialRampToValueAtTime(f, t + .04);
  if(glisse) o.frequency.exponentialRampToValueAtTime(mtof(glisse), t + dur * .8);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.55, t + .005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(distorsion); o.start(t); o.stop(t + dur + .05);
}
function accord(t, notes, dur, style){
  const f = ctx.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(style === "pad" ? 1100 : 2400, t); f.frequency.exponentialRampToValueAtTime(700, t + dur);
  f.connect(maitre);
  notes.forEach((m, i) => {
    const fr = mtof(m), g = ctx.createGain();
    const o = ctx.createOscillator(); o.type = style === "pad" ? "triangle" : "sine"; o.frequency.value = fr;
    o.detune.value = (i % 2 ? 6 : -6);
    if(style === "pad"){
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.06, t + .25);
      g.gain.setValueAtTime(.05, t + dur * .8); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    } else env(g, t + i * .012, .085, .006, dur);
    o.connect(g); g.connect(f); o.start(t); o.stop(t + dur + .1);
    if(style === "rhodes"){
      const o2 = ctx.createOscillator(), g2 = ctx.createGain();
      o2.frequency.value = fr * 2; env(g2, t, .03, .003, .35);
      o2.connect(g2); g2.connect(f); o2.start(t); o2.stop(t + .5);
    }
  });
}
function cloche(t, m, v = .07){
  const fr = mtof(m), g = ctx.createGain(), g2 = ctx.createGain();
  const o = ctx.createOscillator(), o2 = ctx.createOscillator();
  o.frequency.value = fr; o2.frequency.value = fr * 3.01;
  env(g, t, v, .003, .9); env(g2, t, v * .35, .002, .25);
  o.connect(g); o2.connect(g2); g.connect(maitre); g2.connect(maitre);
  [o, o2].forEach(x => { x.start(t); x.stop(t + 1); });
}
let vinyle = null;
function lancerVinyle(){
  const n = ctx.sampleRate * 2, b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = Math.random() < .0009 ? (Math.random() * 2 - 1) : (Math.random() * 2 - 1) * .015;
  vinyle = ctx.createBufferSource(); vinyle.buffer = b; vinyle.loop = true;
  const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 3000; f.Q.value = .5;
  const g = ctx.createGain(); g.gain.value = .35;
  vinyle.connect(f); f.connect(g); g.connect(maitre); vinyle.start();
}

/* Programme une double-croche (pas absolu s). */
function jouerPas(s, t, prod, finale){
  const st = s % 16, mesure = Math.floor(s / 16), [racine, notes] = prod.accords[mesure % 4];
  const pasDur = 60 / bpm / 4;
  if(finale){ if(st === 0){ kick(t); accord(t, notes, pasDur * 16, prod.style); if(prod.s808) b808(t, racine, 2); else basse(t, racine, 1.5); } return; }
  if(prod.kick[st] === "x") kick(t, st === 0 ? 1 : .85);
  if(prod.snare[st] === "x"){ snare(t); if(prod.roulements) clap(t); }
  if(prod.ghost && prod.ghost[st] === "x") snare(t, .18);
  if(prod.hat[st] === "x"){
    const accent = st % 4 === 0 ? .26 : st % 2 === 0 ? .2 : .12;
    hat(t, prod.roulements ? accent * .8 : accent, !prod.roulements && st === 14);
    if(prod.roulements && (st === 7 || (st === 15 && mesure % 2 === 1)))
      for(let k = 1; k < 3; k++) hat(t + k * pasDur / 3, .12);
  }
  if(prod.basse[st] === "x"){
    let fin = st + 1; while(fin < 16 && prod.basse[fin] !== "x") fin++;
    const dur = (fin - st) * pasDur;
    if(prod.s808) b808(t, racine, Math.max(dur, .4), st === 10 && mesure % 4 === 3 ? racine + 7 : null);
    else basse(t, racine + (st === 13 ? 12 : 0), dur * .9);
  }
  if(st === 0) accord(t, notes, prod.style === "pad" ? pasDur * 16 : pasDur * 9, prod.style);
  if(prod.style === "rhodes" && st === 10) accord(t, notes.slice(1), pasDur * 5, "rhodes");
  if(prod.style === "cloche" && st % 4 === 0){
    const arp = [notes[0], notes[2], notes[1] + 12, notes[2]];
    cloche(t, arp[st / 4] + 12, .05);
  }
}

/* ================= Partie ================= */
let partie = null, bpm = 90;

function tirerLignes(){
  const groupes = Base.melanger(RIMES.map((g, i) => i));
  return {groupes, pos: 0, recents: []};
}
function motLigne(L){
  const p = partie;
  while(p.mots.length <= L){
    const paire = p.mots.length / 2;
    if(p.tirage.pos >= p.tirage.groupes.length) p.tirage = tirerLignes();
    const gi = p.tirage.groupes[p.tirage.pos++];
    const dispo = RIMES[gi].filter(m => !p.utilises.has(m));
    const deux = Base.melanger(dispo.length >= 2 ? dispo : RIMES[gi]).slice(0, 2);
    deux.forEach(m => { p.utilises.add(m); p.mots.push({mot: m, groupe: gi, paire, etat: null}); });
  }
  return p.mots[L];
}

async function demarrer(ecouteSeule){
  initAudio();
  if(ctx.state === "suspended") await ctx.resume();
  const prod = PRODS[choix.prod];
  bpm = prod.bpm * VITESSES[choix.vitesse].k;
  const duree = ecouteSeule ? 0 : +choix.duree;

  const juge = !ecouteSeule && $("juge").checked && !!Reco;
  const enreg = !ecouteSeule && $("enreg").checked && !!window.MediaRecorder;
  let micro = null;
  if(enreg){
    try{ micro = await navigator.mediaDevices.getUserMedia({audio: true}); }
    catch(e){ Base.toast("Micro refusé : pas d'enregistrement"); }
  }

  partie = {prod, duree, juge, ecouteSeule, mots: [], utilises: new Set(), tirage: tirerLignes(),
    pas: 0, t0: ctx.currentTime + .25, points: 0, serie: 0, meilleureSerie: 0, fini: false,
    theme: $("theme").checked && !ecouteSeule ? THEMES[Math.floor(Math.random() * THEMES.length)] : null,
    micro, enregistreur: null, morceaux: [], reco: null, flash: []};

  maitre.gain.cancelScheduledValues(ctx.currentTime);
  maitre.gain.setValueAtTime(.0001, ctx.currentTime);
  maitre.gain.exponentialRampToValueAtTime(.9, ctx.currentTime + .1);
  if(prod.vinyle) lancerVinyle();

  if(micro){
    enregDest = ctx.createMediaStreamDestination();
    sortie.connect(enregDest);
    ctx.createMediaStreamSource(micro).connect(enregDest);
    const r = new MediaRecorder(enregDest.stream);
    r.ondataavailable = e => { if(e.data.size) partie.morceaux.push(e.data); };
    r.start(); partie.enregistreur = r;
  }
  if(juge) lancerJuge();

  $("accueil").classList.add("cache"); $("fin").classList.add("cache"); $("scene").classList.remove("cache");
  $("score").textContent = juge ? "🎯 0" : "";
  $("entendu").textContent = juge ? "Le juge écoute…" : ecouteSeule ? "Écoute de la prod — appuie sur Stop pour revenir." : "";
  $("stop").textContent = ecouteSeule ? "⏹ Retour" : "⏹ Stop";
  dimensionner();
  partie.minuteur = setInterval(programmer, 25);
  programmer();
  requestAnimationFrame(dessiner);
}

function programmer(){
  const p = partie; if(!p || p.fini) return;
  const pasDur = 60 / bpm / 4;
  marquerRates(tempsCourant());
  const finPas = p.duree ? (p.duree + 1) * 16 : Infinity; // 1 mesure d'intro + les lignes
  while(p.t0 + p.pas * pasDur < ctx.currentTime + .15){
    const s = p.pas;
    if(s > finPas){ p.dernier = p.t0 + s * pasDur; terminer(false); return; }
    const t = p.t0 + s * pasDur + (s % 2 ? p.prod.swing * pasDur : 0);
    jouerPas(s, t, p.prod, s === finPas);
    p.pas++;
  }
}

/* Temps musical courant (en temps), aligné sur ce que l'on entend. */
function tempsCourant(){
  const lat = (ctx.outputLatency || 0) + (ctx.baseLatency || 0);
  return (ctx.currentTime - lat - partie.t0) / (60 / bpm);
}

function terminer(manuel){
  const p = partie; if(!p || p.fini) return;
  p.fini = true; clearInterval(p.minuteur);
  const attente = manuel ? 0 : Math.max(0, (p.dernier || ctx.currentTime) - ctx.currentTime) + 1.6;
  if(manuel){ maitre.gain.cancelScheduledValues(ctx.currentTime); maitre.gain.setTargetAtTime(.0001, ctx.currentTime, .08); }
  if(p.reco){ try{ p.reco.onend = null; p.reco.abort(); }catch(e){} }
  setTimeout(() => {
    if(vinyle){ try{ vinyle.stop(); }catch(e){} vinyle = null; }
    const fini = () => afficherFin(p, manuel);
    if(p.enregistreur && p.enregistreur.state !== "inactive"){ p.enregistreur.onstop = fini; p.enregistreur.stop(); }
    else fini();
    if(p.micro) p.micro.getTracks().forEach(tr => tr.stop());
    if(enregDest){ try{ sortie.disconnect(enregDest); }catch(e){} enregDest = null; }
    maitre.gain.cancelScheduledValues(ctx.currentTime); maitre.gain.setValueAtTime(.0001, ctx.currentTime);
  }, attente * 1000);
}

function afficherFin(p, manuel){
  if(p.ecouteSeule){ retourAccueil(); return; }
  const lignes = Math.max(0, Math.min(p.duree || Infinity, Math.floor(tempsCourantFige(p) / 4) - 1));
  $("scene").classList.add("cache"); $("fin").classList.remove("cache");
  let texte = lignes + " ligne" + (lignes > 1 ? "s" : "") + " sur la prod " + p.prod.nom + ".";
  if(p.juge){
    marquerRates(Infinity);
    const total = p.duree && !manuel ? p.duree : Math.max(lignes, 1);
    $("finTitre").textContent = "🎯 " + p.points + " / " + total;
    texte += " Meilleure série : " + p.meilleureSerie + " mot" + (p.meilleureSerie > 1 ? "s" : "") + " d'affilée.";
    if(p.duree && !manuel && Base.record("freestyle", p.points, {mieux: "haut", texte: p.points + " rimes posées"})) texte += " 🏆 Nouveau record !";
  } else $("finTitre").textContent = manuel ? "🎤 Coupé !" : "🎤 Bien joué !";
  $("finTexte").textContent = texte;
  const box = $("finAudio"); box.innerHTML = "";
  if(p.morceaux.length){
    const blob = new Blob(p.morceaux, {type: p.morceaux[0].type || "audio/webm"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("audio"); a.controls = true; a.src = url; box.appendChild(a);
    const lien = Base.el("a", "💾 Télécharger ma prise", "btn ghost petit");
    lien.href = url; lien.download = "freestyle-" + p.prod.nom.toLowerCase().replace(/\W+/g, "") + ".webm";
    box.appendChild(lien);
  }
  stock.ecrire("parties", stock.lire("parties", 0) + 1);
}
function tempsCourantFige(p){ return p.tFin != null ? p.tFin : tempsCourant(); }

function retourAccueil(){
  $("scene").classList.add("cache"); $("fin").classList.add("cache"); $("accueil").classList.remove("cache");
  partie = null;
}
$("go").onclick = () => demarrer(false);
$("ecoute").onclick = () => demarrer(true);
$("stop").onclick = () => { if(partie){ partie.tFin = tempsCourant(); terminer(true); } };
$("rejouer").onclick = () => demarrer(false);
$("reglages").onclick = retourAccueil;

/* ================= Juge (reconnaissance vocale) ================= */
const normaliser = s => s.toLowerCase().replace(/œ/g, "oe").replace(/æ/g, "ae").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z]+/g, " ").trim();

function lancerJuge(){
  const p = partie;
  const r = new Reco(); r.lang = "fr-FR"; r.continuous = true; r.interimResults = true;
  r.onresult = e => {
    let txt = "";
    for(let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript + " ";
    $("entendu").textContent = "« " + txt.trim().slice(-80) + " »";
    verifier(normaliser(txt).split(" "));
  };
  r.onerror = e => { if(e.error === "not-allowed"){ Base.toast("Micro refusé : le juge est coupé"); p.juge = false; $("score").textContent = ""; } };
  r.onend = () => { if(partie === p && !p.fini && p.juge){ try{ r.start(); }catch(e){} } };
  try{ r.start(); p.reco = r; }catch(e){ p.juge = false; }
}

/* Le mot de la ligne L tombe au temps (L+1)*4 + 3. On l'accepte un peu avant
   et un peu après (la reconnaissance vocale a du retard). */
function fenetre(L){ const b = (L + 1) * 4 + 3; return [b - 1.6, b + 2.6]; }
function verifier(mots){
  const p = partie; if(!p || p.fini) return;
  const t = tempsCourant();
  const L0 = Math.floor(t / 4) - 2;
  for(let L = Math.max(0, L0); L <= L0 + 2; L++){
    if(p.duree && L >= p.duree) break;
    const m = motLigne(L); if(m.etat) continue;
    const [a, b] = fenetre(L); if(t < a || t > b) continue;
    const cible = normaliser(m.mot);
    if(mots.some(x => x === cible || x === cible + "s" || x === cible + "x" || (cible.length > 4 && x.length > 3 && cible.startsWith(x) && cible.length - x.length <= 1))){
      m.etat = "ok"; p.points++; p.serie++; p.meilleureSerie = Math.max(p.meilleureSerie, p.serie);
      $("score").textContent = "🎯 " + p.points + (p.serie > 1 ? "  🔥×" + p.serie : "");
      p.flash.push({L, t0: performance.now()});
    }
  }
}
function marquerRates(t){
  const p = partie; if(!p || !p.juge) return;
  const L = t === Infinity ? Math.min(p.mots.length, p.duree || p.mots.length) - 1 : Math.floor((t - 2.6 - 3) / 4) - 1;
  for(let i = Math.max(0, t === Infinity ? 0 : L - 2); i <= L; i++){
    if(p.duree && i >= p.duree) break;
    const m = motLigne(i);
    if(!m.etat && t > fenetre(i)[1]){ m.etat = "rate"; p.serie = 0; $("score").textContent = "🎯 " + p.points; }
  }
}

/* ================= Dessin ================= */
const toile = $("toile"), c2 = toile.getContext("2d");
let W = 0, H = 0;
function dimensionner(){
  const r = toile.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height; toile.width = W * dpr; toile.height = H * dpr;
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", () => { if(partie) dimensionner(); });

const PALETTE = ["#ff5c8a","#ffc93c","#5ce1e6","#9d7bff","#7ee081","#ff8f4f"];
function arrondi(x, y, w, h, r){ c2.beginPath(); c2.roundRect ? c2.roundRect(x, y, w, h, r) : c2.rect(x, y, w, h); }
const lisse = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);

function dessiner(){
  const p = partie; if(!p) return;
  if(p.fini && !p.ecouteSeule && !$("scene").classList.contains("cache") && p.tFin == null) p.tFin = tempsCourant();
  const t = Math.max(-1, p.tFin != null ? p.tFin : tempsCourant());
  const mesure = Math.floor(t / 4), dansMesure = t - mesure * 4, frac = dansMesure / 4;
  const ligneCour = mesure - 1;              // -1 = mesure d'intro
  const marge = Math.max(16, W * .05), largeur = W - marge * 2, seg = largeur / 4;
  const hauteurLigne = Math.min(64, H * .15), ecart = Math.min(118, H * .27);
  const yRef = H * .5;
  const defile = ligneCour + lisse((frac - .8) / .2);
  const yLigne = L => yRef + (L - defile) * ecart;

  // fond qui pulse sur les temps
  const pulse = Math.max(0, 1 - (dansMesure % 1) * 3);
  c2.fillStyle = "#15111f"; c2.fillRect(0, 0, W, H);
  const grad = c2.createRadialGradient(W / 2, yRef, 10, W / 2, yRef, W * .7);
  grad.addColorStop(0, `rgba(224,69,123,${.10 + pulse * .12})`); grad.addColorStop(1, "rgba(21,17,31,0)");
  c2.fillStyle = grad; c2.fillRect(0, 0, W, H);

  // en-tête de scène
  c2.textAlign = "left"; c2.textBaseline = "top"; c2.fillStyle = "#a6a2cc"; c2.font = "700 14px Nunito, sans-serif";
  c2.fillText(p.prod.emoji + " " + p.prod.nom + " · " + Math.round(bpm) + " bpm", 14, 12);
  if(p.theme){ c2.textAlign = "right"; c2.fillStyle = "#ffc93c"; c2.fillText("💡 Thème : " + p.theme, W - 14, 12); }

  // lignes visibles
  const derniere = p.duree ? p.duree : Infinity;
  for(let L = Math.floor(defile) - 1; L <= Math.floor(defile) + 3; L++){
    const y = yLigne(L); if(y < -ecart || y > H + ecart) continue;
    if(L > derniere) continue;
    const dist = Math.abs(L - defile), alpha = Math.max(0, 1 - dist * .38);
    c2.globalAlpha = L < ligneCour ? alpha * .5 : alpha;
    dessinerLigne(L, y, marge, seg, hauteurLigne, L === ligneCour ? Math.floor(dansMesure) : -1, p, derniere);
    c2.globalAlpha = 1;
  }

  // liens de rime entre les deux lignes d'une paire
  for(let L = Math.floor(defile) - 1; L <= Math.floor(defile) + 3; L++){
    if(L < 0 || L % 2 || L + 1 >= derniere) continue;
    const y1 = yLigne(L), y2 = yLigne(L + 1), x = marge + largeur + 2;
    if(y2 < -ecart || y1 > H + ecart) continue;
    const coul = PALETTE[motLigne(L).paire % PALETTE.length];
    c2.globalAlpha = Math.max(0, 1 - Math.abs(L + .5 - defile) * .35) * .8;
    c2.strokeStyle = coul; c2.lineWidth = 3; c2.beginPath();
    c2.moveTo(x - 4, y1); c2.bezierCurveTo(x + marge * .7, y1, x + marge * .7, y2, x - 4, y2); c2.stroke();
    c2.globalAlpha = 1;
  }

  // la boule : elle se pose au centre de chaque case, à chaque temps
  if(t >= -1 && !(p.duree && ligneCour > derniere)){
    const n = Math.floor(t), q = t - n;
    const pos = k => ({L: Math.floor(k / 4) - 1, s: ((k % 4) + 4) % 4});
    const a = pos(n), b = pos(n + 1);
    const xa = marge + seg * (a.s + .5), xb = marge + seg * (b.s + .5);
    const ya = yLigne(a.L) - hauteurLigne / 2, yb = yLigne(b.L) - hauteurLigne / 2;
    const saut = a.L !== b.L ? ecart * .9 : ecart * .36;
    const r = Math.max(9, hauteurLigne * .2);
    const x = xa + (xb - xa) * q;
    const y = ya + (yb - ya) * q - saut * 4 * q * (1 - q);
    const ecrase = q < .12 ? 1 - q / .12 : q > .9 ? (q - .9) / .1 : 0;
    // ombre
    c2.fillStyle = "rgba(0,0,0,.35)"; c2.beginPath();
    c2.ellipse(x, ya + (yb - ya) * q, r * (1 - .4 * (1 - ecrase)), r * .3, 0, 0, 7); c2.fill();
    c2.save(); c2.translate(x, y - r * (1 - ecrase * .3)); c2.scale(1 + ecrase * .3, 1 - ecrase * .3);
    const g = c2.createRadialGradient(-r * .35, -r * .35, 1, 0, 0, r);
    g.addColorStop(0, "#fff"); g.addColorStop(.3, "#ffe17a"); g.addColorStop(1, "#ff8a1f");
    c2.fillStyle = g; c2.shadowColor = "#ffb347"; c2.shadowBlur = 18;
    c2.beginPath(); c2.arc(0, 0, r, 0, 7); c2.fill(); c2.restore();
  }

  // compteur
  if(ligneCour >= 0 && (!p.duree || ligneCour < p.duree))
    $("compteur").textContent = "Ligne " + (ligneCour + 1) + (p.duree ? " / " + p.duree : "");
  else if(ligneCour < 0) $("compteur").textContent = "Prépare-toi…";
  else $("compteur").textContent = "Fin !";

  if(!$("scene").classList.contains("cache")) requestAnimationFrame(dessiner);
}

function dessinerLigne(L, y, marge, seg, h, tempsActif, p, derniere){
  const haut = y - h / 2;
  if(L < 0 || L >= derniere){
    // intro (décompte) ou ligne de fin
    for(let s = 0; s < 4; s++){
      const x = marge + seg * s;
      arrondi(x + 3, haut, seg - 6, h, 12);
      c2.fillStyle = s === tempsActif ? "rgba(255,201,60,.28)" : "rgba(255,255,255,.06)"; c2.fill();
      c2.fillStyle = s === tempsActif ? "#ffc93c" : "#6f6893";
      c2.font = `800 ${Math.round(h * .45)}px Fredoka, Nunito, sans-serif`; c2.textAlign = "center"; c2.textBaseline = "middle";
      c2.fillText(L < 0 ? String(s + 1) : ["🎤", "Fin", "du", "son"][s], x + seg / 2, y + 1);
    }
    if(L < 0){ c2.fillStyle = "#a6a2cc"; c2.font = "700 13px Nunito, sans-serif"; c2.fillText("Écoute la prod, ça part à la ligne suivante !", marge + seg * 2, haut - 14); }
    return;
  }
  const m = motLigne(L), coul = PALETTE[m.paire % PALETTE.length];
  for(let s = 0; s < 4; s++){
    const x = marge + seg * s, mot = s === 3;
    arrondi(x + 3, haut, seg - 6, h, 12);
    if(mot){
      c2.fillStyle = m.etat === "ok" ? "rgba(126,224,129,.3)" : m.etat === "rate" ? "rgba(255,92,92,.14)" : coul + "33";
      c2.fill(); c2.lineWidth = s === tempsActif ? 4 : 2.5;
      c2.strokeStyle = m.etat === "ok" ? "#7ee081" : coul; c2.stroke();
    } else {
      c2.fillStyle = s === tempsActif ? "rgba(255,255,255,.2)" : s < tempsActif ? "rgba(255,255,255,.1)" : "rgba(255,255,255,.05)"; c2.fill();
    }
    c2.textAlign = "center"; c2.textBaseline = "middle";
    if(mot){
      let taille = h * .42; c2.font = `800 ${taille}px Fredoka, Nunito, sans-serif`;
      while(c2.measureText(m.mot).width > seg - 18 && taille > 10){ taille -= 1; c2.font = `800 ${taille}px Fredoka, Nunito, sans-serif`; }
      c2.fillStyle = m.etat === "rate" ? "#8b7f9e" : "#fff"; c2.fillText(m.mot, x + seg / 2, y + 1);
      if(m.etat === "ok"){ c2.font = `${h * .3}px sans-serif`; c2.fillText("✅", x + seg - 14, haut + 4); }
      const fl = p.flash.find(f => f.L === L);
      if(fl){
        const k = (performance.now() - fl.t0) / 600;
        if(k < 1){ c2.strokeStyle = `rgba(126,224,129,${1 - k})`; c2.lineWidth = 3; arrondi(x + 3 - k * 14, haut - k * 14, seg - 6 + k * 28, h + k * 28, 14); c2.stroke(); }
      }
    } else {
      c2.fillStyle = s === tempsActif ? "#fff" : "#5c5580"; c2.font = `700 ${Math.round(h * .3)}px Nunito, sans-serif`;
      c2.fillText("• " + (s + 1) + " •", x + seg / 2, y + 1);
    }
  }
}
</script>
