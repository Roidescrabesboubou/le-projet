<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sentiers</title>
<link rel="stylesheet" href="../commun/base.css">
<style>
:root{--accent:#4f8a3c;--fond1:rgba(79,138,60,.15);--fond2:rgba(201,133,62,.12)}
.barre{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;width:100%;max-width:900px;flex-wrap:wrap}
.infos{display:flex;gap:12px;font-family:Fredoka,sans-serif;font-size:1.1rem;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.infos .vide{color:var(--ko)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn.on{background:var(--accent);color:#fff}
#scene{display:block;border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair;box-shadow:0 2px 12px rgba(0,0,0,.2)}
#scene.gomme{cursor:cell}
.cartes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.carte{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font-weight:600}
.carte:hover{border-color:var(--accent)}
.carte span{font-size:2rem}
.carte b{font-family:Fredoka,sans-serif;font-size:1.1rem}
.carte small{color:var(--muted);line-height:1.2}
.recap{text-align:center}
.recap .gros{font-family:Fredoka,sans-serif;font-size:2.2rem;margin:0}
.help{color:var(--muted);font-size:.8rem;text-align:center;margin:0}
@media (pointer:coarse){.help{display:none}}
</style>
</head>
<body>
<main class="b-page">
  <div class="barre">
    <div class="infos">
      <span title="Fruits rapportés">🍎 <b id="iScore">0</b></span>
      <span title="Dalles de sentier" id="iDalles"></span>
      <span title="Passerelles" id="iPonts"></span>
      <span title="Saison">🍂 <b id="iSaison">1</b></span>
    </div>
    <div class="actions">
      <button class="btn ghost petit" id="bGomme">🧽 Gomme</button>
      <button class="btn ghost petit" id="bVite">⏩ ×2</button>
      <button class="btn ghost petit" id="bPause">⏸️ Pause</button>
      <button class="btn ghost petit" id="bNouvelle">🔄 Recommencer</button>
    </div>
  </div>
  <canvas id="scene"></canvas>
  <p class="help">Glisse d'une case à l'autre pour tracer un sentier · Clic droit ou gomme pour effacer</p>
</main>

<script src="../commun/garde.js"></script>
<script src="../commun/base.js"></script>
<script src="moteur.js"></script>
<script>
const $=id=>document.getElementById(id);
const store=Base.stock("sentiers_");
const{L,H}=SentiersMoteur;

Base.entete({titre:"Sentiers",emoji:"🐾",
  aide:`<p>Les animaux de la forêt ont faim ! Trace des sentiers entre leurs terriers et les arbres de la même couleur : ils iront chercher les fruits tout seuls.</p>
  <ul>
    <li>Glisse d'une case à l'autre pour tracer. Clic droit ou 🧽 pour effacer : les dalles te sont rendues.</li>
    <li>Un arbre qui porte trop de fruits s'entoure d'un cercle rouge. Si le cercle se ferme, la partie est finie.</li>
    <li>Sur un sentier, les animaux marchent en file : un seul chemin pour tout le monde, ça bouchonne !</li>
    <li>L'eau se franchit avec une passerelle, les rochers se contournent.</li>
    <li>À chaque saison, tu reçois des dalles et tu choisis un bonus.</li>
  </ul>`});

const cv=$("scene"),ctx=cv.getContext("2d");
const COULEURS=["#d8432f","#2b78d0","#eeaa12","#8a4fd0","#0fa596"];
let J=null,cote=40,portrait=false,pause=false,vite=false,gomme=false,dernier=0,toucheCourante=null,fenetreChoix=false,finAffichee=false;

/* ---------- Partie ---------- */
function nouvellePartie(){
  J=SentiersMoteur.creer(Math.random()*2147483647|0);
  pause=false;finAffichee=false;fenetreChoix=false;
  majBoutons();
}
function majBoutons(){
  $("bPause").textContent=pause?"▶️ Reprendre":"⏸️ Pause";
  $("bVite").classList.toggle("on",vite);
  $("bGomme").classList.toggle("on",gomme);
  cv.classList.toggle("gomme",gomme);
}
function majInfos(){
  $("iScore").textContent=J.score;
  $("iSaison").textContent=J.saison;
  $("iDalles").innerHTML=`🧱 <b class="${J.dalles?"":"vide"}">${J.dalles}</b>`;
  $("iPonts").innerHTML=`🌉 <b class="${J.ponts?"":"vide"}">${J.ponts}</b>`;
}
function proposerCartes(){
  fenetreChoix=true;
  const zone=document.createElement("div");zone.className="cartes";
  const[a]=J.choix;
  let d=null;
  J.choix.forEach(c=>{
    const b=document.createElement("button");b.className="carte";b.type="button";
    const e=document.createElement("span");e.textContent=c.emoji;
    const t=document.createElement("b");t.textContent=c.titre;
    const s=document.createElement("small");s.textContent=c.texte;
    b.append(e,t,s);
    b.onclick=()=>{J.choisir(c.id);d&&d.close()};
    zone.appendChild(b);
  });
  Base.fenetre(`🍂 Saison ${J.saison} : choisis un bonus`,zone,{bouton:`Prendre « ${a.titre} »`,fermeture(){if(J.choix)J.choisir(a.id);fenetreChoix=false}});
  d=document.querySelector("dialog[open]:last-of-type");
}
function terminer(){
  finAffichee=true;
  const avant=store.lire("record",0);
  if(J.score>avant)store.ecrire("record",J.score);
  Base.record("sentiers",J.score,{mieux:"haut",texte:J.score+" fruits"});
  const r=document.createElement("div");r.className="recap";
  const m=Math.floor(J.temps/60),s=String(Math.floor(J.temps%60)).padStart(2,"0");
  r.innerHTML=`<p class="gros">🍎 ${J.score}</p><p class="muted">${m}:${s} de jeu · saison ${J.saison}</p><p class="muted">${J.score>avant?"🏆 Nouveau record !":"Record : "+avant+" fruits"}</p>`;
  Base.fenetre("🍂 L'arbre a débordé !",r,{bouton:"🔄 Rejouer",fermeture:nouvellePartie});
}

/* ---------- Taille et repères ---------- */
const cols=()=>portrait?H:L,lignes=()=>portrait?L:H;
function dimensionner(){
  const place=document.querySelector(".b-page").clientWidth-32;
  portrait=innerHeight>innerWidth&&innerWidth<760;
  cote=Math.max(16,Math.floor(Math.min(place/cols(),(innerHeight-(portrait?170:190))/lignes())));
  const r=devicePixelRatio||1;
  cv.width=cols()*cote*r;cv.height=lignes()*cote*r;
  cv.style.width=cols()*cote+"px";cv.style.height=lignes()*cote+"px";
  ctx.setTransform(r,0,0,r,0,0);
}
/* Sur un téléphone en hauteur, on dessine la même carte tournée d'un quart de tour */
const px=c=>{const x=c%L,y=c/L|0;return portrait?[(y+.5)*cote,(x+.5)*cote]:[(x+.5)*cote,(y+.5)*cote]};
function caseSous(e){
  const b=cv.getBoundingClientRect(),a=Math.floor((e.clientX-b.left)/cote),d=Math.floor((e.clientY-b.top)/cote);
  const x=portrait?d:a,y=portrait?a:d;
  return x<0||y<0||x>=L||y>=H?-1:y*L+x;
}

/* ---------- Tracé ---------- */
function tracerVers(c){
  let cur=toucheCourante.dernier;
  while(cur!==c){
    const x=cur%L,y=cur/L|0,tx=c%L,ty=c/L|0;
    const dx=tx-x,dy=ty-y;
    const suiv=Math.abs(dx)>=Math.abs(dy)?cur+Math.sign(dx):cur+Math.sign(dy)*L;
    if(!J.relier(cur,suiv)){
      if(J.sol[suiv]===J.EAU&&!J.ponts&&!J.liens.has(suiv))Base.toast("Plus de passerelles !");
      else if(!J.dalles&&J.sol[suiv]===J.HERBE)Base.toast("Plus de dalles : efface un sentier ou attends la saison suivante.");
      break;
    }
    cur=suiv;
  }
  toucheCourante.dernier=cur;
}
cv.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(J.fini)return;
  const c=caseSous(e);if(c<0)return;
  cv.setPointerCapture(e.pointerId);
  toucheCourante={efface:gomme||e.button===2,dernier:c};
  if(toucheCourante.efface)J.effacer(c);
});
cv.addEventListener("pointermove",e=>{
  if(!toucheCourante||J.fini)return;
  const c=caseSous(e);
  if(c<0||c===toucheCourante.dernier)return;
  if(toucheCourante.efface){J.effacer(c);toucheCourante.dernier=c}
  else tracerVers(c);
});
const lacher=()=>{toucheCourante=null};
cv.addEventListener("pointerup",lacher);
cv.addEventListener("pointercancel",lacher);
cv.addEventListener("contextmenu",e=>e.preventDefault());

/* ---------- Dessin ---------- */
function rond(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
/* Chaque couleur a sa forme, pour rester lisible sans distinguer les couleurs */
function forme(n,x,y,r,c){
  ctx.fillStyle=c;ctx.beginPath();
  if(n===0)ctx.arc(x,y,r,0,7);
  else if(n===1)ctx.rect(x-r*.85,y-r*.85,r*1.7,r*1.7);
  else if(n===2){ctx.moveTo(x,y-r*1.1);ctx.lineTo(x+r,y+r*.8);ctx.lineTo(x-r,y+r*.8);ctx.closePath()}
  else if(n===3){ctx.moveTo(x,y-r*1.2);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r*1.2);ctx.lineTo(x-r,y);ctx.closePath()}
  else for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.5:r*1.2;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}
  ctx.closePath();ctx.fill();
}
function dessinerSol(){
  for(let c=0;c<L*H;c++){
    const[x,y]=px(c),k=(c%L+(c/L|0))%2,s=J.sol[c],a=x-cote/2,b=y-cote/2;
    ctx.fillStyle=s===J.EAU?(k?"#5aa9d6":"#63b2de"):(k?"#a9cf7f":"#b2d688");
    ctx.fillRect(a,b,cote+.5,cote+.5);
    if(s===J.ROCHER){rond(x,y+cote*.05,cote*.34,"#8f8d86");rond(x-cote*.1,y-cote*.06,cote*.2,"#a9a79f")}
    if(s===J.EAU){ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(a+cote*.25,y);ctx.quadraticCurveTo(x,y-cote*.12,a+cote*.75,y);ctx.stroke()}
  }
}
function dessinerSentiers(){
  ctx.lineCap="round";
  for(const passe of[["#8a6a3f",.5],["#c9a26a",.4]]){
    ctx.strokeStyle=passe[0];ctx.lineWidth=cote*passe[1];ctx.beginPath();
    for(const[a,l]of J.liens)for(const b of l){
      if(a>b)continue;
      const[x1,y1]=px(a),[x2,y2]=px(b);ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
    }
    ctx.stroke();
  }
  // planches des passerelles
  ctx.strokeStyle="#7a5a30";ctx.lineWidth=2;
  for(const c of J.liens.keys()){
    if(J.sol[c]!==J.EAU)continue;
    const[x,y]=px(c),m=cote*.2;
    for(const d of[-m,0,m]){ctx.beginPath();ctx.moveTo(x-m,y+d);ctx.lineTo(x+m,y+d);ctx.stroke()}
  }
}
function dessinerTerrier(t){
  const[x,y]=px(t.c),e=Math.min(1,(J.temps-t.ne)*3);
  ctx.save();ctx.translate(x,y);ctx.scale(e,e);
  rond(0,0,cote*.46,"#6e4b2a");
  rond(0,0,cote*.36,COULEURS[t.couleur]);
  rond(0,cote*.04,cote*.2,"#2c1c0e");
  // animaux disponibles
  const libres=t.animaux-t.dehors;
  ctx.fillStyle="#fff";
  for(let i=0;i<Math.min(libres,5);i++){ctx.beginPath();ctx.arc((i-(Math.min(libres,5)-1)/2)*cote*.13,-cote*.26,cote*.05,0,7);ctx.fill()}
  ctx.restore();
}
function dessinerArbre(a){
  let[x,y]=px(a.c);
  const e=Math.min(1,(J.temps-a.ne)*3);
  if(a.danger>.4){x+=Math.sin(J.temps*40)*cote*.02*a.danger*2}
  ctx.save();ctx.translate(x,y);ctx.scale(e,e);
  rond(0,0,cote*.47,"#2f6b35");
  rond(-cote*.08,-cote*.08,cote*.3,"#3d8444");
  // un fruit dessiné par fruit en attente, sur le pourtour
  const n=Math.min(a.fruits,12);
  for(let i=0;i<n;i++){
    const an=-Math.PI/2+i*Math.PI*2/Math.max(n,J.ALERTE);
    forme(a.couleur,Math.cos(an)*cote*.3,Math.sin(an)*cote*.3,cote*.075,COULEURS[a.couleur]);
  }
  forme(a.couleur,0,0,cote*.13,COULEURS[a.couleur]);
  if(a.danger>0){
    ctx.strokeStyle="rgba(255,255,255,.75)";ctx.lineWidth=cote*.13;ctx.beginPath();ctx.arc(0,0,cote*.52,0,7);ctx.stroke();
    ctx.strokeStyle="#d81f1f";ctx.lineWidth=cote*.09;ctx.beginPath();ctx.arc(0,0,cote*.52,-Math.PI/2,-Math.PI/2+a.danger*Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}
function dessinerAnimal(n){
  const de=n.chemin[n.i],vers=n.chemin[n.i+1];
  let[x,y]=px(de);
  if(vers!=null){
    const[x2,y2]=px(vers);
    // chacun marche sur le côté droit du sentier, pour se croiser sans se gêner
    const dx=x2-x,dy=y2-y,dec=cote*.09/(Math.hypot(dx,dy)||1);
    x+=dx*n.t-dy*dec;y+=dy*n.t+dx*dec;
  }
  const c=COULEURS[n.terrier.couleur],r=cote*.13;
  rond(x-r*.6,y-r*.9,r*.42,c);rond(x+r*.6,y-r*.9,r*.42,c);
  rond(x,y,r+1,"#fff");rond(x,y,r,c);
  if(n.etat==="retour")forme(n.terrier.couleur,x,y,r*.5,"#fff");
}
function dessiner(){
  dessinerSol();dessinerSentiers();
  J.arbres.forEach(dessinerArbre);
  J.terriers.forEach(dessinerTerrier);
  J.animaux.forEach(dessinerAnimal);
  if(pause){
    ctx.fillStyle="rgba(0,0,0,.25)";ctx.fillRect(0,0,cols()*cote,lignes()*cote);
    ctx.fillStyle="#fff";ctx.font=`700 ${cote}px Fredoka,sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("Pause",cols()*cote/2,lignes()*cote/2);
  }
}

/* ---------- Boucle ---------- */
function boucle(t){
  const dt=Math.min(.1,(t-dernier)/1000);dernier=t;
  const bloque=pause||document.hidden||document.querySelector("dialog[open]");
  if(!bloque){
    const pas=vite?2:1;
    for(let i=0;i<pas;i++)J.avance(dt);
  }
  if(J.choix&&!fenetreChoix)proposerCartes();
  if(J.fini&&!finAffichee)terminer();
  majInfos();dessiner();
  requestAnimationFrame(boucle);
}

/* ---------- Contrôles ---------- */
$("bGomme").onclick=()=>{gomme=!gomme;majBoutons()};
$("bVite").onclick=()=>{vite=!vite;majBoutons()};
$("bPause").onclick=()=>{pause=!pause;majBoutons()};
$("bNouvelle").onclick=()=>{if(J.temps<20||confirm("Abandonner cette partie et recommencer ?"))nouvellePartie()};
document.addEventListener("keydown",e=>{
  if(document.querySelector("dialog[open]"))return;
  if(e.key===" "){e.preventDefault();pause=!pause;majBoutons()}
  if(e.key==="g"||e.key==="G"){gomme=!gomme;majBoutons()}
});
window.addEventListener("resize",dimensionner);

dimensionner();
nouvellePartie();
requestAnimationFrame(boucle);
</script>
</body>
</html>
