<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sudoku du jour</title>
<link rel="stylesheet" href="../commun/base.css">
<style>
:root{--accent:#4a6fd1;--fond1:rgba(74,111,209,.14);--fond2:rgba(242,165,90,.12);
  --case:#fff;--zone:#e8eefc;--meme:#c9d7fa;--sel:#9fb8f5;--donnee:#22192b;--saisie:#3456b8;--trait:#22192b;--fin:#c7c0cf}
@media (prefers-color-scheme:dark){:root{--case:#2a2333;--zone:#2f3550;--meme:#3a4876;--sel:#4d63a8;--donnee:#f3ecf6;--saisie:#9db6ff;--trait:#cfc6d8;--fin:#4a4155}}
.barre{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;max-width:480px;flex-wrap:wrap}
.infos{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:480px;font-weight:700;color:var(--muted);font-size:.9rem;gap:8px}
.chrono{font-family:Fredoka,sans-serif;font-size:1.25rem;color:var(--text);font-variant-numeric:tabular-nums}
.niveaux{display:flex;gap:6px;justify-content:center;width:100%}
.niveaux button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem}
.niveaux button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

#grille{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,480px);aspect-ratio:1;border:3px solid var(--trait);border-radius:10px;overflow:hidden;
  background:var(--trait);gap:1px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.c{background:var(--case);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;
  font-family:Fredoka,sans-serif;font-size:clamp(1.1rem,6.2vw,1.85rem);color:var(--saisie);font-weight:500}
.c.bd{margin-right:2px}.c.bb{margin-bottom:2px}
.c.donnee{color:var(--donnee);font-weight:700}
.c.zone{background:var(--zone)}
.c.meme{background:var(--meme)}
.c.sel{background:var(--sel)}
.c.faux{color:var(--ko)!important}
.c.faux::after{content:"";position:absolute;inset:3px;border-radius:6px;background:var(--ko);opacity:.14}
.c.indice{color:var(--ok)}
.c .notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  font:700 clamp(.5rem,2.3vw,.72rem)/1 Nunito,sans-serif;color:var(--muted)}
.c .notes span{display:flex;align-items:center;justify-content:center}
.c .notes span.vu{color:var(--saisie)}
.fini .c{cursor:default}
.fini .c:not(.donnee):not(.faux){color:var(--ok)}
@keyframes vague{50%{transform:scale(1.12)}}
.c.vague{animation:vague .35s}

.outils{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,480px)}
.outils button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 2px;font-weight:700;font-size:.8rem;
  display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:manipulation}
.outils button b{font-size:1.25rem;line-height:1}
.outils button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.outils button:disabled{opacity:.45;cursor:default}
.pave{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;width:min(100%,480px)}
.pave button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 0 4px;touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center}
.pave button b{font-family:Fredoka,sans-serif;font-size:1.6rem;line-height:1.1;color:var(--saisie)}
.pave button small{font-size:.65rem;color:var(--muted);font-weight:700}
.pave button:active{background:var(--soft)}
.pave button.epuise{opacity:.3}
.notesOn .pave button b{font-size:1.15rem;color:var(--muted)}
.help{color:var(--muted);font-size:.8rem;text-align:center;margin:0;max-width:480px}
@media (pointer:coarse){.help{display:none}}

.recap{text-align:center}
.recap .gros{font-family:Fredoka,sans-serif;font-size:2.2rem;margin:0}
.recap .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.recap .stats b{display:block;font-family:Fredoka,sans-serif;font-size:1.35rem}
.recap .stats small{color:var(--muted);font-size:.7rem}
.recap .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.recap .prochain{font-size:.85rem;color:var(--muted);margin:10px 0 0}
</style>
</head>
<body>
<main class="b-page">
  <div class="barre">
    <div class="pilules">
      <button id="mJour">📅 Sudoku du jour</button>
      <button id="mLibre">♾️ Partie libre</button>
    </div>
    <span class="chrono" id="chrono">0:00</span>
  </div>
  <div class="niveaux cache" id="niveaux"></div>
  <div class="infos"><span id="sous"></span><span id="erreurs"></span></div>
  <div id="grille"></div>
  <div class="outils">
    <button id="bAnnuler"><b>↩️</b>Annuler</button>
    <button id="bEffacer"><b>🧽</b>Effacer</button>
    <button id="bNotes"><b>✏️</b>Notes</button>
    <button id="bIndice"><b>💡</b>Indice</button>
  </div>
  <div class="pave" id="pave"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <button class="btn ghost petit" id="bStats">📊 Statistiques</button>
    <button class="btn ghost petit" id="bSol">🏳️ Abandonner</button>
    <button class="btn petit cache" id="bNouvelle">🔄 Nouvelle grille</button>
  </div>
  <p class="help">Clavier : chiffres 1-9 · flèches pour bouger · Retour pour effacer · N : notes · Ctrl+Z : annuler</p>
</main>

<script src="../commun/garde.js"></script>
<script src="../commun/base.js"></script>
<script src="../commun/classement.js"></script>
<script src="../commun/series.js"></script>
<script>
const $=id=>document.getElementById(id);
const store=Base.stock("sudoku_");

Base.entete({titre:"Sudoku",emoji:"🔢",
  aide:`<p>Remplis la grille pour que chaque <b>ligne</b>, chaque <b>colonne</b> et chaque <b>carré 3×3</b> contienne tous les chiffres de 1 à 9, une seule fois.</p>
  <ul>
    <li>Touche une case, puis un chiffre en bas (ou tape-le au clavier).</li>
    <li>✏️ <b>Notes</b> : écris des petits chiffres pour noter tes hypothèses.</li>
    <li>Un chiffre faux s'affiche en rouge et compte comme une erreur.</li>
    <li>💡 <b>Indice</b> remplit la case choisie (ou une case au hasard).</li>
    <li>📅 Même grille pour tout le monde, nouvelle chaque jour à minuit. Elle se corse au fil de la semaine : facile en début de semaine, difficile le week-end. ♾️ La partie libre donne des grilles à volonté, au niveau de ton choix.</li>
  </ul>`});

/* ---------- Jour (heure de Paris) ---------- */
const START=Date.UTC(2026,10,1);
function parisDay(){const[y,m,d]=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()).split("-").map(Number);return Math.floor((Date.UTC(y,m-1,d)-START)/864e5)}
const NIVEAUX={facile:{nom:"Facile",indices:38},moyen:{nom:"Moyen",indices:31},difficile:{nom:"Difficile",indices:25}};
// 1er novembre 2026 = dimanche → jour 0. Lun/Mar facile, Mer/Jeu moyen, Ven/Sam/Dim difficile.
function niveauDuJour(j){const sem=(j%7+7)%7;return[ "difficile","facile","facile","moyen","moyen","difficile","difficile"][sem]}

/* ---------- Générateur (déterministe à partir d'une graine) ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function melange(a,r){a=[...a];for(let i=a.length-1;i>0;i--){const j=r()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const BOITE=i=>((i/27|0)*3)+((i%9)/3|0);
const bits=n=>{let c=0;while(n){n&=n-1;c++}return c};

/* Compte les solutions (s'arrête à « limite ») */
function compter(g,limite){
  g=g.slice();const L=new Array(9).fill(0),C=new Array(9).fill(0),B=new Array(9).fill(0);
  for(let i=0;i<81;i++)if(g[i]){const m=1<<g[i];L[i/9|0]|=m;C[i%9]|=m;B[BOITE(i)]|=m}
  let n=0;
  (function rec(){
    let best=-1,bm=0,bc=10;
    for(let i=0;i<81;i++)if(!g[i]){const m=~(L[i/9|0]|C[i%9]|B[BOITE(i)])&0x3FE,c=bits(m);if(c<bc){bc=c;best=i;bm=m;if(c<=1)break}}
    if(best<0){n++;return}
    if(!bc)return;
    for(let v=1;v<=9&&n<limite;v++)if(bm&(1<<v)){
      const m=1<<v,l=best/9|0,c=best%9,b=BOITE(best);
      g[best]=v;L[l]|=m;C[c]|=m;B[b]|=m;rec();g[best]=0;L[l]&=~m;C[c]&=~m;B[b]&=~m;
    }
  })();
  return n;
}
function grillePleine(r){
  const g=new Array(81).fill(0);
  const ok=(i,v)=>{const l=i/9|0,c=i%9,b=BOITE(i);for(let k=0;k<81;k++)if(g[k]===v&&((k/9|0)===l||k%9===c||BOITE(k)===b))return false;return true};
  (function rec(i){if(i===81)return true;for(const v of melange([1,2,3,4,5,6,7,8,9],r))if(ok(i,v)){g[i]=v;if(rec(i+1))return true}g[i]=0;return false})(0);
  return g;
}
function generer(seed,niv){
  const r=rng(seed),sol=grillePleine(r),p=sol.slice(),cible=NIVEAUX[niv].indices;
  let n=81;
  for(const i of melange([...Array(41).keys()],r)){
    if(n<=cible)break;
    const j=80-i,a=p[i],b=p[j];p[i]=0;p[j]=0;
    if(compter(p,2)===1)n-=i===j?1:2;else{p[i]=a;p[j]=b}
  }
  return{sol,depart:p};
}

/* ---------- État ---------- */
const defStats=()=>({played:0,wins:0,streak:0,best:0,lastWin:null,last:null,temps:null,sansFaute:0});
let mode="jour",niv="moyen",nivLibre=store.lire("nivLibre","moyen"),seed=0,G=null,val=[],notes=[],faux=[],indic=[],erreurs=0,indices=0,secondes=0,fini=false,gagne=false,sel=40,modeNotes=false,histo=[];

function sauver(){store.ecrire(mode,{seed,niv,jour:parisDay(),val,notes,faux,indic,erreurs,indices,secondes,fini,gagne})}
function charger(m){
  mode=m;$("mJour").classList.toggle("on",m==="jour");$("mLibre").classList.toggle("on",m==="libre");
  const sv=store.lire(m,null),j=parisDay();
  if(m==="jour"){niv=niveauDuJour(j);seed=j*9973+71}
  else if(sv&&sv.seed!=null&&!sv.fini){seed=sv.seed;niv=sv.niv||nivLibre}
  else{niv=nivLibre;seed=Math.random()*2147483647|0}
  G=generer(seed,niv);
  const ok=sv&&sv.seed===seed&&sv.niv===niv&&Array.isArray(sv.val)&&sv.val.length===81;
  val=ok?sv.val:G.depart.slice();notes=ok?sv.notes:new Array(81).fill(0);faux=ok?sv.faux:new Array(81).fill(false);indic=ok?(sv.indic||new Array(81).fill(false)):new Array(81).fill(false);
  erreurs=ok?sv.erreurs:0;indices=ok?sv.indices:0;secondes=ok?sv.secondes:0;fini=ok&&sv.fini;gagne=ok&&sv.gagne;histo=[];
  sel=G.depart.findIndex(v=>!v);if(sel<0)sel=0;
  $("niveaux").classList.toggle("cache",m!=="libre");$("bNouvelle").classList.toggle("cache",m!=="libre");
  majNiveaux();
  $("sous").textContent=m==="jour"
    ?`n°${j+1} · ${NIVEAUX[niv].nom} · ${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",timeZone:"Europe/Paris"})}`
    :`Partie libre · ${NIVEAUX[niv].nom}`;
  sauver();rafraichir();
  if(fini)setTimeout(finDePartie,350);
}
function nouvelleLibre(){store.ecrire("libre",null);charger("libre")}
function majNiveaux(){
  const z=$("niveaux");z.innerHTML="";
  for(const[k,o]of Object.entries(NIVEAUX)){
    const b=document.createElement("button");b.textContent=o.nom;b.className=k===nivLibre?"on":"";
    b.onclick=()=>{
      if(k===nivLibre&&mode==="libre"&&!fini)return;
      const enCours=mode==="libre"&&!fini&&val.some((v,i)=>v&&!G.depart[i]);
      if(enCours&&!confirm("Commencer une nouvelle grille "+o.nom.toLowerCase()+" ? La grille en cours sera perdue."))return;
      nivLibre=k;store.ecrire("nivLibre",k);nouvelleLibre();
    };
    z.appendChild(b);
  }
}

/* ---------- Affichage ---------- */
const cases=[];
(function construire(){
  const g=$("grille");
  for(let i=0;i<81;i++){
    const d=document.createElement("div"),l=i/9|0,c=i%9;
    d.className="c";if(c===2||c===5)d.classList.add("bd");if(l===2||l===5)d.classList.add("bb");
    d.onclick=()=>{if(fini)return;sel=i;rafraichir()};
    g.appendChild(d);cases.push(d);
  }
  const p=$("pave");
  for(let v=1;v<=9;v++){const b=document.createElement("button");b.innerHTML=`<b>${v}</b><small></small>`;b.onclick=()=>saisir(v);p.appendChild(b)}
})();
const memeZone=(a,b)=>(a/9|0)===(b/9|0)||a%9===b%9||BOITE(a)===BOITE(b);
function rafraichir(){
  const vs=val[sel];
  cases.forEach((d,i)=>{
    const v=val[i];
    d.classList.toggle("donnee",!!G.depart[i]);
    d.classList.toggle("faux",!!faux[i]&&!!v);
    d.classList.toggle("indice",!!indic[i]);
    d.classList.toggle("sel",!fini&&i===sel);
    d.classList.toggle("meme",!fini&&i!==sel&&!!vs&&v===vs);
    d.classList.toggle("zone",!fini&&i!==sel&&memeZone(i,sel)&&!(vs&&v===vs));
    d.innerHTML="";
    if(v)d.textContent=v;
    else if(notes[i]){
      const n=document.createElement("div");n.className="notes";
      for(let k=1;k<=9;k++){const s=document.createElement("span");if(notes[i]&(1<<k)){s.textContent=k;if(k===vs)s.className="vu"}n.appendChild(s)}
      d.appendChild(n);
    }
  });
  $("grille").classList.toggle("fini",fini);
  document.body.classList.toggle("notesOn",modeNotes);
  $("bNotes").classList.toggle("on",modeNotes);
  [...$("pave").children].forEach((b,k)=>{
    const v=k+1,reste=9-val.filter((x,i)=>x===v&&!faux[i]).length;
    b.querySelector("small").textContent=reste>0?reste:"";
    b.classList.toggle("epuise",reste<=0);
    b.disabled=fini;
  });
  ["bAnnuler","bEffacer","bNotes","bIndice","bSol"].forEach(id=>$(id).disabled=fini);
  $("bAnnuler").disabled=fini||!histo.length;
  $("erreurs").textContent=`❌ ${erreurs} erreur${erreurs>1?"s":""}`+(indices?` · 💡 ${indices}`:"");
  majChrono();
}
const fmt=s=>{const h=s/3600|0,m=(s%3600)/60|0,x=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
function majChrono(){$("chrono").textContent=fmt(secondes)}
setInterval(()=>{if(!G||fini||document.hidden)return;secondes++;majChrono();if(secondes%5===0)sauver()},1000);

/* ---------- Actions ---------- */
function memo(){histo.push({i:sel,v:val[sel],n:notes[sel],f:faux[sel]});if(histo.length>300)histo.shift()}
function saisir(v){
  if(fini||G.depart[sel]||indic[sel])return;
  if(modeNotes){
    if(val[sel])return;
    memo();notes[sel]^=1<<v;
  }else{
    if(val[sel]===v&&!faux[sel])return;
    memo();val[sel]=v;notes[sel]=0;
    if(v!==G.sol[sel]){faux[sel]=true;erreurs++;cases[sel].animate([{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"none"}],{duration:220})}
    else{faux[sel]=false;nettoyerNotes(sel,v);vagues(sel)}
  }
  apres();
}
function nettoyerNotes(i,v){for(let k=0;k<81;k++)if(k!==i&&memeZone(k,i))notes[k]&=~(1<<v)}
function vagues(i){
  const l=i/9|0,c=i%9,b=BOITE(i),ok=k=>val[k]&&!faux[k];
  const groupes=[[...Array(9)].map((_,x)=>l*9+x),[...Array(9)].map((_,y)=>y*9+c),[...Array(81).keys()].filter(k=>BOITE(k)===b)];
  groupes.filter(gr=>gr.every(ok)).flat().forEach((k,n)=>setTimeout(()=>{cases[k].classList.remove("vague");void cases[k].offsetWidth;cases[k].classList.add("vague")},(n%9)*30));
}
function effacer(){
  if(fini||G.depart[sel]||indic[sel]||(!val[sel]&&!notes[sel]))return;
  memo();val[sel]=0;notes[sel]=0;faux[sel]=false;apres();
}
function annuler(){
  const h=histo.pop();if(!h||fini)return;
  val[h.i]=h.v;notes[h.i]=h.n;faux[h.i]=h.f;sel=h.i;sauver();rafraichir();
}
function indice(){
  if(fini)return;
  let i=sel;
  if(G.depart[i]||(val[i]&&!faux[i])){const vides=[...Array(81).keys()].filter(k=>!val[k]||faux[k]);if(!vides.length)return;i=vides[Math.random()*vides.length|0]}
  sel=i;val[i]=G.sol[i];faux[i]=false;notes[i]=0;indic[i]=true;indices++;nettoyerNotes(i,val[i]);histo=histo.filter(h=>h.i!==i);
  vagues(i);apres();
}
function apres(){
  if(val.every((v,i)=>v===G.sol[i])){fini=true;gagne=true;terminer()}
  sauver();rafraichir();
}
function abandonner(){
  if(fini)return;
  if(!confirm("Abandonner et voir la solution ?"+(mode==="jour"?" Ta série de jours sera remise à zéro.":"")))return;
  for(let i=0;i<81;i++)if(val[i]!==G.sol[i]){val[i]=G.sol[i];faux[i]=false;notes[i]=0;indic[i]=true}
  fini=true;gagne=false;terminer();sauver();rafraichir();
}

/* ---------- Fin, stats, séries ---------- */
function terminer(){
  const j=parisDay();
  if(mode==="jour"){
    const s=store.lire("statsDaily",defStats());
    if(s.last!==j){
      s.played++;s.last=j;
      if(gagne){s.wins++;s.streak=s.lastWin===j-1?s.streak+1:1;s.lastWin=j;if(!erreurs&&!indices)s.sansFaute=(s.sansFaute||0)+1;if(s.temps==null||secondes<s.temps)s.temps=secondes}
      else s.streak=0;
      s.best=Math.max(s.best,s.streak);store.ecrire("statsDaily",s);
      Series.envoyer("sudoku",s,j);
    }
  }else{
    const r=store.lire("recordsLibre",{});
    if(gagne&&!indices&&(r[niv]==null||secondes<r[niv])){r[niv]=secondes;store.ecrire("recordsLibre",r);Base.toast("🏆 Nouveau record en "+NIVEAUX[niv].nom+" !")}
  }
  setTimeout(finDePartie,gagne?900:400);
}
function texteResultat(){
  const tete=mode==="jour"?`🔢 Sudoku n°${parisDay()+1} · ${NIVEAUX[niv].nom}`:`🔢 Sudoku (partie libre) · ${NIVEAUX[niv].nom}`;
  return`${tete}\n${gagne?"✅":"🏳️"} ⏱️ ${fmt(secondes)} · ❌ ${erreurs} · 💡 ${indices}\n${location.href.split("#")[0]}`;
}
function finDePartie(){
  const j=parisDay(),box=document.createElement("div");box.className="recap";
  const titre=!fini?(mode==="jour"?"Statistiques du jour":"Statistiques"):gagne?(!erreurs&&!indices?"🌟 Parfait, sans faute !":"🎉 Grille terminée !"):"🏳️ Abandon";
  const gros=document.createElement("p");gros.className="gros";gros.textContent=fini?fmt(secondes):"";box.appendChild(gros);
  if(fini){const p=document.createElement("p");p.className="muted";p.style.margin="2px 0 0";p.textContent=`${NIVEAUX[niv].nom} · ${erreurs} erreur${erreurs>1?"s":""} · ${indices} indice${indices>1?"s":""}`;box.appendChild(p)}
  const st=document.createElement("div");st.className="stats";
  if(mode==="jour"){
    const s=store.lire("statsDaily",defStats()),serie=Series.courante(s,j);
    [[s.played,"Parties"],[s.played?Math.round(s.wins/s.played*100)+"%":"–","Réussite"],[serie,"Série"],[s.temps!=null?fmt(s.temps):"–","Meilleur temps"]]
      .forEach(([v,l])=>{const d=document.createElement("div");d.innerHTML=`<b>${v}</b><small>${l}</small>`;st.appendChild(d)});
  }else{
    const r=store.lire("recordsLibre",{});
    st.style.gridTemplateColumns="repeat(3,1fr)";
    Object.entries(NIVEAUX).forEach(([k,o])=>{const d=document.createElement("div");d.innerHTML=`<b>${r[k]!=null?fmt(r[k]):"–"}</b><small>Record ${o.nom}</small>`;st.appendChild(d)});
  }
  box.appendChild(st);
  const act=document.createElement("div");act.className="actions";
  if(fini){
    const b=document.createElement("button");b.className="btn ghost petit";b.textContent="📋 Partager";
    b.onclick=async()=>{const t=texteResultat();try{await navigator.clipboard.writeText(t);Base.toast("Résultat copié !")}catch(e){if(navigator.share)navigator.share({text:t}).catch(()=>{});else Base.toast("Copie impossible")}};
    act.appendChild(b);
  }
  const lib=document.createElement("button");lib.className="btn petit";lib.textContent=mode==="libre"?"🔄 Nouvelle grille":"♾️ Partie libre";
  lib.onclick=()=>{dlg.close();mode==="libre"?nouvelleLibre():charger("libre")};act.appendChild(lib);
  box.appendChild(act);
  if(mode==="jour"){
    const n=document.createElement("p");n.className="prochain";
    const dem=niveauDuJour(j+1);n.textContent=`Prochaine grille à minuit · niveau ${NIVEAUX[dem].nom.toLowerCase()}`;box.appendChild(n);
    const z1=document.createElement("div"),z2=document.createElement("div");box.append(z1,z2);
    Series.panneau(z1,"sudoku",store.lire("statsDaily",null),j);
    Series.aujourdhui(z2,"sudoku",j,{moi:fini?{e:erreurs+indices,g:gagne}:null,unite:"erreur",gagnantsSeulement:true,reussite:true});
  }
  const dlg=Base.fenetre(titre,box,{bouton:"Fermer"});
}

/* ---------- Commandes ---------- */
$("mJour").onclick=()=>charger("jour");
$("mLibre").onclick=()=>charger("libre");
$("bNouvelle").onclick=()=>{if(!fini&&val.some((v,i)=>v&&!G.depart[i])&&!confirm("Abandonner cette grille pour une nouvelle ?"))return;nouvelleLibre()};
$("bAnnuler").onclick=annuler;
$("bEffacer").onclick=effacer;
$("bNotes").onclick=()=>{modeNotes=!modeNotes;rafraichir()};
$("bIndice").onclick=indice;
$("bSol").onclick=abandonner;
$("bStats").onclick=finDePartie;
document.addEventListener("keydown",e=>{
  if(document.querySelector("dialog[open]")||e.target.closest("input,textarea"))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();annuler();return}
  if(e.ctrlKey||e.metaKey||e.altKey||fini)return;
  const d={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key];
  if(d){e.preventDefault();const l=sel/9|0,c=sel%9;
    if(d===-1)sel=l*9+(c+8)%9;else if(d===1)sel=l*9+(c+1)%9;else sel=(sel+d+81)%81;rafraichir();return}
  if(/^[1-9]$/.test(e.key)){saisir(+e.key);return}
  // pavé numérique avec Verr. Num désactivé / claviers AZERTY sans Maj
  const az={"&":1,"é":2,'"':3,"'":4,"(":5,"-":6,"è":7,"_":8,"ç":9}[e.key];if(az){saisir(az);return}
  if(e.key==="Backspace"||e.key==="Delete"||e.key==="0"){e.preventDefault();effacer();return}
  if(e.key.toLowerCase()==="n"){modeNotes=!modeNotes;rafraichir()}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)majChrono()});

charger("jour");
</script>
