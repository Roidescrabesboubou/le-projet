<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Duel de western</title>
<link rel="stylesheet" href="../commun/base.css">
<link rel="stylesheet" href="../commun/soiree.css">
<link rel="stylesheet" href="../commun/apero.css">
<style>
:root{--accent:#b8651b;--fond1:rgba(184,101,27,.16);--fond2:rgba(242,193,78,.14)}
.duel{border-radius:20px;padding:26px 14px;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:8px;background:#3b2412;color:#ffe8c2;transition:background .05s}
.duel.feu{background:#e03131;color:#fff}
.duel.ok{background:#2f9e44;color:#fff}
.duel.faux{background:#5c5c5c;color:#fff}
.duel h2{font-family:Fredoka,sans-serif;font-size:3rem;margin:0;line-height:1}
.duel p{margin:0;font-weight:700}
.duel .gros{font-size:4rem;line-height:1}
.etat{font-size:.9rem;opacity:.85}
.bang{width:100%;border:0;border-radius:20px;padding:40px 10px;font:800 2rem Fredoka,sans-serif;background:#ffe8c2;color:#3b2412;margin-top:10px;cursor:pointer}
.ms{font-family:Fredoka,sans-serif}
</style>
</head>
<body>
<script src="../commun/garde.js"></script>
<script src="../commun/base.js"></script>
<script src="../commun/reseau.js"></script>
<script src="../commun/soiree.js"></script>
<script src="../commun/apero.js"></script>
<script>
const {podium, pastilles} = Soiree;
const esc = Base.esc;
const ATTENTE = 7000;   // délai max après « FEU » pour tirer

Base.entete({
  titre: "Duel de western",
  emoji: "🤠",
  aide: `<p>Chacun son téléphone, debout face à face.</p>
    <ul><li>Tiens ton téléphone <b>pointé vers le sol</b>, le long de la jambe : c'est ton revolver dans son étui.</li>
    <li>Au signal <b>« FEU ! »</b> (son et vibration), dégaine : lève le téléphone à l'horizontale, vers ton adversaire.</li>
    <li>Le plus rapide gagne la manche, le plus lent <b>boit</b>. Dégainer avant le signal = <b>faux départ</b>, tu bois aussi.</li>
    <li>Sans capteur (ordinateur) : touche le gros bouton au signal.</li></ul>`
});

const presents = G => G.J.filter(j => !j.parti);
const jDe = (G, id) => G.J.find(j => j.id === id);
const fini = G => presents(G).every(j => G.tirs[j.id] != null);
function cloturer(G){
  G.phase = "res";
  const ok = presents(G).filter(j => typeof G.tirs[j.id] === "number").sort((a, b) => G.tirs[a.id] - G.tirs[b.id]);
  if(ok.length) ok[0].pts++;
  G.graine = Math.floor(Math.random() * 1e6);
}

/* le duel sur ce téléphone : renvoie un temps en ms, "faux" ou "lent" */
function duel(zone, V, maintenant, envoyer){
  zone.innerHTML = `<div class="duel" id="d"><div class="gros">🤠</div><h2 id="t">Prêt ?</h2><p id="s">Téléphone pointé vers le sol</p><p class="etat" id="e"></p></div>`;
  const d = zone.querySelector("#d"), t = zone.querySelector("#t"), s = zone.querySelector("#s"), e = zone.querySelector("#e");
  let arrets = [], fini = false, goLocal = 0, etui = false, capteur = !!V.capteurs;
  const stop = () => { arrets.forEach(f => f()); arrets = []; };
  const tirer = r => {
    if(fini) return; fini = true; stop();
    if(r === "faux"){ d.className = "duel faux"; t.textContent = "Faux départ !"; s.textContent = "Tu as dégainé trop tôt 😬"; Apero.son(150, 400, "sawtooth"); }
    else if(r === "lent"){ d.className = "duel faux"; t.textContent = "Trop lent…"; s.textContent = ""; }
    else{ d.className = "duel ok"; t.textContent = "BANG !"; s.innerHTML = `<span class="ms">${r} ms</span>`; Apero.boum(250, .5); }
    envoyer({t: "tir", v: r});
  };
  const delai = V.go - maintenant();
  goLocal = performance.now() + delai;
  if(delai < -500){ t.textContent = "Trop tard pour cette manche"; return stop; }
  // signal
  const signal = setTimeout(() => {
    if(fini) return;
    d.className = "duel feu"; t.textContent = "FEU !"; s.textContent = "";
    Apero.son(1200, 250, "square", .35); Apero.vibrer(300);
  }, Math.max(0, delai));
  arrets.push(() => clearTimeout(signal));
  arrets.push((() => { const x = setTimeout(() => tirer("lent"), Math.max(0, delai) + ATTENTE - 500); return () => clearTimeout(x); })());
  if(capteur){
    e.textContent = "En attente du capteur…";
    arrets.push(Apero.surOrientation(o => {
      if(fini) return;
      const bas = o.beta < -50;                     // haut du téléphone vers le sol
      const leve = o.beta > -25 && o.beta < 120;    // à l'horizontale ou au-dessus
      const now = performance.now();
      if(bas && !etui){ etui = true; e.textContent = "🔫 Dans l'étui, ne bouge plus…"; }
      if(leve){
        if(now < goLocal){ if(etui) tirer("faux"); else e.textContent = "⬇️ Pointe le téléphone vers le sol !"; }
        else tirer(Math.round(now - goLocal));
      }
    }));
  }else{
    const b = Base.el("button", "🔫 BANG", "bang ap-zone");
    zone.appendChild(b);
    b.onpointerdown = ev => { ev.preventDefault(); const now = performance.now(); tirer(now < goLocal ? "faux" : Math.round(now - goLocal)); };
    s.textContent = "Touche BANG dès que l'écran devient rouge";
  }
  return () => { fini = true; stop(); };
}

Apero.demarrer({
  jeu: "western", titre: "Duel de western", emoji: "🤠", min: 2, max: 8, local: false,
  hero: {
    texte: "Téléphone pointé vers le sol comme un revolver dans son étui. Au signal, dégaine ! Le plus lent boit.",
    etapes: ["1 · Téléphone vers le sol", "2 · Attends « FEU »", "3 · Dégaine !"]
  },
  reglages: [{k: "nb", titre: "Nombre de manches", options: [[3, "3"], [5, "5"], [10, "10"]], def: 5}],
  nouvelle(joueurs, R){ return {R, J: joueurs.map(j => ({...j, pts: 0})), m: 0, phase: "pret", prets: {}, tirs: {}, hote: joueurs[0].id}; },
  action(G, id, a){
    if(!jDe(G, id)) return false;
    if(a.t === "pret" && G.phase === "pret"){ G.prets[id] = a.c ? 1 : 0; return true; }
    if(a.t === "lancer" && id === G.hote && (G.phase === "pret" || G.phase === "res")){
      if(G.phase === "res") G.m++;
      if(G.m >= G.R.nb){ G.phase = "fin"; return true; }
      G.phase = "duel"; G.tirs = {}; G.go = Date.now() + 3500 + Math.random() * 5000;
      return true;
    }
    if(a.t === "tir" && G.phase === "duel" && G.tirs[id] == null){
      G.tirs[id] = typeof a.v === "number" ? Math.max(0, Math.min(ATTENTE, Math.round(a.v))) : (a.v === "faux" ? "faux" : "lent");
      if(fini(G)) cloturer(G);
      return true;
    }
    if(a.t === "delai" && id === G.hote && G.phase === "duel" && Date.now() > G.go + ATTENTE){
      presents(G).forEach(j => { if(G.tirs[j.id] == null) G.tirs[j.id] = "lent"; });
      cloturer(G); return true;
    }
    return false;
  },
  depart(G, id){ const j = jDe(G, id); if(j) j.parti = true; if(G.phase === "duel" && presents(G).length && fini(G)) cloturer(G); },
  arrivee(G, j){ if(!jDe(G, j.id)) G.J.push({...j, pts: 0}); },
  publique(G){ return {phase: G.phase, m: G.m, nb: G.R.nb, J: G.J, prets: G.prets, tirs: G.tirs, go: G.go, graine: G.graine, R: G.R, hote: G.hote}; },
  rendre(box, ctx){
    const {V, moi} = ctx, R = V.R;
    const haut = `<div class="so-haut"><span>Manche ${Math.min(V.m + 1, V.nb)} / ${V.nb}</span><span>🤠</span></div>`;
    if(V.phase === "pret"){
      const pret = V.prets[moi] != null, tous = V.J.filter(j => !j.parti).every(j => V.prets[j.id] != null);
      box._phase = null;
      box.innerHTML = `<section class="b-carte ap-carte">${haut}<p class="ap-enorme">🤠</p>
        <p class="ap-gros">Placez-vous face à face</p>
        <p class="muted">Monte le son. Téléphone dans la main, bras le long du corps, écran contre la jambe.</p>
        ${pret ? `<p class="so-attente">✅ Prêt</p>` : `<div class="so-actions"><button class="btn so-gros" id="pret">🤠 Je suis prêt</button></div>`}
        ${pastilles(V.J, Object.keys(V.prets))}
        ${ctx.hote ? `<div class="so-actions"><button class="btn so-gros" id="lancer" ${tous ? "" : "disabled"}>🔫 Lancer le duel</button></div>` : ""}</section>`;
      const p = box.querySelector("#pret");
      if(p) p.onclick = async () => { p.disabled = true; const c = await Apero.mouvement(); Apero.eveil(); box._capteur = c; ctx.envoyer({t: "pret", c}); };
      const l = box.querySelector("#lancer"); if(l) l.onclick = () => ctx.envoyer({t: "lancer"});
      return;
    }
    if(V.phase === "duel"){
      if(ctx.hote && !box._delai){ box._delai = setTimeout(() => { box._delai = null; ctx.envoyer({t: "delai"}); }, Math.max(0, V.go - Date.now()) + ATTENTE + 300); }
      if(V.tirs[moi] == null || box._phase === V._id + ":duel:" + V.m){
        Apero.phase(box, V._id + ":duel:" + V.m, () => {
          box.innerHTML = `<section class="b-carte">${haut}<div id="zone"></div><div id="qui"></div></section>`;
          return duel(box.querySelector("#zone"), {go: V.go, capteurs: box._capteur !== false && V.prets[moi] === 1}, ctx.maintenant, ctx.envoyer);
        });
        const q = box.querySelector("#qui"); if(q) q.innerHTML = pastilles(V.J, Object.keys(V.tirs));
        return;
      }
    }
    if(V.phase === "res"){
      clearTimeout(box._delai); box._delai = null;
      Apero.phase(box, V._id + ":res:" + V.m, () => {
        const l = V.J.filter(j => V.tirs[j.id] != null);
        const val = j => typeof V.tirs[j.id] === "number" ? V.tirs[j.id] : 1e9;
        l.sort((a, b) => val(a) - val(b));
        const bons = l.filter(j => typeof V.tirs[j.id] === "number");
        const perdants = l.filter(j => typeof V.tirs[j.id] !== "number");
        if(bons.length > 1 && !perdants.length) perdants.push(bons[bons.length - 1]);
        if(!bons.length && !perdants.length) perdants.push(...l);
        const txt = j => typeof V.tirs[j.id] === "number" ? V.tirs[j.id] + " ms" : V.tirs[j.id] === "faux" ? "faux départ" : "trop lent";
        box.innerHTML = `<section class="b-carte">${haut}
          <ol class="ap-res">${l.map((j, i) => `<li class="${i === 0 && bons.length ? "top" : perdants.includes(j) ? "pire" : ""} ${j.id === moi ? "moi" : ""}"><span class="av">${esc(j.av)}</span><span class="n">${i === 0 && bons.length ? "🏆 " : ""}${esc(j.nom)}</span><b>${txt(j)}</b></li>`).join("")}</ol>
          ${perdants.map((j, i) => `<div class="ap-peine">${Apero.boit(R, j.nom, V.tirs[j.id] === "faux" ? 2 : 1, V.graine + i)}</div>`).join("")}
          ${ctx.hote ? `<div class="so-actions"><button class="btn so-gros" id="lancer">${V.m + 1 >= V.nb ? "🏁 Bilan" : "🔫 Manche suivante"}</button></div>` : `<p class="so-attente">⏳ L'hôte relance…</p>`}</section>`;
        const b = box.querySelector("#lancer"); if(b) b.onclick = () => ctx.envoyer({t: "lancer"});
      });
      return;
    }
    if(V.phase === "fin") Apero.phase(box, V._id + ":fin", () => {
      box.innerHTML = `<section class="b-carte"><h2 style="text-align:center;margin:0">🏁 La gâchette la plus rapide</h2>${podium(V.J, moi, {unite: "🏆"})}${ctx.finHtml()}</section>`;
    });
  }
});
</script>
</body>
</html>
