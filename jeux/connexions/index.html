<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexions</title>
<link rel="stylesheet" href="../commun/base.css">
<style>
:root{--bg:#f7f3fb;--card:#fff;--text:#1f1a29;--muted:#736a80;--line:#e3dbec;--soft:#ece5f4;
  --tile:#ece4f3;--sel:#4b3f5c;--l0:#f2d36b;--l1:#8fcf72;--l2:#8bb8ea;--l3:#bb8be0;--accent:#7b4fc8}
@media (prefers-color-scheme:dark){:root{--bg:#15121b;--card:#211c2a;--text:#f2ecf8;--muted:#a59bb3;--line:#352d42;--soft:#2a2335;--tile:#2f2740;--sel:#e9e1f5}}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(circle at 12% 6%,rgba(242,211,107,.18),transparent 40%),radial-gradient(circle at 88% 25%,rgba(187,139,224,.16),transparent 40%)}
button{font:inherit;cursor:pointer;color:inherit}
main{max-width:600px;margin:0 auto;padding:14px 12px 50px}
.modes{display:flex;justify-content:center;gap:6px}
.modes button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem}
.modes button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.sub{text-align:center;color:var(--muted);font-size:.85rem;margin:6px 0 4px}
.intro{text-align:center;margin:8px 0 14px;font-weight:700}
#board{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.t{height:clamp(62px,17vw,82px);border:0;border-radius:12px;background:var(--tile);font-weight:800;font-size:clamp(.7rem,3.2vw,.98rem);
  text-transform:uppercase;padding:4px;line-height:1.15;word-break:break-word;hyphens:auto;transition:transform .12s,background .15s;user-select:none}
.t.long{font-size:clamp(.58rem,2.6vw,.8rem)}
.t:active{transform:scale(.95)}
.t.sel{background:var(--sel);color:var(--bg)}
.t.jump{animation:jump .35s ease}
@keyframes jump{40%{transform:translateY(-8px)}}
.found{border-radius:12px;padding:12px 10px;text-align:center;color:#1f1a29}
.found.new{animation:pop .35s ease}
.found b{display:block;font-family:Fredoka,sans-serif;font-size:1.05rem;text-transform:uppercase;letter-spacing:.4px}
.found span{font-size:.88rem;font-weight:700;text-transform:uppercase}
.lv0{background:var(--l0)}.lv1{background:var(--l1)}.lv2{background:var(--l2)}.lv3{background:var(--l3)}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.lives{display:flex;justify-content:center;align-items:center;gap:8px;margin:16px 0;color:var(--muted);font-weight:700;font-size:.9rem}
.lives i{width:13px;height:13px;border-radius:50%;background:var(--sel)}
.lives i.lost{background:var(--line)}
.ctrl{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.ctrl button{border:1.5px solid var(--text);background:transparent;border-radius:999px;padding:9px 16px;font-weight:800}
.ctrl button.main{background:var(--text);color:var(--bg)}
.ctrl button:disabled{opacity:.35;cursor:default}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal.hidden{display:none}
.box{background:var(--card);border-radius:20px;padding:22px;max-width:420px;width:100%;position:relative;max-height:90vh;overflow:auto}
.box h2{font-family:Fredoka,sans-serif;margin:0 0 12px;text-align:center}
.close{position:absolute;top:8px;right:10px;background:transparent;border:0;font-size:1.4rem;color:var(--muted)}
.recap{text-align:center;font-size:1.5rem;line-height:1.15;margin-bottom:14px;letter-spacing:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:6px;margin-bottom:14px}
.stats b{display:block;font-family:Fredoka,sans-serif;font-size:1.6rem}
.stats small{color:var(--muted);font-size:.72rem}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:800;background:var(--accent);color:#fff}
.btn.alt{background:#2f9b6a}
.next{text-align:center;color:var(--muted);font-size:.9rem;margin-top:14px}
.next b{display:block;font-family:Fredoka,sans-serif;font-size:1.5rem;color:var(--text)}
.help p{font-size:.93rem;margin:8px 0}
.lg{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.lg div{border-radius:8px;padding:6px 10px;font-weight:800;font-size:.85rem;color:#1f1a29}
</style>
</head>
<body>
<main>
  <div class="modes">
    <button id="mDaily" class="on">📅 Grille du jour</button>
    <button id="mFree">♾️ Partie libre</button>
  </div>
  <div class="sub" id="sub"></div>
  <p class="intro">Forme 4 groupes de 4 mots qui ont un point commun.</p>
  <div id="board"></div>
  <div class="lives" id="lives"></div>
  <div class="ctrl">
    <button id="bShuffle">🔀 Mélanger</button>
    <button id="bClear">Tout désélectionner</button>
    <button id="bSubmit" class="main">Valider</button>
  </div>
</main>

<div class="modal hidden" id="mdEnd"><div class="box">
  <button class="close" data-close>✕</button>
  <h2 id="endTitle"></h2>
  <div class="recap" id="recap"></div>
  <div class="stats" id="endStats"></div>
  <div class="actions">
    <button class="btn" id="bShare">📋 Partager</button>
    <button class="btn alt" id="bAgain">♾️ Partie libre</button>
  </div>
  <div class="next" id="nextBox">Prochaine grille dans<b id="countdown">--:--:--</b></div>
  <div id="ajZone"></div>
  <div id="srZone"></div>
</div></div>

<script src="../commun/garde.js"></script>
<script src="../commun/base.js"></script>
<script src="grilles.js"></script>
<script src="../commun/classement.js"></script>
<script src="../commun/series.js"></script>
<script>
const $=id=>document.getElementById(id);
const store=Base.stock("connexions_"),toast=Base.toast;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EM=["🟨","🟩","🟦","🟪"],LIVES=4;

/* ---------- Grille du jour ---------- */
const START=Date.UTC(2026,10,1);
const parisDay=()=>Base.jour(START);
const rng=Base.rng;
function shuffle(a,r=Math.random){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const ORDER=shuffle(GRILLES.map((_,i)=>i),rng(1234));
const dailyIdx=d=>ORDER[((d%ORDER.length)+ORDER.length)%ORDER.length];

/* ---------- État ---------- */
let justFound=-1,mode="daily",gi=0,grid=null,order=[],found=[],attempts=[],sel=[],over=false,won=false;
const defStats=()=>({played:0,wins:0,perfect:0,streak:0,best:0,lastWin:null,last:null});
const groupOf=w=>grid.findIndex(g=>g.mots.includes(w));
const mistakes=()=>attempts.filter(a=>!a.ok).length;

function draw(){
  const b=$("board");b.innerHTML="";
  found.forEach(i=>{const g=grid[i],d=document.createElement("div");d.className="found lv"+g.niv+(i===justFound?" new":"");
    d.innerHTML=`<b>${esc(g.nom)}</b><span>${g.mots.map(esc).join(", ")}</span>`;b.appendChild(d);});
  const rest=order.filter(w=>!found.includes(groupOf(w)));
  if(rest.length){
    const gr=document.createElement("div");gr.className="grid";
    rest.forEach(w=>{const t=document.createElement("button");t.className="t"+(sel.includes(w)?" sel":"")+(w.length>10?" long":"");
      t.textContent=w;t.dataset.w=w;t.onclick=()=>toggle(w);t.disabled=over;gr.appendChild(t);});
    b.appendChild(gr);
  }
  const m=mistakes();
  $("lives").innerHTML=over?"":`Erreurs restantes : `+Array.from({length:LIVES},(_,i)=>`<i class="${i<m?"lost":""}"></i>`).join("");
  $("bSubmit").disabled=sel.length!==4||over;$("bClear").disabled=!sel.length||over;$("bShuffle").disabled=over;
}
function toggle(w){
  if(over)return;
  if(sel.includes(w))sel=sel.filter(x=>x!==w);
  else if(sel.length<4)sel.push(w);
  draw();
}
$("bClear").onclick=()=>{sel=[];draw();};
$("bShuffle").onclick=()=>{const done=order.filter(w=>found.includes(groupOf(w)));order=done.concat(shuffle(order.filter(w=>!done.includes(w))));save();draw();};
$("bSubmit").onclick=submit;
function submit(){
  if(sel.length!==4||over)return;
  const key=[...sel].sort().join("|");
  if(attempts.some(a=>[...a.words].sort().join("|")===key)){toast("Déjà essayé !");return;}
  const gs=sel.map(groupOf),counts={};gs.forEach(g=>counts[g]=(counts[g]||0)+1);
  const best=Math.max(...Object.values(counts)),ok=best===4;
  attempts.push({words:[...sel],ok,groups:gs});
  // petite animation de saut
  document.querySelectorAll(".t.sel").forEach((t,i)=>setTimeout(()=>t.classList.add("jump"),i*70));
  setTimeout(()=>{
    if(ok){found.push(gs[0]);justFound=gs[0];sel=[];if(found.length===4){over=true;won=true;}}
    else{
      if(best===3)toast("Il en manque une…");
      else toast("Raté !");
      const g=document.querySelector("#board .grid");if(g){g.classList.remove("shake");void g.offsetWidth;g.classList.add("shake");}
      if(mistakes()>=LIVES){over=true;won=false;}
    }
    if(over){recordStats();if(!won)revealRest();}
    save();draw();
    justFound=-1;
    if(over)setTimeout(showEnd,won?900:1600);
  },420);
}
function revealRest(){
  [0,1,2,3].filter(i=>!found.includes(i)).sort((a,b)=>grid[a].niv-grid[b].niv).forEach(i=>found.push(i));
  sel=[];
}

/* ---------- Sauvegarde & stats ---------- */
function save(){
  const data={gi,order,found,attempts,over,won};
  if(mode==="daily")store.ecrire("daily",{...data,day:parisDay()});else store.ecrire("free",data);
}
function recordStats(){
  const key=mode==="daily"?"statsDaily":"statsFree",s=store.lire(key,defStats());
  if(mode==="daily"){const d=parisDay();if(s.last===d)return;s.streak=won?(s.lastWin===d-1?s.streak+1:1):0;if(won)s.lastWin=d;s.last=d;}
  else s.streak=won?s.streak+1:0;
  s.played++;if(won){s.wins++;if(!mistakes())s.perfect++;}
  s.best=Math.max(s.best,s.streak);store.ecrire(key,s);
  if(mode==="daily")Series.envoyer("connexions",s,parisDay());
}
function load(data){
  gi=data.gi;grid=GRILLES[gi];order=data.order;found=data.found||[];attempts=data.attempts||[];over=!!data.over;won=!!data.won;sel=[];
}
function fresh(i){gi=i;grid=GRILLES[i];order=shuffle(grid.flatMap(g=>g.mots));found=[];attempts=[];over=false;won=false;sel=[];}

/* ---------- Modes ---------- */
function startDaily(){
  mode="daily";const d=parisDay(),sv=store.lire("daily",null),i=dailyIdx(d);
  if(sv&&sv.day===d&&sv.gi===i&&GRILLES[sv.gi])load(sv);else{fresh(i);save();}
  $("sub").textContent=`Grille n°${d+1} · ${Base.dateDuJour()}`;
  setBtns();draw();if(over)setTimeout(showEnd,400);
}
function startFree(newOne){
  mode="free";const sv=store.lire("free",null);
  if(!newOne&&sv&&GRILLES[sv.gi]&&!sv.over)load(sv);
  else{let i;do{i=Math.floor(Math.random()*GRILLES.length);}while(GRILLES.length>1&&(i===gi||i===dailyIdx(parisDay())));fresh(i);save();}
  $("sub").textContent=`Partie libre · grille ${gi+1} sur ${GRILLES.length}`;
  setBtns();draw();
}
function setBtns(){$("mDaily").className=mode==="daily"?"on":"";$("mFree").className=mode==="free"?"on":"";}
$("mDaily").onclick=()=>{closeAll();startDaily();};
$("mFree").onclick=()=>{closeAll();startFree(false);};

/* ---------- Fin ---------- */
function recapText(){return attempts.map(a=>a.groups.map(g=>EM[grid[g].niv]).join("")).join("\n");}
function showEnd(){
  const s=store.lire(mode==="daily"?"statsDaily":"statsFree",defStats());
  const jourAuj=parisDay();if(mode==="daily")s.streak=Series.courante(s,jourAuj);
  if(mode==="daily")Series.panneau($("srZone"),"connexions",store.lire("statsDaily",null),jourAuj);else $("srZone").innerHTML="";
  if(mode==="daily")Series.aujourdhui($("ajZone"),"connexions",jourAuj,{moi:over?{e:mistakes(),g:won}:null,unite:"erreur",gagnantsSeulement:false,reussite:true});else $("ajZone").innerHTML="";
  $("endTitle").textContent=!over?(mode==="daily"?"Statistiques du jour":"Statistiques (partie libre)"):won?(mistakes()?"🎉 Bravo !":"🌟 Parfait, sans erreur !"):"😢 Perdu…";
  $("recap").innerHTML=over?recapText().replace(/\n/g,"<br>"):"";
  const pct=s.played?Math.round(s.wins/s.played*100):0;
  $("endStats").innerHTML=[[s.played,"Parties"],[pct,"% victoires"],[s.perfect,"Sans faute"],[s.streak,"Série"]].map(([v,l])=>`<div><b>${v}</b><small>${l}</small></div>`).join("");
  $("bShare").style.display=over?"":"none";
  $("bAgain").textContent=mode==="free"?"🔁 Nouvelle grille":"♾️ Partie libre";
  $("nextBox").style.display=mode==="daily"?"":"none";
  $("mdEnd").classList.remove("hidden");
}
$("bAgain").onclick=()=>{closeAll();startFree(true);};
$("bShare").onclick=async()=>{
  const head=mode==="daily"?`Connexions n°${parisDay()+1}`:"Connexions (partie libre)";
  const txt=`${head}\n${recapText()}\n\n${location.href.split("#")[0]}`;
  Base.partager(txt);
};
function tick(){
  $("countdown").textContent=Base.avantMinuit();
  if(mode==="daily"&&gi!==dailyIdx(parisDay())){closeAll();startDaily();toast("Nouvelle grille du jour !");}
}
setInterval(tick,1000);
function closeAll(){document.querySelectorAll(".modal").forEach(m=>m.classList.add("hidden"));}
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m||e.target.hasAttribute("data-close"))closeAll();}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll();else if(e.key==="Enter")submit();});
const bStats=Base.el("button","📊","b-ico");bStats.title="Statistiques";bStats.onclick=showEnd;
Base.entete({titre:"Connexions",emoji:"🔗",boutons:[bStats],aide:`<div class="help"><p>La grille contient <b>16 mots</b> cachant <b>4 groupes</b> de 4 mots qui ont quelque chose en commun.</p>
  <p>Sélectionne 4 mots puis appuie sur <b>Valider</b>. Tu as droit à <b>4 erreurs</b>.</p>
  <p>Attention aux pièges : certains mots semblent aller dans plusieurs groupes ! Les catégories peuvent être plus subtiles que « fruits » ou « pays » : mots cachés, expressions…</p>
  <p>Chaque groupe a une couleur selon sa difficulté :</p>
  <div class="lg"><div class="lv0">🟨 Facile</div><div class="lv1">🟩 Moyen</div><div class="lv2">🟦 Difficile</div><div class="lv3">🟪 Très difficile</div></div>
  <p>📅 La <b>grille du jour</b> change automatiquement à minuit. ♾️ La <b>partie libre</b> te donne une grille au hasard.</p></div>`});

startDaily();tick();
</script>
</body>
</html>
