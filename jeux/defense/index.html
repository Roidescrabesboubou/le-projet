<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Défense du Château</title>
<link rel="stylesheet" href="../commun/base.css">
<style>
:root{--accent:#3aa76d;--fond1:rgba(58,167,109,.14);--fond2:rgba(242,169,59,.1)}
.td{max-width:1120px;gap:10px;padding-top:10px}
.td-haut{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:100%}
.td-haut span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem;white-space:nowrap}
.td-jeu{display:flex;gap:12px;width:100%;align-items:flex-start;justify-content:center}
.td-plateau{position:relative;flex:0 0 auto;width:min(100%,calc(100vh - 230px));min-width:280px;max-width:680px}
#plateau{display:block;width:100%;aspect-ratio:1;border-radius:14px;touch-action:none;background:#5a3d25}
.td-zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.td-zoom button{width:34px;height:34px;border-radius:10px;border:0;background:rgba(0,0,0,.55);color:#fff;font-weight:800}
#panneau{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--rayon);padding:12px;max-height:calc(100vh - 230px);overflow:auto}
#panneau h3{margin:0 0 8px}
.td-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px;margin-top:8px}
.td-item{position:relative;border:2px solid var(--line);background:var(--soft);border-radius:12px;padding:6px 3px;text-align:center;font-size:.7rem;font-weight:800;line-height:1.15;min-height:82px}
.td-item b{display:block;font-size:1.5rem;line-height:1.3;font-weight:400}
.td-item i{position:absolute;right:4px;top:2px;font-style:normal;font-size:.7rem}
.td-item u{position:absolute;left:4px;top:2px;text-decoration:none;font-size:.7rem;color:var(--accent)}
.td-item.on{outline:3px solid var(--accent);outline-offset:1px}
.td-item:disabled{opacity:.4}
.td-info{background:var(--soft);border-radius:12px;padding:8px 10px;font-size:.85rem;margin-top:8px}
.td-info .btn{margin:6px 6px 0 0}
.td-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:680px}
.td-menu button{border:0;border-radius:14px;padding:10px 4px;font-weight:800;color:#fff;font-size:.85rem;line-height:1.2}
.td-menu button b{display:block;font-size:1.5rem;font-weight:400}
.td-menu button:disabled{opacity:.45}
.td-vue{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.td-vue header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.td-vue header h2{margin:0;flex:1;font-size:1.2rem}
.td-corps{flex:1;overflow:auto;padding:12px}
.td-arbre{position:relative;margin:0 auto}
.td-corps.td-glisse{cursor:grab;user-select:none}
.td-hex{position:absolute;width:64px;height:72px;border:0;padding:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--c,#3b3b4a);color:#fff;font-size:.54rem;font-weight:800;line-height:1.05;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.td-hex b{display:block;font-size:1.1rem;font-weight:400}
.td-hex i{display:block;font-style:normal;color:#ffe08a}
.td-hex.dispo{filter:brightness(.62)}
.td-hex.loin{filter:brightness(.3)}
.td-hex.loin b{color:#ffe08a;font-weight:800}
.td-hex.on{filter:brightness(1.3)}
.td-hex.dispo.on{filter:brightness(.95)}
.td-hex.loin.on{filter:brightness(.55)}
.td-hex.depart{background:#35b4d6}
.td-bas{border-top:1px solid var(--line);padding:10px 14px 10px 66px;background:var(--card);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.td-stats{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78rem;color:var(--muted);padding:0 14px 8px}
.td-stats strong{color:var(--text)}
.td-camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:980px;margin:0 auto}
.td-camp{border:3px solid var(--line);border-radius:14px;padding:10px;background:var(--card);text-align:center;font-size:.8rem}
.td-camp>b{display:block;font-size:2rem;font-weight:400}
.td-camp strong{display:block;font-size:.95rem}
.td-camp .btn{width:100%;margin-top:6px}
.td-butin{font-size:.82rem;margin:3px 0}
.td-compte{margin:0 0 10px;color:var(--muted);font-size:.85rem;text-align:center}
.td-note{margin:12px 0 2px;font-size:1rem}
dialog.b-fen .td-note + ul{margin:0;font-size:.9rem}
.td-classement{list-style:none;margin:6px 0 0;padding:0}
.td-classement li{display:flex;justify-content:space-between;gap:10px;padding:5px 10px;border-radius:9px}
.td-classement li:nth-child(odd){background:var(--soft)}
.td-classement li.moi{outline:2px solid var(--accent)}
.namerow{display:flex;gap:6px}
.namerow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px}
@media (max-width:820px){
  .td-menu{order:1}
  .td-jeu{order:2;flex-direction:column;align-items:center}
  .td-plateau{width:100%;max-width:560px}
  #panneau{width:100%;max-height:none}
}
</style>
</head>
<body>
<main class="b-page td">
  <div class="td-haut" id="haut"></div>
  <div class="td-jeu">
    <div class="td-plateau">
      <canvas id="plateau"></canvas>
      <div class="td-zoom">
        <button id="zoomPlus" aria-label="Zoomer">+</button>
        <button id="zoomMoins" aria-label="Dézoomer">−</button>
      </div>
    </div>
    <div id="panneau"></div>
  </div>
  <nav class="td-menu" id="menu"></nav>
</main>

<div class="td-vue cache" id="vueArbre">
  <header><h2>⬆️ Améliorations</h2><span id="arbreOr"></span><button class="btn ghost petit" data-fermer>Fermer</button></header>
  <div class="td-corps td-glisse" id="corpsArbre"><div class="td-arbre" id="arbre"></div></div>
  <div class="td-stats" id="arbreStats"></div>
  <div class="td-bas" id="arbreBas"></div>
</div>
<div class="td-vue cache" id="vueBoutique">
  <header><h2>🛒 Camps</h2><span id="boutiqueInfo"></span><button class="btn ghost petit" data-fermer>Fermer</button></header>
  <div class="td-corps"><div class="td-camps" id="boutique"></div></div>
</div>

<div class="td-vue cache" id="vueIndex">
  <header><h2>📖 Index</h2><button class="btn ghost petit" data-fermer>Fermer</button></header>
  <div class="td-corps" id="index"></div>
</div>

<script src="../commun/garde.js"></script>
<script src="../commun/base.js"></script>
<script src="../commun/classement.js"></script>
<script src="donnees.js"></script>
<script>
const $ = id => document.getElementById(id);
const el = Base.el;
const {RARETES, TOURS, FORMES, MATIERES, CAMPS, CARTE, FAMILLES, SPECIAUX} = TD;
const stock = Base.stock("defense_");
const TOUR = Object.fromEntries(TOURS.map(t => [t.id, t]));
const CAMP = Object.fromEntries(CAMPS.map(c => [c.id, c]));
const MATIERE = Object.fromEntries(MATIERES.map(m => [m.id, m]));
const DIR = [[0, 1], [1, 0], [0, -1], [-1, 0]];           // haut, droite, bas, gauche (colonne, ligne)
const STOCK_MS = 120000;                                   // la boutique change toutes les 2 minutes
const PAS = 1 / 30;

const bClassement = el("button", "🏆", "b-ico");
bClassement.title = "Classement";
bClassement.onclick = () => {
  const zone = el("div");
  Base.fenetre("🏆 Meilleures vagues", zone, {bouton: "Fermer"});
  Classement.tableau(zone, optionsClassement());
};

const bIndex = el("button", "📖", "b-ico");
bIndex.title = "Index";
bIndex.onclick = () => { if(!B) ouvrirIndex(); };

const bPatch = el("button", "📜", "b-ico");
bPatch.title = "Patch note";
bPatch.onclick = () => {
  const c = el("div");
  TD.PATCH_NOTES.forEach(n => {
    c.appendChild(el("h3", `${n.version} : ${n.titre}`, "td-note"));
    const ul = el("ul");
    n.lignes.forEach(l => ul.appendChild(el("li", l)));
    c.appendChild(ul);
  });
  Base.fenetre("📜 Patch note", c, {bouton: "Fermer"});
};

Base.entete({
  titre: "Défense du Château",
  emoji: "🏰",
  boutons: [bIndex, bPatch, bClassement],
  aide: `<p>Protège le château des vagues d'ennemis et agrandis ton royaume.</p>
    <ul>
      <li><b>Construire</b> : relie chaque camp au château avec des chemins, puis place tes tours à côté et oriente-les : la plupart ne tirent que dans un cône. Glisse un élément posé pour le déplacer.</li>
      <li><b>Pièges</b> : ils se posent directement sur un chemin et frappent ce qui passe dessus.</li>
      <li><b>Combattre</b> : les ennemis rapportent de l'or selon le camp et la vague.</li>
      <li>Chaque <b>boss</b> tué fait un tirage : nouvelle tour ou nouveau chemin. Plus le camp est rare, meilleures sont les chances. Le 👑 au-dessus d'un camp indique dans combien de vagues arrive son boss.</li>
      <li><b>Relance auto</b> : le combat repart tout seul quand le château tombe, pour farmer.</li>
      <li><b>Améliorer</b> : dépense ton or dans l'arbre pour un terrain plus grand, plus de défenses et de camps, plus de chance…</li>
      <li><b>Camps</b> : la boutique change toutes les 2 minutes. Les camps rares y sont peu fréquents.</li>
      <li>Si le château tombe, tu gardes tout ce que tu as gagné.</li>
    </ul>`
});

/* ---------- Outils ---------- */
const hasard = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const choix = l => l[Math.floor(Math.random() * l.length)];
const cle = (c, l) => c + "," + l;
const deCle = k => k.split(",").map(Number);
function nb(v){
  if(!isFinite(v)) return "∞";
  const a = Math.abs(v);
  for(const [s, u] of [[1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]])
    if(a >= s) return (v / s).toFixed(a >= s * 100 ? 0 : a >= s * 10 ? 1 : 2) + u;
  return String(Math.floor(v));
}
const pc = v => Math.round(v * 1000) / 10 + " %";

/* ---------- Sauvegarde ---------- */
function partieNeuve(){
  const plan = {[cle(0, 6)]: {t: "camp", k: "foret"}};
  for(let l = 1; l <= 5; l++) plan[cle(0, l)] = {t: "chemin", k: "terre_droit", r: 0};
  return {v: 4, t: 0, or: 0, achats: {}, plan, premierT: false,
    inv: {tours: {"arbalete:0": 3}, chemins: {terre_droit: 5}, camps: {foret: 1}},
    bilan: {vagueMax: 0, ennemis: 0, boss: 0, batailles: 0, orTotal: 0},
    boutique: null};
}
let G = partieNeuve();
let nuage = "";       // état de la sauvegarde en ligne, affiché en haut
let minuteurNuage = 0;

const session = () => (window.Compte && Compte.session && Compte.session()) || null;
const cleLocale = () => { const s = session(); return "save_" + (s ? s.uid : "invite"); };

function sauver(){
  G.t = Date.now();
  stock.ecrire(cleLocale(), G);
  /* en combat on sauvegarde souvent : un seul envoi en ligne toutes les 30 secondes suffit */
  if(session() && !minuteurNuage){
    minuteurNuage = setTimeout(() => { minuteurNuage = 0; envoyerNuage(); }, B ? 30000 : 3000);
  }
}
function migrer(){
  /* v2 : les chemins de terre ne sont plus illimités, on garde ceux déjà posés */
  if((G.v || 1) < 2){
    G.inv.chemins.terre_droit = Math.max(G.inv.chemins.terre_droit || 0, places("chemin", "terre_droit"), 5);
    G.inv.chemins.terre_virage = Math.max(G.inv.chemins.terre_virage || 0, places("chemin", "terre_virage"));
  }
  /* v3 : les tours ont une orientation, celles déjà posées regardent le chemin le plus proche */
  if((G.v || 1) < 3){
    const chemins = Object.keys(G.plan).filter(k => G.plan[k].t === "chemin").map(deCle);
    Object.keys(G.plan).forEach(k => {
      if(G.plan[k].t !== "tour" || !chemins.length) return;
      const [c, l] = deCle(k);
      const [pc, pl] = chemins.reduce((a, b) => Math.hypot(b[0] - c, b[1] - l) < Math.hypot(a[0] - c, a[1] - l) ? b : a);
      const dx = pc - c, dy = pl - l;
      G.plan[k].r = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 0 : 2);
    });
  }
  /* v4 : nouvel arbre, tout l'or dépensé est remboursé et le terrain revient aux limites de départ */
  if((G.v || 1) < 4){
    const rembourse = ancienArbreDepense();
    G.or += rembourse;
    G.achats = {};
    recalculer();
    remettreDansLesLimites();
    if(rembourse) rembourseMsg = `🌳 Nouvel arbre ! ${nb(rembourse)} d'or remboursés.`;
  }
  G.v = 4;
}
let rembourseMsg = "";
/* Prix de l'ancien arbre : ses nœuds s'appelaient s<secteur>_<anneau>_<rang> */
function ancienArbreDepense(){
  const anneaux = [60, 400, 3000, 30000];
  return Object.keys(G.achats || {}).reduce((total, id) => {
    const m = /^s(\d)_(\d)_(\d)$/.exec(id);
    return m ? total + Math.round(anneaux[m[2] - 1] * (1 + m[3] * .6) * (1 + m[1] * .05)) : total;
  }, 0);
}
/* Ce qui ne rentre plus retourne dans l'inventaire : on enlève d'abord ce qui est le plus loin du château */
function remettreDansLesLimites(){
  const loin = k => { const [c, l] = deCle(k); return Math.abs(c) + l; };
  Object.keys(G.plan).forEach(k => { const [c, l] = deCle(k); if(!dansTerrain(c, l)) delete G.plan[k]; });
  [["tour", ST.defenses], ["camp", ST.camps]].forEach(([t, max]) => {
    const liste = Object.keys(G.plan).filter(k => G.plan[k].t === t).sort((a, b) => loin(a) - loin(b));
    liste.slice(max).forEach(k => delete G.plan[k]);
  });
}
async function envoyerNuage(){
  const s = session(); if(!s) return;
  try{
    await Compte.db(`defense_sauvegardes/${s.uid}`, {method: "PUT", body: {json: JSON.stringify(G), t: G.t}});
    nuage = "☁️ Sauvegardé";
  }catch(e){ nuage = "💾 Sauvegarde locale"; }
  dessinerHaut();
}
/* Prend la sauvegarde la plus récente entre cet appareil et le compte */
async function chargerSauvegarde(){
  const s = session();
  let locale = stock.lire(cleLocale(), null);
  if(!locale && s) locale = stock.lire("save_invite", null);
  G = locale || partieNeuve();
  nuage = "";
  if(s){
    try{
      const j = await Compte.db(`defense_sauvegardes/${s.uid}`);
      if(j && j.t > (G.t || 0)) G = JSON.parse(j.json);
      else if(G.t) envoyerNuage();
      nuage = "☁️ Sauvegardé";
    }catch(e){ nuage = "💾 Sauvegarde locale"; }
  }
  recalculer();
  migrer();
  recalculer();
  toutDessiner();
  if(rembourseMsg){ Base.toast(rembourseMsg, 5000); rembourseMsg = ""; sauver(); }
}

/* ---------- Statistiques (arbre) ---------- */
let ST = {};
const NOEUDS = [];
const AX = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]];
const voisin = (a, b) => AX.some(([q, r]) => a.q + q === b.q && a.r + r === b.r);
const romain = n => [[10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]].reduce((s, [v, t]) => { while(n >= v){ s += t; n -= v; } return s; }, "");
const arrondi = v => { const p = Math.pow(10, Math.max(0, Math.floor(Math.log10(v)) - 1)); return Math.round(v / p) * p; };
/* Lit la carte de l'arbre, puis numérote et tarife chaque famille en partant du Départ */
(function(){
  CARTE.forEach(([r, de, cases]) => [...cases].forEach((lettre, i) => {
    if(lettre === "." || lettre === "*") return;
    const col = de + i * 2;
    NOEUDS.push({id: `n${r}_${col}`, lettre, q: (col - r) / 2, r});
  }));
  const dist = new Map(), file = [];
  NOEUDS.filter(n => voisin(n, {q: 0, r: 0})).forEach(n => { dist.set(n, 1); file.push(n); });
  while(file.length){
    const n = file.shift();
    NOEUDS.forEach(m => { if(!dist.has(m) && voisin(n, m)){ dist.set(m, dist.get(n) + 1); file.push(m); } });
  }
  const rangs = {};
  [...NOEUDS].sort((a, b) => dist.get(a) - dist.get(b) || a.r - b.r || a.q - b.q).forEach(n => {
    const s = SPECIAUX[n.lettre];
    if(s){ Object.assign(n, s, {couleur: "#6a5a3a", special: true}); return; }
    const f = FAMILLES[n.lettre], i = rangs[n.lettre] = (rangs[n.lettre] || 0) + 1;
    Object.assign(n, {nom: f.nom + " " + romain(i), emoji: f.emoji, stat: f.stat, couleur: f.couleur,
      val: Array.isArray(f.val) ? f.val[i - 1] : f.val, cout: arrondi(f.base * Math.pow(f.raison, i - 1))});
  });
})();
function recalculer(){
  ST = {degats: 0, cadence: 0, critC: .05, critD: 1.5, pv: 100, terrain: 7, defenses: 5, camps: 1, pieges: 1, or: 0, chance: 0, interet: 0, bossOr: 0,
    doubleButin: 0, secondeVie: 0, brulure: 0, bossDeg: 0, portee: 0, prefusion: 0, vagueDepart: 1};
  NOEUDS.forEach(n => {
    if(!G.achats[n.id]) return;
    if(n.stat === "vagueDepart") ST.vagueDepart = Math.max(ST.vagueDepart, n.val);
    else ST[n.stat] += n.val;
  });
}
function noeudDispo(n){
  if(G.achats[n.id]) return false;
  if(voisin(n, {q: 0, r: 0})) return true;
  return NOEUDS.some(m => G.achats[m.id] && voisin(n, m));
}

/* ---------- Inventaire ---------- */
const cleChemin = (m, f) => m + "_" + f;
function places(t, k){
  let n = 0;
  for(const c in G.plan){
    const p = G.plan[c];
    if(p.t === t && (k == null || p.k === k)) n++;
    if(t === "tour" && k != null && p.piege === k) n++;     // un piège est posé sur un chemin
  }
  return n;
}
const placesPieges = () => Object.values(G.plan).filter(p => p.piege).length;
const estPiege = a => a && a.t === "tour" && defTour(a.k).piege;
const possede = (t, k) => t === "chemin" ? G.inv.chemins[k] || 0 : t === "tour" ? G.inv.tours[k] || 0 : G.inv.camps[k] || 0;
const restant = (t, k) => possede(t, k) - places(t, k);
const defTour = k => TOUR[k.split(":")[0]];
const niveauTour = k => +k.split(":")[1];
const rareteDe = (t, k) => t === "tour" ? defTour(k).r : t === "camp" ? CAMP[k].r : MATIERE[k.split("_")[0]].r;
const nomDe = (t, k) => {
  if(t === "tour"){ const n = niveauTour(k); return defTour(k).nom + (n ? " +" + n : ""); }
  if(t === "camp") return CAMP[k].nom;
  const [m, f] = k.split("_");
  return MATIERE[m].nom + " · " + FORMES[f].nom;
};
function ajouter(t, k, n){
  const b = t === "tour" ? G.inv.tours : t === "camp" ? G.inv.camps : G.inv.chemins;
  b[k] = (b[k] || 0) + (n || 1);
}
function fusionnerTout(){
  let fait = 0, encore = true;
  while(encore){
    encore = false;
    for(const k of Object.keys(G.inv.tours)){
      while(restant("tour", k) >= 3){
        G.inv.tours[k] -= 3;
        ajouter("tour", defTour(k).id + ":" + (niveauTour(k) + 1));
        fait++; encore = true;
      }
    }
  }
  Base.toast(fait ? `✨ ${fait} fusion${fait > 1 ? "s" : ""}` : "Il faut 3 tours identiques non placées");
  if(fait){ sauver(); dessinerPanneau(); }
}

/* ---------- Plateau : chemins et connexions ---------- */
const tailleN = () => ST.terrain;
const dansTerrain = (c, l) => { const m = Math.floor(tailleN() / 2); return Math.abs(c) <= m && l >= 0 && l < tailleN(); };
function ports(p){
  const f = FORMES[p.k.split("_")[1]];
  return f.ports.map(d => (d + (p.r || 0)) % 4);
}
/* Distance au château de chaque case de chemin (null si coupée du château) */
function calculerReseau(){
  const dist = {}, file = [];
  [1, 3, 0].forEach(d => {
    const [dc, dl] = DIR[d], k = cle(dc, dl), p = G.plan[k];
    if(p && p.t === "chemin" && ports(p).includes((d + 2) % 4)){ dist[k] = 1; file.push(k); }
  });
  while(file.length){
    const k = file.shift(), p = G.plan[k], [c, l] = deCle(k);
    ports(p).forEach(d => {
      const nk = cle(c + DIR[d][0], l + DIR[d][1]), v = G.plan[nk];
      if(v && v.t === "chemin" && dist[nk] == null && ports(v).includes((d + 2) % 4)){ dist[nk] = dist[k] + 1; file.push(nk); }
    });
  }
  const coupes = [];
  for(const k in G.plan){
    if(G.plan[k].t !== "camp") continue;
    if(!entrees(k, dist).length) coupes.push(k);
  }
  return {dist, coupes};
}
/* Cases de chemin reliées au château par lesquelles un camp peut sortir */
function entrees(k, dist){
  const [c, l] = deCle(k), res = [];
  DIR.forEach((v, d) => {
    const nk = cle(c + v[0], l + v[1]), p = G.plan[nk];
    if(p && p.t === "chemin" && dist[nk] != null && ports(p).includes((d + 2) % 4)) res.push(nk);
  });
  return res;
}
function etatPlateau(){
  const r = calculerReseau();
  const nbCamps = places("camp");
  if(!nbCamps) return {...r, ok: false, msg: "Place au moins un camp"};
  if(r.coupes.length) return {...r, ok: false, msg: "Un camp n'est pas relié au château"};
  return {...r, ok: true, msg: "Tout est relié ✓"};
}
/* Trajet d'un ennemi : du camp au château, en descendant les distances */
function creerTrajet(k, dist){
  const cases = entrees(k, dist);
  const min = Math.min(...cases.map(x => dist[x]));
  let cur = choix(cases.filter(x => dist[x] === min));
  const route = [{...pointDe(k), lent: 0}];
  while(cur){
    const p = G.plan[cur], [c, l] = deCle(cur);
    route.push({...pointDe(cur), lent: MATIERE[p.k.split("_")[0]].lent});
    if(dist[cur] === 1) break;
    const suite = [];
    ports(p).forEach(d => {
      const nk = cle(c + DIR[d][0], l + DIR[d][1]), v = G.plan[nk];
      if(v && v.t === "chemin" && dist[nk] === dist[cur] - 1 && ports(v).includes((d + 2) % 4)) suite.push(nk);
    });
    cur = choix(suite);
  }
  route.push({...pointDe(cle(0, 0)), lent: 0});
  return route;
}
function pointDe(k){
  const [c, l] = deCle(k), n = tailleN();
  return {x: c + Math.floor(n / 2) + .5, y: n - 1 - l + .5};
}

/* ---------- Tirage au boss ---------- */
/* Probabilité réelle de chaque rareté : on tente du plus rare au plus commun */
function chancesRaretes(camp){
  const res = [];
  let reste = 1;
  for(let i = RARETES.length - 1; i >= 1; i--){
    const q = poolTours(i, camp).length + poolChemins(i).length ? Math.min(.95, RARETES[i].chance * camp.mult[i - 1] * (1 + ST.chance)) : 0;
    res[i] = reste * q;
    reste *= 1 - q;
  }
  res[0] = reste;
  return res;
}
/* Probabilité d'obtenir exactement cet article sur un boss de ce camp */
function chanceArticle(t, k, camp){
  const r = rareteDe(t, k), tours = poolTours(r, camp), chemins = poolChemins(r), base = chancesRaretes(camp)[r];
  if(t === "tour"){
    if(!tours.includes(defTour(k))) return 0;
    return base * (chemins.length ? .6 : 1) / tours.length;
  }
  const total = chemins.reduce((s, c) => s + c.poids, 0), c = chemins.find(x => x.k === k);
  return base * (tours.length ? .4 : 1) * c.poids / total;
}
const formatChance = p => "1/" + Math.round(1 / p).toLocaleString("fr-FR");
function tirage(camp){
  const probas = chancesRaretes(camp);
  let x = Math.random(), r = 0;
  for(let i = RARETES.length - 1; i >= 1; i--){
    if(x < probas[i]){ r = i; break; }
    x -= probas[i];
  }
  const tours = poolTours(r, camp), chemins = poolChemins(r);
  const prendreTour = chemins.length ? (tours.length && Math.random() < .6) : true;
  if(prendreTour){
    const d = choix(tours), k = d.id + ":" + (Math.random() < ST.prefusion ? 1 : 0);
    ajouter("tour", k);
    return {t: "tour", k, r, chance: chanceArticle("tour", k, camp)};
  }
  const total = chemins.reduce((s, c) => s + c.poids, 0);
  let y = Math.random() * total, pris = chemins[0];
  for(const c of chemins){ y -= c.poids; if(y <= 0){ pris = c; break; } }
  const n = QTE_CHEMINS[r] || 1;
  ajouter("chemin", pris.k, n);
  return {t: "chemin", k: pris.k, r, n, chance: chanceArticle("chemin", pris.k, camp)};
}
const QTE_CHEMINS = [3, 2];      // un tirage donne plusieurs cases des chemins communs et peu communs
const poolTours = (r, camp) => TOURS.filter(t => t.r === r && (!t.camp || t.camp === camp.id));
function poolChemins(r){
  const res = [];
  MATIERES.filter(m => m.r === r).forEach(m => {
    for(const f in FORMES){
      res.push({k: cleChemin(m.id, f), poids: m.poids * FORMES[f].poids});
    }
  });
  return res;
}

/* ---------- Combat ---------- */
let B = null;
let relance = false;      // relance auto : le prochain combat démarre à l'image suivante
let farm = null;          // totaux depuis le dernier lancement manuel
function difficulte(camp){ return Math.pow(1.35, CAMPS.indexOf(camp)); }
const relanceAuto = () => stock.lire("auto", false);
const vagueDepart = () => Math.min(stock.lire("depart", 1), ST.vagueDepart);
const porteeDe = d => d.portee * (1 + ST.portee);
const angleDe = r => (r - 1) * Math.PI / 2;      // 0 haut, 1 droite, 2 bas, 3 gauche
function dansArc(s, e){
  if(s.d.arc >= 360) return true;
  let da = Math.abs(Math.atan2(e.y - s.y, e.x - s.x) - s.a);
  if(da > Math.PI) da = 2 * Math.PI - da;
  return da <= s.d.arc / 360 * Math.PI;
}
function lancerCombat(enAuto){
  if(!enAuto) farm = {combats: 0, gains: 0, tues: 0, boss: 0, recus: {}, derniers: []};
  const e = etatPlateau();
  if(!e.ok){ Base.toast(e.msg); return; }
  const tours = [];
  for(const k in G.plan){
    const p = G.plan[k];
    if(p.t !== "tour") continue;
    const d = defTour(p.k), pt = pointDe(k);
    tours.push({d, x: pt.x, y: pt.y, a: angleDe(p.r || 0), mDeg: Math.pow(1.5, niveauTour(p.k)) * (1 + ST.degats), mCad: 1 + ST.cadence, portee: porteeDe(d),
      cd: d.charge || 0, cible: null, rampe: 0, gel: 0, retour: d.retour || 0, bDeg: 0, bPortee: 0});
  }
  const auras = tours.filter(s => s.d.mode === "aura");
  auras.forEach(s => tours.forEach(t => {
    if(t === s || Math.hypot(t.x - s.x, t.y - s.y) > s.portee) return;
    t.bDeg += s.d.buffDeg || 0; t.bPortee += s.d.buffPortee || 0; t.mCad += s.d.buffCad || 0;
  }));
  tours.forEach(t => { t.mDeg *= 1 + t.bDeg; t.portee *= 1 + t.bPortee; });
  const pieges = [];
  for(const k in G.plan){
    const p = G.plan[k];
    if(!p.piege) continue;
    const pt = pointDe(k);
    pieges.push({d: defTour(p.piege), x: pt.x, y: pt.y, mDeg: Math.pow(1.5, niveauTour(p.piege)) * (1 + ST.degats), cd: 0});
  }
  const camps = [];
  for(const k in G.plan) if(G.plan[k].t === "camp") camps.push({k, camp: CAMP[G.plan[k].k]});
  B = {vague: vagueDepart() - 1, pv: ST.pv, pvMax: ST.pv, dist: e.dist, tours, pieges, mines: [], retombees: 0, camps, ennemis: [], file: [], attente: 1, fx: [],
    vie2: ST.secondeVie > 0, gains: 0, tues: 0, boss: 0, butins: farm.derniers, vitesse: stock.lire("vitesse", 1), acc: 0, depuis: 0, horloge: 0};
  G.bilan.batailles++;
  farm.combats++;
  cellSel = null; sel = null;
  toutDessiner();
}
function vagueSuivante(){
  B.vague++;
  B.camps.forEach(({k, camp}) => {
    const n = Math.min(20, 4 + Math.floor(B.vague / 2));
    for(let i = 0; i < n; i++) B.file.push({t: i * .75, k, camp, boss: false});
    if(B.vague % RARETES[camp.r].boss === 0) B.file.push({t: n * .75 + .5, k, camp, boss: true});
  });
  B.file.sort((a, b) => a.t - b.t);
  B.horloge = 0;
  if(B.vague > G.bilan.vagueMax) G.bilan.vagueMax = B.vague;
  dessinerPanneau();
}
function creerEnnemi(f){
  const dif = difficulte(f.camp), w = B.vague;
  const hp = 15 * dif * Math.pow(1.14, w - 1) * (f.boss ? 5 : 1);
  B.ennemis.push({
    k: f.k, route: creerTrajet(f.k, B.dist), p: 0, x: 0, y: 0,
    hp, hpMax: hp, boss: f.boss, camp: f.camp,
    v: (f.boss ? .55 : 1) * (1 + f.camp.r * .04),
    or: 2 * Math.pow(1.3, CAMPS.indexOf(f.camp)) * (1 + .1 * (w - 1)) * Math.pow(1.06, w - 1) * (f.boss ? 15 : 1),
    coup: (f.boss ? 25 : 2) * (1 + w / 10),
    lent: 0, lentT: 0, stun: 0, brule: 0, bruleT: 0, poison: 0, poisonT: 0, vuln: 0, vulnT: 0, infecte: false
  });
}
function blesser(e, dmg, s){
  if(e.mort) return;
  if(e.vuln) dmg *= 1 + e.vuln;
  if(e.boss) dmg *= 1 + ST.bossDeg;
  const crit = Math.random() < ST.critC + ((s && s.d.crit) || 0);
  e.hp -= crit ? dmg * ST.critD : dmg;
  if(s && s.d.execute && !e.boss && e.hp < e.hpMax * s.d.execute) e.hp = 0;
  if(e.hp <= 0) tuer(e);
}
function tuer(e){
  e.mort = true;
  let or = e.or * (1 + ST.or);
  if(e.boss) or *= 1 + ST.bossOr;
  if(e.infecte) or *= 2;
  or *= 1 + B.tours.reduce((m, t) => t.d.or && t.d.or > m && Math.hypot(t.x - e.x, t.y - e.y) <= t.portee ? t.d.or : m, 0);
  gagner(or);
  B.tues++; G.bilan.ennemis++;
  if(e.boss){
    B.boss++; G.bilan.boss++;
    const n = Math.random() < ST.doubleButin ? 2 : 1;
    for(let i = 0; i < n; i++) recevoirButin(tirage(e.camp));
    if(!G.premierT){
      G.premierT = true; ajouter("chemin", "terre_t");
      noterButin({t: "chemin", k: "terre_t", r: 0, offert: true});
      Base.toast("🎁 Ton premier T : tu peux relier plusieurs camps !", 3500);
    }
  }
}
function gagner(or){ G.or += or; G.bilan.orTotal += or; B.gains += or; }
function noterButin(b){
  B.butins.unshift(b); B.butins.length = Math.min(B.butins.length, 12);
  const r = farm.recus[b.k] || (farm.recus[b.k] = {t: b.t, k: b.k, r: b.r, n: 0});
  r.n += b.n || 1;
}
function recevoirButin(b){
  noterButin(b);
  if(b.r >= 2) Base.toast(`${RARETES[b.r].nom} ! ${nomDe(b.t, b.k)} (${formatChance(b.chance)})`, 3500);
  dessinerPanneau();
}
function ajouterFx(f){ if(B.fx.length < 120) B.fx.push({...f, vie: .15}); }
function appliquerEffets(e, s){
  const d = s.d;
  if(d.ralentit && d.ralentit.p >= e.lent){ e.lent = d.ralentit.p; e.lentT = d.ralentit.d; }
  if(d.etourdit) e.stun = Math.max(e.stun, e.boss ? d.etourdit / 2 : d.etourdit);
  if(d.brule){ e.brule = Math.max(e.brule, d.brule.dps * s.mDeg * (1 + ST.brulure)); e.bruleT = d.brule.d; }
  if(d.poison){ e.poison = Math.min(d.poison.max * s.mDeg, e.poison + d.poison.dps * s.mDeg); e.poisonT = d.poison.d; }
  if(d.infection) e.infecte = true;
  if(d.vuln && d.vuln.p >= e.vuln){ e.vuln = d.vuln.p; e.vulnT = d.vuln.d; }
  if(d.recul) e.p = Math.max(0, e.p - (e.boss ? d.recul / 3 : d.recul));
}
function viser(s){
  const d = s.d, r2 = s.portee * s.portee;
  let best = null, score = -Infinity;
  for(const e of B.ennemis){
    if(e.mort) continue;
    const dx = e.x - s.x, dy = e.y - s.y;
    if(dx * dx + dy * dy > r2 || !dansArc(s, e)) continue;
    const v = d.vise === "fort" ? e.hp : e.p;
    if(v > score){ score = v; best = e; }
  }
  return best;
}
function tirer(s){
  const d = s.d, dmg = d.dmg * s.mDeg * (d.de ? hasard(1, 6) / 3.5 : 1);
  if(d.mode === "silo"){
    if(!B.ennemis.length) return false;
    for(const e of B.ennemis){
      if(e.mort) continue;
      if(e.boss) blesser(e, e.hpMax * .5, s); else tuer(e);
    }
    B.retombees = 60;
    ajouterFx({type: "rond", x: s.x, y: s.y, r: tailleN(), c: "#ffd34d"});
    Base.toast("☢️ Frappe nucléaire !");
    return true;
  }
  if(d.mode === "champ"){
    let touche = false;
    for(const e of B.ennemis){
      if(e.mort || Math.hypot(e.x - s.x, e.y - s.y) > s.portee) continue;
      blesser(e, dmg, s); appliquerEffets(e, s); touche = true;
    }
    if(touche) ajouterFx({type: "rond", x: s.x, y: s.y, r: Math.min(s.portee, tailleN()), c: RARETES[d.r].couleur});
    return touche;
  }
  const c = viser(s);
  if(!c){ s.rampe = 0; s.cible = null; return false; }
  ajouterFx({type: "trait", x: s.x, y: s.y, x2: c.x, y2: c.y, c: RARETES[d.r].couleur});
  if(d.mode === "zone"){
    for(const e of B.ennemis) if(!e.mort && Math.hypot(e.x - c.x, e.y - c.y) <= d.rayon){ blesser(e, dmg, s); appliquerEffets(e, s); }
    ajouterFx({type: "rond", x: c.x, y: c.y, r: d.rayon, c: "#ff9a3d"});
  }else if(d.mode === "cone"){
    const a = Math.atan2(c.y - s.y, c.x - s.x);
    for(const e of B.ennemis){
      if(e.mort || Math.hypot(e.x - s.x, e.y - s.y) > s.portee) continue;
      let da = Math.abs(Math.atan2(e.y - s.y, e.x - s.x) - a);
      if(da > Math.PI) da = 2 * Math.PI - da;
      if(da <= .6 && dansArc(s, e)){ blesser(e, dmg, s); appliquerEffets(e, s); }
    }
  }else if(d.mode === "chaine"){
    const vus = new Set([c]);
    let cur = c;
    blesser(c, dmg, s); appliquerEffets(c, s);
    for(let i = 1; i < d.n; i++){
      let suite = null, m = 2.2;
      for(const e of B.ennemis){
        if(e.mort || vus.has(e)) continue;
        const h = Math.hypot(e.x - cur.x, e.y - cur.y);
        if(h < m){ m = h; suite = e; }
      }
      if(!suite) break;
      ajouterFx({type: "trait", x: cur.x, y: cur.y, x2: suite.x, y2: suite.y, c: "#8fd7ff"});
      vus.add(suite); blesser(suite, dmg, s); appliquerEffets(suite, s); cur = suite;
    }
  }else if(d.mode === "ligne"){
    const h = Math.hypot(c.x - s.x, c.y - s.y) || 1, ux = (c.x - s.x) / h, uy = (c.y - s.y) / h, lg = Math.min(s.portee, tailleN() * 1.5);
    for(const e of B.ennemis){
      if(e.mort) continue;
      const dx = e.x - s.x, dy = e.y - s.y, t = dx * ux + dy * uy;
      if(t < 0 || t > lg || Math.abs(dx * uy - dy * ux) > .4) continue;
      blesser(e, dmg, s);
      if(d.double) blesser(e, dmg, s);
      appliquerEffets(e, s);
    }
    ajouterFx({type: "trait", x: s.x, y: s.y, x2: s.x + ux * lg, y2: s.y + uy * lg, c: RARETES[d.r].couleur});
  }else if(d.mode === "mine"){
    if(B.mines.length < 30) B.mines.push({x: c.x, y: c.y, dmg, s});
  }else if(d.pct){
    if(s.cible !== c){ s.cible = c; s.rampe = 0; }
    blesser(c, dmg + c.hp * d.pct[s.rampe < 2.5 ? 0 : s.rampe < 5 ? 1 : 2] / d.cad, s);
  }else if(d.rampe){
    if(s.cible !== c){ s.cible = c; s.rampe = 0; }
    const dps = d.rampe[0] + (d.rampe[1] - d.rampe[0]) * Math.min(1, s.rampe / 3);
    blesser(c, dps / d.cad * s.mDeg, s);
  }else{
    blesser(c, dmg, s); appliquerEffets(c, s);
  }
  if(d.gel && s.gel <= 0){ c.stun = Math.max(c.stun, c.boss ? d.gel.d / 2 : d.gel.d); s.gel = d.gel.tous; }
  return true;
}
function pasCombat(h){
  B.horloge += h;
  if(!B.file.length && !B.ennemis.length){
    B.attente -= h;
    if(B.attente <= 0){
      if(B.vague) gagner(G.or * ST.interet);
      vagueSuivante();
      B.attente = 1.5;
    }
  }
  while(B.file.length && B.file[0].t <= B.horloge) creerEnnemi(B.file.shift());

  for(const e of B.ennemis){
    if(e.brule && e.bruleT > 0){ e.bruleT -= h; blesser(e, e.brule * h); }
    if(e.poison && e.poisonT > 0){ e.poisonT -= h; blesser(e, e.poison * h); } else e.poison = 0;
    if(e.infecte) blesser(e, 100 * h);
    if(B.retombees > 0) blesser(e, e.hpMax * .08 * h);
    if(e.mort) continue;
    if(e.lentT > 0) e.lentT -= h; else e.lent = 0;
    if(e.vulnT > 0) e.vulnT -= h; else e.vuln = 0;
    if(e.stun > 0) e.stun -= h;
    else {
      const a = e.route[Math.min(e.route.length - 1, Math.floor(e.p))];
      e.p += e.v * h * (1 - Math.min(.6, a.lent + e.lent));
    }
    if(e.p >= e.route.length - 1){ e.mort = true; toucherChateau(e); if(!B) return; continue; }
    const i = Math.floor(e.p), t = e.p - i, a = e.route[i], b = e.route[i + 1];
    e.x = a.x + (b.x - a.x) * t; e.y = a.y + (b.y - a.y) * t;
  }
  /* l'infection passe aux voisins une fois par seconde */
  if(Math.floor(B.horloge) !== Math.floor(B.horloge - h)){
    const inf = B.ennemis.filter(e => e.infecte && !e.mort);
    if(inf.length) for(const e of B.ennemis) if(!e.infecte && !e.mort && inf.some(i => Math.hypot(i.x - e.x, i.y - e.y) < 1)) e.infecte = true;
  }
  for(const s of B.tours){
    if(s.d.mode === "aura") continue;
    if(s.cible) s.rampe += h;
    if(s.gel > 0) s.gel -= h;
    if(s.retour){
      s.retourT = (s.retourT || 0) - h;
      if(s.retourT <= 0){
        const v = B.ennemis.filter(e => !e.mort && !e.boss && Math.hypot(e.x - s.x, e.y - s.y) <= s.portee && dansArc(s, e)).sort((a, b) => b.p - a.p)[0];
        if(v){ v.p = 0; s.retourT = s.retour; ajouterFx({type: "rond", x: s.x, y: s.y, r: 1, c: "#ffd34d"}); }
      }
    }
    s.cd -= h;
    if(s.cd <= 0){
      if(tirer(s)) s.cd += 1 / (s.d.cad * s.mCad);    // on garde le reste pour tenir la cadence exacte
      else s.cd = 0;
    }
  }
  for(const s of B.pieges){
    s.cd -= h;
    if(s.cd > 0) continue;
    let touche = false;
    for(const e of B.ennemis){
      if(e.mort || Math.hypot(e.x - s.x, e.y - s.y) > .6) continue;
      if(s.d.dmg) blesser(e, s.d.dmg * s.mDeg, s);
      appliquerEffets(e, s);
      touche = true;
    }
    if(touche){ s.cd = 1 / s.d.cad; ajouterFx({type: "rond", x: s.x, y: s.y, r: .5, c: RARETES[s.d.r].couleur}); }
  }
  B.mines = B.mines.filter(m => {
    if(!B.ennemis.some(e => !e.mort && Math.hypot(e.x - m.x, e.y - m.y) < .5)) return true;
    for(const e of B.ennemis) if(!e.mort && Math.hypot(e.x - m.x, e.y - m.y) <= m.s.d.rayon) blesser(e, m.dmg, m.s);
    ajouterFx({type: "rond", x: m.x, y: m.y, r: m.s.d.rayon, c: "#ff9a3d"});
    return false;
  });
  if(B.retombees > 0) B.retombees -= h;
  B.ennemis = B.ennemis.filter(e => !e.mort);
  for(const f of B.fx) f.vie -= h;
  B.fx = B.fx.filter(f => f.vie > 0);
  B.depuis += h;
  if(B.depuis > 15){ B.depuis = 0; sauver(); }
}
function toucherChateau(e){
  B.pv -= e.coup;
  if(B.pv > 0) return;
  if(B.vie2){
    B.vie2 = false; B.pv = B.pvMax / 2;
    Base.toast("💖 Seconde vie !");
    return;
  }
  finCombat("Le château est tombé", relanceAuto());
}
/* ---------- Classement : la meilleure vague de chaque joueur ---------- */
const scoresLocaux = () => stock.lire("scores", []);
const classementLocal = {
  liste: scoresLocaux,
  qualifie: v => { const l = scoresLocaux(); return l.length < 10 || v > l[l.length - 1].s; },
  ajouter(e){
    const l = scoresLocaux();
    l.push(e);

/* ---------- Dessin du plateau ---------- */
const cv = $("plateau"), ctx = cv.getContext("2d");
const vue = {z: 1, ox: 0, oy: 0};
const sprites = {};
function sprite(emoji, t){
  t = Math.max(8, Math.round(t / 2) * 2);
  const k = emoji + t;
  if(sprites[k]) return sprites[k];
  const c = document.createElement("canvas");
  c.width = c.height = Math.ceil(t * 1.35);
  const x = c.getContext("2d");
  x.font = t + "px system-ui, 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif";
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText(emoji, c.width / 2, c.height / 2);
  return sprites[k] = c;
}
function poser(emoji, x, y, t){ const s = sprite(emoji, t); ctx.drawImage(s, x - s.width / 2, y - s.height / 2); }
function ajusterCanvas(){
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.round(r.width * dpr);
  if(cv.width !== w){ cv.width = cv.height = w; }
}
const cote = () => cv.width / tailleN() * vue.z;
const versPx = (x, y) => [x * cote() + vue.ox, y * cote() + vue.oy];
function borner(){
  const m = cv.width * (vue.z - 1);
  vue.ox = Math.min(0, Math.max(-m, vue.ox));
  vue.oy = Math.min(0, Math.max(-m, vue.oy));
}
function carre(x, y, t, rayon, couleur){
  ctx.fillStyle = couleur;
  ctx.beginPath(); ctx.roundRect(x, y, t, t, rayon); ctx.fill();
}
function dessiner(){
  ajusterCanvas();
  const n = tailleN(), s = cote();
  ctx.clearRect(0, 0, cv.width, cv.height);
  for(let y = 0; y < n; y++) for(let x = 0; x < n; x++){
    const [px, py] = versPx(x, y);
    ctx.fillStyle = (x + y) % 2 ? "#a9cf85" : "#bbdc9a";
    ctx.fillRect(px, py, s + 1, s + 1);
  }
  const reseau = B ? null : calculerReseau();
  const coupes = reseau ? new Set(reseau.coupes) : new Set();
  for(const k in G.plan){
    const p = G.plan[k], pt = pointDe(k), [px, py] = versPx(pt.x - .5, pt.y - .5);
    if(p.t === "chemin" && k !== glisse) dessinerChemin(p, px, py, s);
  }
  for(const k in G.plan){
    const p = G.plan[k], pt = pointDe(k), [px, py] = versPx(pt.x - .5, pt.y - .5);
    if(p.t !== "chemin" && k !== glisse) dessinerBatiment(p, px, py, s, coupes.has(k));
  }
  const pc0 = pointDe(cle(0, 0)), [cx, cy] = versPx(pc0.x - .5, pc0.y - .5);
  carre(cx + s * .03, cy + s * .03, s * .94, s * .16, "#6a4a2c");
  poser("🏰", cx + s / 2, cy + s / 2, s * .66);

  if(cellSel && !B){
    const p = G.plan[cellSel], pt = pointDe(cellSel), [px, py] = versPx(pt.x - .5, pt.y - .5);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = Math.max(2, s * .05);
    ctx.strokeRect(px, py, s, s);
    if(p && p.t === "tour") zoneDeTir(pt, defTour(p.k), p.r || 0);
  }
  if(B) dessinerCombat(s);
  dessinerCompteursBoss(s);
  dessinerApercu(s);
  ctx.strokeStyle = "#5a3d25"; ctx.lineWidth = Math.max(4, cv.width * .012);
  ctx.strokeRect(0, 0, cv.width, cv.height);
}
function dessinerBatiment(p, px, py, s, coupe){
  const coul = RARETES[rareteDe(p.t, p.k)].couleur;
  carre(px + s * .06, py + s * .06, s * .88, s * .16, coupe ? "#e8607a" : coul);
  carre(px + s * .13, py + s * .13, s * .74, s * .12, "#2f3442");
  poser(p.t === "tour" ? defTour(p.k).emoji : CAMP[p.k].emoji, px + s / 2, py + s / 2, s * .52);
  if(p.t !== "tour") return;
  if(niveauTour(p.k)){
    ctx.fillStyle = "#ffd34d"; ctx.font = `800 ${Math.max(9, s * .24)}px Nunito,sans-serif`;
    ctx.textAlign = "right"; ctx.textBaseline = "top";
    ctx.fillText("+" + niveauTour(p.k), px + s * .86, py + s * .12);
  }
  /* petite flèche : le côté vers lequel la tour tire */
  if(defTour(p.k).arc < 360){
    const a = angleDe(p.r || 0), cx = px + s / 2 + Math.cos(a) * s * .4, cy = py + s / 2 + Math.sin(a) * s * .4, t = s * .13;
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * t, cy + Math.sin(a) * t);
    ctx.lineTo(cx + Math.cos(a + 2.2) * t, cy + Math.sin(a + 2.2) * t);
    ctx.lineTo(cx + Math.cos(a - 2.2) * t, cy + Math.sin(a - 2.2) * t);
    ctx.fill();
  }
}
/* Portée d'une tour : un disque, ou un cône dans la direction r */
function zoneDeTir(pt, d, r){
  const [x, y] = versPx(pt.x, pt.y), R = Math.min(porteeDe(d), tailleN() * 1.5) * cote();
  ctx.beginPath();
  if(d.arc >= 360) ctx.arc(x, y, R, 0, 7);

    const a = angleDe(r), m = d.arc / 360 * Math.PI;
    ctx.moveTo(x, y);
    ctx.arc(x, y, R, a - m, a + m);
    ctx.closePath();
  }
  ctx.fillStyle = "rgba(255,255,255,.16)"; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 2; ctx.stroke();
}
/* Au-dessus de chaque camp : le nombre de vagues avant son prochain boss */
function dessinerCompteursBoss(s){
  const h = Math.max(13, s * .26);
  ctx.font = `800 ${Math.round(h * .72)}px Nunito,sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for(const k in G.plan){
    const p = G.plan[k];
    if(p.t !== "camp" || k === glisse) continue;
    const tous = RARETES[CAMP[p.k].r].boss, v = B ? B.vague : vagueDepart() - 1;
    const present = B && (B.ennemis.some(e => e.boss && e.k === k) || B.file.some(f => f.boss && f.k === k));
    const texte = present ? "👑 BOSS" : "👑 " + (tous - v % tous);
    const pt = pointDe(k), [x, y] = versPx(pt.x, pt.y - .5);
    const w = ctx.measureText(texte).width + h * .7, yp = Math.max(h / 2 + 2, y);
    ctx.fillStyle = present ? "#c2362b" : "rgba(20,16,28,.85)";
    ctx.beginPath(); ctx.roundRect(x - w / 2, yp - h / 2, w, h, h / 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillText(texte, x, yp);
  }
}
/* Aperçu de ce qu'on place ou déplace, sur la case sous le curseur */
function dessinerApercu(s){
  if(B || !survol) return;
  const p = glisse ? G.plan[glisse] : sel ? {t: sel.t, k: sel.k, r: rotation} : null;
  if(!p) return;
  const k = cle(survol.c, survol.l), pt = pointDe(k), [px, py] = versPx(pt.x - .5, pt.y - .5);
  const piege = !glisse && estPiege(sel);
  const libre = piege ? G.plan[k] && G.plan[k].t === "chemin" && !G.plan[k].piege : !G.plan[k];
  const ok = k !== cle(0, 0) && (glisse || (libre && !refusPose(sel.t, sel.k)));
  ctx.globalAlpha = .75;
  if(piege){
    poser(defTour(sel.k).emoji, px + s / 2, py + s / 2, s * .5);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = ok ? "#fff" : "#e8607a"; ctx.lineWidth = Math.max(2, s * .05);

    return;
  }
  if(p.t === "chemin") dessinerChemin(p, px, py, s);
  else dessinerBatiment(p, px, py, s, false);
  ctx.globalAlpha = 1;
  if(p.t === "tour") zoneDeTir(pt, defTour(p.k), p.r || 0);
  ctx.strokeStyle = ok ? "#fff" : "#e8607a"; ctx.lineWidth = Math.max(2, s * .05);
  ctx.strokeRect(px, py, s, s);
}
function dessinerChemin(p, px, py, s){
  const m = MATIERE[p.k.split("_")[0]], l = s * .62, cx = px + s / 2, cy = py + s / 2;
  ctx.fillStyle = m.couleur;
  ctx.fillRect(cx - l / 2, cy - l / 2, l, l);
  ports(p).forEach(d => {
    if(d === 0) ctx.fillRect(cx - l / 2, py, l, s / 2);
    if(d === 2) ctx.fillRect(cx - l / 2, cy, l, s / 2 + 1);
    if(d === 1) ctx.fillRect(cx, cy - l / 2, s / 2 + 1, l);
    if(d === 3) ctx.fillRect(px, cy - l / 2, s / 2, l);

}
function dessinerCombat(s){
  for(const f of B.fx){
    ctx.globalAlpha = Math.min(1, f.vie / .15);
    ctx.strokeStyle = f.c; ctx.lineWidth = Math.max(2, s * .05);

    if(f.type === "trait"){
      const [a, b] = versPx(f.x, f.y), [c, d] = versPx(f.x2, f.y2);

    }else{
      const [a, b] = versPx(f.x, f.y);
      ctx.arc(a, b, f.r * s, 0, 7);
    }

  }
  ctx.globalAlpha = 1;
  for(const m of B.mines){ const [x, y] = versPx(m.x, m.y); poser("🥏", x, y, s * .3); }
  for(const e of B.ennemis){
    if(!e.p && !e.x) continue;
    const [x, y] = versPx(e.x, e.y), t = s * (e.boss ? .8 : .46);
    poser(e.boss ? "👹" : e.camp.ennemi, x, y, t);
    if(e.infecte) poser("🦠", x + t * .4, y - t * .4, t * .4);

    ctx.fillStyle = "#222"; ctx.fillRect(x - w / 2, yb, w, h);
    ctx.fillStyle = e.boss ? "#e8607a" : "#52d273"; ctx.fillRect(x - w / 2, yb, w * Math.max(0, e.hp / e.hpMax), h);
  }
}

let dernier = performance.now();
function avancer(budget){
  const t = performance.now();

  dernier = t;

  if(B){

/* onglet en arrière-plan : le navigateur ne dessine plus, mais le farm continue */

/* ---------- Touches sur le plateau ---------- */
const doigts = new Map();
let appui = null, ecart = 0;
let survol = null;        // case sous le curseur ou le doigt
let glisse = null;        // clé de l'élément posé qu'on est en train de déplacer
function celluleSous(ev){
  const r = cv.getBoundingClientRect(), k = cv.width / r.width;
  const x = ((ev.clientX - r.left) * k - vue.ox) / cote(), y = ((ev.clientY - r.top) * k - vue.oy) / cote();
  const n = tailleN();
  if(x < 0 || y < 0 || x >= n || y >= n) return null;
  return {c: Math.floor(x) - Math.floor(n / 2), l: n - 1 - Math.floor(y)};
}
function zoomer(f, cx, cy){
  const z = Math.min(4, Math.max(1, vue.z * f));
  const ax = cx == null ? cv.width / 2 : cx, ay = cy == null ? cv.width / 2 : cy;
  vue.ox = ax - (ax - vue.ox) * z / vue.z;
  vue.oy = ay - (ay - vue.oy) * z / vue.z;
  vue.z = z; borner();
}
cv.addEventListener("pointerdown", ev => {
  if(ev.button === 2) return;
  doigts.set(ev.pointerId, ev);
  cv.setPointerCapture(ev.pointerId);
  survol = celluleSous(ev);
  if(doigts.size === 1){
    const k = survol && !B ? cle(survol.c, survol.l) : null;
    appui = {x: ev.clientX, y: ev.clientY, bouge: false, k: k && G.plan[k] ? k : null};
  }
  else { appui = null; glisse = null; const [a, b] = [...doigts.values()]; ecart = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
});
cv.addEventListener("pointermove", ev => {
  survol = celluleSous(ev);
  if(!doigts.has(ev.pointerId)) return;
  const avant = doigts.get(ev.pointerId);
  doigts.set(ev.pointerId, ev);
  const k = cv.width / cv.getBoundingClientRect().width;
  if(doigts.size === 2){
    const [a, b] = [...doigts.values()], e = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if(ecart) zoomer(e / ecart);
    ecart = e;
    return;
  }
  if(appui && Math.hypot(ev.clientX - appui.x, ev.clientY - appui.y) > 6) appui.bouge = true;
  if(appui && appui.bouge){
    if(!B && appui.k && G.plan[appui.k]){ glisse = appui.k; return; }
    if(!B && sel) return;                              // l'aperçu suit le doigt
    vue.ox += (ev.clientX - avant.clientX) * k;
    vue.oy += (ev.clientY - avant.clientY) * k;

});
function finDoigt(ev){
  if(!doigts.has(ev.pointerId)) return;
  doigts.delete(ev.pointerId);
  const fini = ev.type === "pointerup" && !doigts.size;
  if(glisse){ if(fini) deplacer(glisse, celluleSous(ev)); }
  else if(appui && fini && (!appui.bouge || sel)) toucherCase(celluleSous(ev));

cv.addEventListener("pointerup", finDoigt);
cv.addEventListener("pointercancel", finDoigt);
cv.addEventListener("pointerleave", ev => { if(!doigts.size) survol = null; });
cv.addEventListener("contextmenu", ev => { ev.preventDefault(); tournerSelection(); });

cv.addEventListener("wheel", ev => {
  ev.preventDefault();

$("zoomPlus").onclick = () => zoomer(1.4);
$("zoomMoins").onclick = () => zoomer(1 / 1.4);

/* ---------- Construction ---------- */
let onglet = "tour", sel = null, cellSel = null, rotation = 0;
function refusPose(t, k){
  if(restant(t, k) <= 0) return "Tu n'en as plus en réserve";
  if(t === "tour"){
    const d = defTour(k);
    if(d.piege){
      if(placesPieges() >= ST.pieges) return `Limite de pièges atteinte (${ST.pieges})`;
      return "";
    }
    if(places("tour") >= ST.defenses) return `Limite de défenses atteinte (${ST.defenses})`;
    const r = d.r, max = r === 6 ? 1 : r === 5 ? 3 : Infinity;
    if(r >= 5 && placesRarete(r) >= max) return `${RARETES[r].nom} : ${max} au maximum sur le terrain`;
    if(d.limite && Object.values(G.plan).filter(p => p.t === "tour" && defTour(p.k) === d).length >= d.limite) return `${d.nom} : ${d.limite} au maximum sur le terrain`;
  }
  if(t === "camp" && places("camp") >= ST.camps) return `Limite de camps atteinte (${ST.camps})`;
  return "";
}
const placesRarete = r => Object.values(G.plan).filter(p => p.t === "tour" && defTour(p.k).r === r).length;
function toucherCase(c){
  if(!c || B) return;
  const k = cle(c.c, c.l);
  if(k === cle(0, 0)){ cellSel = null; dessinerPanneau(); return; }
  const dessus = G.plan[k];
  if(estPiege(sel)){
    if(!dessus || dessus.t !== "chemin"){ Base.toast("Un piège se pose sur un chemin"); return; }
    if(!dessus.piege){
      const refus = refusPose(sel.t, sel.k);
      if(refus){ Base.toast(refus); return; }
      dessus.piege = sel.k;
      if(restant(sel.t, sel.k) <= 0) sel = null;
      sauver();
      dessinerPanneau();
      return;
    }
  }
  if(dessus){ cellSel = k; sel = null; dessinerPanneau(); return; }
  if(!sel){ cellSel = null; dessinerPanneau(); return; }
  const refus = refusPose(sel.t, sel.k);
  if(refus){ Base.toast(refus); return; }
  G.plan[k] = sel.t === "camp" ? {t: "camp", k: sel.k} : {t: sel.t, k: sel.k, r: rotation};
  cellSel = null;
  if(restant(sel.t, sel.k) <= 0) sel = null;
  sauver();
  dessinerPanneau(); dessinerHaut();
}
/* Glisser un élément posé : vers une case libre, ou échange avec celui qui s'y trouve */
function deplacer(de, c){
  if(!c) return;
  const k = cle(c.c, c.l);
  if(k === de) return;
  if(k === cle(0, 0)){ Base.toast("Le château ne bouge pas"); return; }
  const dessus = G.plan[k];
  G.plan[k] = G.plan[de];
  if(dessus) G.plan[de] = dessus; else delete G.plan[de];
  cellSel = k;
  sauver();
  dessinerPanneau();
}
const peutTourner = (t, k) => t === "chemin" ? FORMES[k.split("_")[1]].ports.length < 4 : t === "tour" && defTour(k).arc < 360;
function tournerSelection(){
  if(B) return;
  if(sel && peutTourner(sel.t, sel.k)){ rotation = (rotation + 1) % 4; dessinerPanneau(); }
  else if(cellSel && G.plan[cellSel] && peutTourner(G.plan[cellSel].t, G.plan[cellSel].k)) tourner(cellSel);
}
function retirer(k){
  delete G.plan[k];
  cellSel = null;
  sauver();
  dessinerPanneau(); dessinerHaut();
}
function tourner(k){
  G.plan[k].r = ((G.plan[k].r || 0) + 1) % 4;
  sauver();
  dessinerPanneau();
}
function articles(){
  if(onglet === "tour" || onglet === "piege") return Object.keys(G.inv.tours).filter(k => G.inv.tours[k] > 0 && !defTour(k).piege === (onglet === "tour"))
    .sort((a, b) => defTour(b).r - defTour(a).r || niveauTour(b) - niveauTour(a)).map(k => ({t: "tour", k}));
  if(onglet === "camp") return Object.keys(G.inv.camps).filter(k => G.inv.camps[k] > 0)
    .sort((a, b) => CAMP[b].r - CAMP[a].r).map(k => ({t: "camp", k}));
  const res = Object.keys(FORMES).map(f => cleChemin("terre", f));    // toujours visibles, même à ×0
  Object.keys(G.inv.chemins).forEach(k => { if(G.inv.chemins[k] > 0 && !res.includes(k)) res.push(k); });
  return res.sort((a, b) => rareteDe("chemin", b) - rareteDe("chemin", a)).map(k => ({t: "chemin", k}));
}
function carteArticle(a){
  const b = el("button", null, "td-item");
  const icone = el("b");

    icone.textContent = FORMES[f].signe;
    icone.style.color = MATIERE[m].couleur;
    icone.style.textShadow = "0 0 2px #000";
  }else icone.textContent = a.t === "tour" ? defTour(a.k).emoji : CAMP[a.k].emoji;
  b.appendChild(icone);
  b.appendChild(document.createTextNode(nomDe(a.t, a.k)));
  const r = restant(a.t, a.k);
  b.appendChild(el("i", "×" + r));
  if(r <= 0) b.style.opacity = ".5";
  b.style.borderColor = RARETES[rareteDe(a.t, a.k)].couleur;
  if(sel && sel.t === a.t && sel.k === a.k) b.classList.add("on");
  b.onclick = () => {
    sel = sel && sel.k === a.k ? null : a;
    cellSel = null;
    dessinerPanneau();
  };
  return b;
}
function texteTour(k){
  const d = defTour(k), m = Math.pow(1.5, niveauTour(k)) * (1 + ST.degats);
  const dps = d.rampe ? `${nb(Math.round(d.rampe[0] * m))} à ${nb(Math.round(d.rampe[1] * m))}` : nb(Math.round(d.dmg * d.cad * m * 10) / 10);
  const infos = [RARETES[d.r].nom];
  if(d.piege){
    infos.push("Piège de chemin");
    if(d.dmg) infos.push(nb(Math.round(d.dmg * m)) + " dégâts");
  }else{
    if(d.mode !== "aura" && d.mode !== "silo") infos.push(dps + " DPS");
    infos.push("portée " + (d.portee >= 99 ? "illimitée" : Math.round(porteeDe(d) * 10) / 10));
    infos.push(d.arc < 360 ? "cône de " + d.arc + "°" : "360°");
  }
  return `${infos.join(" · ")} — ${d.txt} · ${texteChance("tour", k)}`;
}
/* Chance sur un boss, avec le meilleur camp posé (ou la Forêt s'il n'y en a aucun) */
function texteChance(t, k){
  if(t === "tour" && defTour(k).camp){
    const c = CAMP[defTour(k).camp];
    return `🎲 ${formatChance(chanceArticle(t, k, c))}, seulement avec ${c.nom}`;
  }
  const poses = Object.values(G.plan).filter(p => p.t === "camp").map(p => CAMP[p.k]);
  let meilleur = CAMP.foret, p = 0;
  (poses.length ? poses : [CAMP.foret]).forEach(c => {
    const q = chanceArticle(t, k, c);
    if(q > p){ p = q; meilleur = c; }
  });
  return `🎲 ${formatChance(p)} avec ${meilleur.nom}`;
}
function texteArticle(t, k){
  if(t === "tour") return texteTour(k);
  if(t === "camp"){
    const c = CAMP[k];
    return `${RARETES[c.r].nom} · boss toutes les ${RARETES[c.r].boss} vagues · ennemis ×${difficulte(c).toFixed(1)}`;
  }
  const m = MATIERE[k.split("_")[0]];
  return `${RARETES[m.r].nom}${m.lent ? ` · ralentit de ${Math.round(m.lent * 100)} %` : ""} · ${texteChance(t, k)}`;
}

/* ---------- Arbre des améliorations ---------- */
let noeudSel = null;
let zoomArbre = 1, arbreGlisse = null, arbreBouge = false;
function ouvrirArbre(){
  $("vueArbre").classList.remove("cache");
  dessinerArbre();
  /* on arrive centré sur le Départ */
  const corps = $("corpsArbre"), z = corps.getBoundingClientRect(), d = document.querySelector(".td-hex.depart").getBoundingClientRect();
  corps.scrollLeft += d.left + d.width / 2 - z.left - corps.clientWidth / 2;
  corps.scrollTop += d.top + d.height / 2 - z.top - corps.clientHeight / 2;
}
/* Glisser pour se déplacer, molette pour zoomer (au doigt, le défilement natif suffit) */
(function(){
  const corps = $("corpsArbre");
  corps.addEventListener("pointerdown", ev => {
    arbreBouge = false;
    if(ev.pointerType === "mouse") arbreGlisse = {x: ev.clientX, y: ev.clientY};
  });
  document.addEventListener("pointermove", ev => {
    if(!arbreGlisse) return;
    if(Math.hypot(ev.clientX - arbreGlisse.x, ev.clientY - arbreGlisse.y) > 4) arbreBouge = true;
    if(!arbreBouge) return;
    corps.scrollLeft -= ev.clientX - arbreGlisse.x;
    corps.scrollTop -= ev.clientY - arbreGlisse.y;
    arbreGlisse = {x: ev.clientX, y: ev.clientY};
  });
  document.addEventListener("pointerup", () => { arbreGlisse = null; });
  corps.addEventListener("wheel", ev => {
    ev.preventDefault();
    const avant = zoomArbre;
    zoomArbre = Math.min(1.6, Math.max(.45, zoomArbre * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
    const r = corps.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top, f = zoomArbre / avant;
    $("arbre").style.zoom = zoomArbre;
    corps.scrollLeft = (corps.scrollLeft + mx) * f - mx;
    corps.scrollTop = (corps.scrollTop + my) * f - my;
  }, {passive: false});
})();
function dessinerArbre(){
  const a = $("arbre");
  a.innerHTML = "";
  const L = 66, H = 57;
  const pos = (q, r) => [L * (q + r / 2), H * r];
  const ps = NOEUDS.map(n => pos(n.q, n.r)).concat([[0, 0]]);
  const xMin = Math.min(...ps.map(p => p[0])), xMax = Math.max(...ps.map(p => p[0]));
  const yMin = Math.min(...ps.map(p => p[1])), yMax = Math.max(...ps.map(p => p[1]));
  a.style.width = xMax - xMin + 70 + "px";
  a.style.height = yMax - yMin + 76 + "px";
  const place = (b, q, r) => { const [x, y] = pos(q, r); b.style.left = x - xMin + "px"; b.style.top = y - yMin + "px"; };
  const dep = el("button", null, "td-hex depart");
  dep.append(el("b", "⬆️"), document.createTextNode("Départ"));
  place(dep, 0, 0); a.appendChild(dep);
  NOEUDS.forEach(n => {
    const pris = G.achats[n.id], dispo = noeudDispo(n);

    if(noeudSel === n) b.classList.add("on");
    b.style.setProperty("--c", n.couleur);
    if(pris || dispo){
      b.append(el("b", n.emoji), document.createTextNode(n.nom));
      if(dispo) b.appendChild(el("i", nb(n.cout)));
    }else b.appendChild(el("b", "?"));
    place(b, n.q, n.r);
    b.onclick = () => { if(arbreBouge) return; noeudSel = n; dessinerArbre(); };
    a.appendChild(b);
  });
  $("arbreOr").textContent = "💰 " + nb(G.or);

  const s = $("arbreStats");
  s.innerHTML = "";
  [["Dégâts", "+" + pc(ST.degats)], ["Cadence", "+" + pc(ST.cadence)], ["Terrain", `${ST.terrain} × ${ST.terrain}`], ["Château", ST.pv + " PV"], ["Défenses", ST.defenses], ["Pièges", ST.pieges], ["Camps", ST.camps],
   ["Or", "+" + pc(ST.or)], ["Chance", "+" + pc(ST.chance)], ["Crit.", pc(ST.critC)], ["Dégâts crit.", "×" + ST.critD.toFixed(2)], ["Intérêts", pc(ST.interet)], ["Prime de boss", "+" + pc(ST.bossOr)], ["Vague de départ", ST.vagueDepart]]
   .forEach(([k, v]) => { const i = el("span", k + " "); i.appendChild(el("strong", String(v))); s.appendChild(i); });

  const bas = $("arbreBas");
  bas.innerHTML = "";
  if(!noeudSel){ bas.appendChild(el("span", "Touche un hexagone pour voir son effet. On débloque à partir du Départ.", "muted")); return; }
  const n = noeudSel, pris = G.achats[n.id];
  if(!pris && !noeudDispo(n)){ bas.appendChild(el("span", "❓ Case à découvrir : achète une case voisine pour la révéler.", "muted")); return; }
  bas.appendChild(el("span", `${n.emoji} ${n.nom} : ${effetNoeud(n)}`));
  const acheter = el("button", pris ? "Déjà acheté" : `Acheter · 💰 ${nb(n.cout)}`, "btn");
  acheter.disabled = pris || G.or < n.cout;
  acheter.onclick = () => {
    G.or -= n.cout; G.achats[n.id] = true;
    recalculer(); sauver(); dessinerArbre(); toutDessiner();
  };
  bas.appendChild(acheter);
}
function effetNoeud(n){
  const p = v => "+" + Math.round(v * 1000) / 10 + " %";
  return {degats: p(n.val) + " de dégâts", cadence: p(n.val) + " de cadence", critC: p(n.val) + " de chance de critique", critD: p(n.val) + " de dégâts critiques",
    pv: "+" + n.val + " PV au château", defenses: "+" + n.val + " défenses", terrain: "+" + n.val + " lignes et colonnes", camps: "+" + n.val + " camp" + (n.val > 1 ? "s" : ""), or: p(n.val) + " d'or", chance: p(n.val) + " de chance",
    interet: p(n.val) + " d'or à chaque vague", bossOr: p(n.val) + " d'or sur les boss", doubleButin: p(n.val) + " de chance de double butin", secondeVie: "Le château se relève une fois par combat",
    pieges: "+" + n.val + " piège", brulure: p(n.val) + " de dégâts de brûlure", bossDeg: p(n.val) + " de dégâts aux boss", portee: p(n.val) + " de portée pour toutes les tours",
    prefusion: p(n.val) + " de chance qu'une tour tombe déjà au niveau +1", vagueDepart: "Permet de commencer les combats à la vague " + n.val}[n.stat];
}

/* ---------- Boutique de camps ---------- */
function renouveler(){
  const b = G.boutique || {num: 0, stock: {}, pitie: {}};
  const num = Math.floor(Date.now() / STOCK_MS);
  if(b.num === num){ G.boutique = b; return; }
  const n = Math.min(720, b.num ? num - b.num : 1);
  for(let i = 0; i < n; i++){
    b.stock = {};
    CAMPS.forEach(c => {
      const r = RARETES[c.r];
      let sort = Math.random() < r.stock;
      if(c.pitie){
        b.pitie[c.id] = (b.pitie[c.id] || 0) + 1;
        if(b.pitie[c.id] >= c.pitie) sort = true;
        if(sort) b.pitie[c.id] = 0;
      }
      if(sort) b.stock[c.id] = hasard(r.qte[0], r.qte[1]);
    });
  }
  b.num = num;
  G.boutique = b;
  sauver();
}
function ouvrirBoutique(){ $("vueBoutique").classList.remove("cache"); renouveler(); dessinerBoutique(); }

  const z = $("boutique");

    d.appendChild(el("div", q ? `En stock : ${q}` : "Épuisé", "muted"));
    const b = el("button", `💰 ${nb(c.prix)}`, "btn petit");
    b.disabled = !q || G.or < c.prix;
    b.onclick = () => {
      G.or -= c.prix; G.boutique.stock[c.id]--; ajouter("camp", c.id);

    d.appendChild(b);
    z.appendChild(d);

  majInfoBoutique();
}
