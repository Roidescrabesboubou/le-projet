<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Assaut Galactique</title>
<link rel="stylesheet" href="../commun/base.css">
<style>
:root{--accent:#7b5cff;--fond1:rgba(123,92,255,.16);--fond2:rgba(79,209,255,.12)}
.zone{position:relative;width:100%;max-width:520px}
canvas{display:block;width:100%;border-radius:18px;border:2px solid var(--encre);box-shadow:var(--ombre);background:#05061a;touch-action:none;user-select:none;-webkit-user-select:none}
.barre{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;max-width:520px;font-weight:800;flex-wrap:wrap}
.voile{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;border-radius:18px;background:rgba(5,6,26,.84);color:#eef;text-align:center;overflow:auto}
.voile .boite{max-width:420px;width:100%}
.voile h2{margin:0 0 6px;font-size:1.8rem}
.voile p{margin:6px 0;color:#c8c6ee}
.voile .champ{background:#fff;color:#1d1a3a}
.voile .code{font-family:Fredoka,sans-serif;font-size:2.4rem;letter-spacing:.2em;font-weight:700;color:#ffd34d}
.voile .ligne{display:flex;gap:6px;margin-top:6px}
.voile .ligne .champ{flex:1;min-width:0}
.boutons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.rang{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:5px;text-align:left}
.rang li{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:10px;padding:6px 10px;font-weight:800}
.rang li.moi{outline:2px solid #ffd34d}
.rang li .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt{display:inline-block;width:12px;height:12px;border-radius:50%}
.cartes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media (max-width:440px){.cartes{grid-template-columns:1fr}}
.aug{border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:#fff;border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;transition:transform .12s}
.aug:hover{transform:translateY(-3px);border-color:#fff}
.aug .e{font-size:2rem;line-height:1}
.aug small{font-weight:700;color:#c8c6ee;font-size:.78rem;line-height:1.25}
.aug .r{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase}
.aug.rare{border-color:#4fd1ff}.aug.rare .r{color:#4fd1ff}
.aug.epique{border-color:#d36bff;box-shadow:0 0 14px rgba(211,107,255,.45)}.aug.epique .r{color:#d36bff}
.aug.on{outline:3px solid #ffd34d}
.mesaug{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px;font-size:.85rem}
.mesaug span{background:rgba(255,255,255,.1);border-radius:999px;padding:2px 8px}
.lb{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px;text-align:left}
.lb li{display:flex;justify-content:space-between;gap:8px;background:rgba(255,255,255,.1);border-radius:10px;padding:5px 10px;font-weight:700}
.lb li.me{outline:2px solid #ffd34d}
.namerow{display:flex;gap:6px;margin-top:8px}
.namerow input{flex:1;min-width:0;padding:8px 10px;border-radius:10px;border:0}
.cl-note,.cl-titre{color:#c8c6ee}
</style>
</head>
<body>
<main class="b-page">
  <div class="barre"><span id="hInfo">👾 Assaut Galactique</span><span><button class="btn ghost petit" id="bSon">🔊</button> <button class="btn ghost petit" id="bPause">⏸️</button> <button class="btn ghost petit" id="bTop">🏆</button></span></div>
  <div class="zone"><canvas id="cv"></canvas><div class="voile" id="voile"></div></div>
  <p class="muted" style="margin:0;text-align:center;font-size:.88rem">← → (ou A/Q et D) pour bouger, ou glisse le doigt. Le tir est automatique.</p>
</main>

<script src="../commun/garde.js"></script>
<script src="../commun/base.js"></script>
<script src="../commun/classement.js"></script>
<script src="../commun/reseau.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = Base.esc;
const stock = Base.stock("assaut_");
Base.entete({
  titre: "Assaut Galactique", emoji: "👾",
  aide: `<p>Des vagues d'aliens descendent vers toi : détruis-les avant qu'ils n'atteignent le sol !</p>
    <ul><li>Bouge avec ← → (ou A/Q et D), ou glisse le doigt. <b>Le tir est automatique.</b></li>
    <li>Après chaque vague, choisis <b>un augment parmi trois</b> : tir triple, missiles, drones, éclairs, rebonds… Ils se cumulent !</li>
    <li>Bonus qui tombent : 💣 bombe, ⚡ frénésie, 🛡️ bouclier, ❤️ vie. L'OVNI qui passe en haut en lâche toujours un.</li>
    <li>Toutes les 5 vagues : <b>la Mère-Ruche</b>, un boss.</li>
    <li>Après la vague 10, les aliens deviennent plus coriaces à chaque vague, et des <b>élites</b> (cerclés d'or) apparaissent : ils visent et rapportent 3 fois plus.</li>
    <li>Tous tes augments au max ? Surpuissance, Surchauffe et Réparation se cumulent sans limite.</li>
    <li><b>Coop</b> (2 à 4) : même terrain, chacun ses augments. Un joueur abattu revient à la vague suivante.</li>
    <li><b>Duel</b> (2 à 4) : chacun ses vagues (les mêmes pour tous). Tes éliminations envoient des plongeurs chez les autres. Le dernier en vie gagne !</li></ul>`
});

/* ================= DONNÉES ================= */
const LW = 400, LH = 600, YV = 552;
const COULS = ["#4fd1ff", "#ffd34d", "#ff6fb5", "#7dff8a"];
const TYPES = {
  bulle:    {hp: 1, pts: 10, r: 12, c: "#6fd3ff"},
  meduse:   {hp: 2, pts: 20, r: 13, c: "#ff7ad9"},
  tireur:   {hp: 2, pts: 30, r: 13, c: "#ffb347"},
  blinde:   {hp: 4, pts: 40, r: 14, c: "#9aa7ff"},
  plongeur: {hp: 1, pts: 25, r: 11, c: "#ff5d5d"},
  scindeur: {hp: 3, pts: 35, r: 15, c: "#8bff9b"},
  mini:     {hp: 1, pts: 5,  r: 8,  c: "#c6ffcf"},
  ovni:     {hp: 4, pts: 150, r: 17, c: "#ffffff"}
};
const TNOMS = Object.keys(TYPES);
const AUGS = [
  {k: "triple",  e: "🔱", n: "Tir triple",      d: "+2 balles en éventail",                 r: "rare",   max: 3},
  {k: "cadence", e: "⚡", n: "Cadence",          d: "Tu tires 25 % plus vite",               r: "commun", max: 5},
  {k: "perce",   e: "🗡️", n: "Perforant",        d: "Tes balles traversent 1 ennemi de plus", r: "commun", max: 4},
  {k: "gros",    e: "🔭", n: "Gros calibre",     d: "Balles plus grosses : +1 dégât",        r: "rare",   max: 3},
  {k: "missile", e: "🚀", n: "Missiles",         d: "Un missile à tête chercheuse régulier",  r: "rare",   max: 3},
  {k: "drone",   e: "🛸", n: "Drone allié",      d: "Un drone tire à tes côtés",             r: "epique", max: 2},
  {k: "explo",   e: "💥", n: "Balles explosives", d: "Chaque impact explose autour",         r: "rare",   max: 3},
  {k: "chaine",  e: "🌩️", n: "Éclair en chaîne",  d: "15 % : la foudre saute sur 2 voisins",  r: "rare",   max: 3},
  {k: "crit",    e: "🎯", n: "Coup critique",    d: "15 % de dégâts x3",                     r: "commun", max: 4},
  {k: "rebond",  e: "🪃", n: "Rebond",           d: "Après une victime, la balle repart vers une autre", r: "epique", max: 3},
  {k: "gel",     e: "❄️", n: "Tirs gelants",     d: "Les ennemis touchés ne tirent plus 2 s", r: "commun", max: 1},
  {k: "meteore", e: "☄️", n: "Pluie de météores", d: "Des météores frappent les ennemis",    r: "epique", max: 3},
  {k: "bouclier",e: "🛡️", n: "Bouclier",         d: "Encaisse un tir, rechargé à chaque vague", r: "commun", max: 3},
  {k: "vie",     e: "❤️", n: "Vie en plus",      d: "+1 vie tout de suite",                  r: "commun", max: 4},
  {k: "vitesse", e: "🏃", n: "Réacteurs",        d: "Tu te déplaces 25 % plus vite",         r: "commun", max: 3},
  {k: "esquive", e: "👻", n: "Fantôme",          d: "12 % d'esquiver un tir, invincible plus longtemps", r: "rare", max: 3},
  {k: "jackpot", e: "🎰", n: "Jackpot",          d: "Les ennemis lâchent 2 fois plus de bonus", r: "commun", max: 2},
  {k: "sabotage",e: "☠️", n: "Sabotage",         d: "Duel : chaque attaque envoie 1 plongeur de plus", r: "rare", max: 3, duel: true},
  // sans limite : proposés quand il ne reste plus assez d'augments normaux
  {k: "puissance", e: "💪", n: "Surpuissance",   d: "+20 % de dégâts sur tout",              r: "epique", max: 999, inf: true},
  {k: "surchauffe",e: "🔥", n: "Surchauffe",     d: "Tu tires 10 % plus vite",               r: "rare",   max: 999, inf: true},
  {k: "soin",      e: "🩹", n: "Réparation",     d: "+1 vie tout de suite",                  r: "commun", max: 999, inf: true}
];
const AUG = Object.fromEntries(AUGS.map(a => [a.k, a]));
const POIDS = {commun: 6, rare: 3, epique: 1.3};
const BONUS = ["bombe", "frenesie", "bouclier", "vie"], BICO = {bombe: "💣", frenesie: "⚡", bouclier: "🛡️", vie: "❤️"};

/* ================= TOILE ================= */
const cv = $("cv"), ctx = cv.getContext("2d");
let echelle = 1, dpr = 1;
function taille(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.parentElement.clientWidth, h = Math.min(window.innerHeight - 180, w * LH / LW);
  const ww = Math.min(w, h * LW / LH);
  echelle = ww / LW;
  cv.style.width = ww + "px"; cv.style.height = ww * LH / LW + "px"; cv.style.margin = "0 auto";
  cv.width = Math.round(ww * dpr); cv.height = Math.round(ww * LH / LW * dpr);
}
window.addEventListener("resize", taille);
const etoiles = Array.from({length: 90}, () => ({x: Math.random() * LW, y: Math.random() * LH, v: 10 + Math.random() * 50, r: Math.random() * 1.4 + .3}));

/* ================= SON ================= */
let sonOn = stock.lire("son", true), actx = null, dernierSon = {};
function son(f, d, type, vol, cle){
  if(!sonOn) return;
  const now = performance.now(); if(cle){ if(now - (dernierSon[cle] || 0) < 45) return; dernierSon[cle] = now; }
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "square"; o.frequency.value = f;
    g.gain.setValueAtTime(vol || .03, actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  }catch(e){}
}
$("bSon").textContent = sonOn ? "🔊" : "🔇";
$("bSon").onclick = () => { sonOn = !sonOn; stock.ecrire("son", sonOn); $("bSon").textContent = sonOn ? "🔊" : "🔇"; };

/* ================= ÉTAT =================
   mode : solo | coop | duel.  S = la simulation (en coop elle tourne chez l'hôte).
   S.v = vaisseaux, S.en = ennemis, S.tb = balles des joueurs, S.te = balles ennemies, S.bo = bonus qui tombent */
let mode = "solo", S = null, salle = null, moiIdx = 0, graine = 1, idSuiv = 1;
let parts = [], textes = [], secousse = 0, pause = false;
const estChef = () => mode !== "coop" || (salle && salle.hote);   // fait tourner la simulation

function nouveauVaisseau(i, nom, id){ return {id: id || "moi", nom: nom || "Toi", coul: COULS[i % 4], x: LW / 2 + (i - .5) * 40 * (i % 2 ? 1 : -1), vies: 3, invul: 2, bouclier: 0, aug: {}, cd: 0, salve: 0, frenesie: 0, mort: false, droneCd: 0, meteoCd: 4, cible: null}; }
function nouvelleSim(joueurs){
  S = {w: 0, phase: "intro", t: 0, tp: 0, score: 0, v: joueurs.map((j, i) => nouveauVaisseau(i, j.nom, j.id)), en: [], tb: [], te: [], bo: [],
       form: {x: 0, y: 0, dir: 1, n0: 1}, boss: null, ovni: null, ovniCd: 18, cdTir: 2, cdPlonge: 4, ev: [], kills: 0, debutVague: 0, offres: {}, choix: {}};
  S.v.forEach((v, i) => v.x = LW / 2 + (i - (S.v.length - 1) / 2) * 70);
  vagueSuivante();
}
const vivants = () => S.v.filter(v => !v.mort);
const nb = (v, k) => v.aug[k] || 0;
// difficulté : douce jusqu'à la vague 10, puis +10 % de résistance par vague, +18 % après la vague 30
const dur = w => w <= 10 ? 1 : Math.pow(1.1, w - 10) * Math.pow(1.08, Math.max(0, w - 30));
const pm = v => v ? 1 + .2 * nb(v, "puissance") : 1;

/* ---------- Vagues ---------- */
function vagueSuivante(){
  S.w++; S.phase = "intro"; S.tp = 0; S.te = []; S.tb = []; S.boss = null; S.debutVague = S.t;
  S.v.forEach(v => { v.bouclier = nb(v, "bouclier"); if(v.mort && mode === "coop"){ v.mort = false; v.vies = 1; v.invul = 2.5; } });
  const r = Base.rng(graine * 1000 + S.w * 7919);
  S.en = S.en.filter(e => e.piege);       // les plongeurs envoyés par un rival restent
  if(S.w % 5 === 0){
    const lvl = S.w / 5;
    S.boss = {x: LW / 2, y: -90, hp: Math.round((70 + 45 * lvl + (S.v.length - 1) * 40) * dur(S.w) * (1 + .25 * (S.v.length - 1))), max: 0, t: 0, cdSalve: 2, cdPonte: 4, cdSpirale: 0, ang: 0, lvl};
    S.boss.max = S.boss.hp;
  }else{
    const lignes = Math.min(S.w >= 15 ? 6 : 5, 3 + Math.floor((S.w - 1) / 2)), cols = 8;
    const pElite = S.w < 12 ? 0 : Math.min(.4, (S.w - 11) * .02);
    const pool = ["bulle", "bulle", "meduse"];
    if(S.w >= 2) pool.push("tireur");
    if(S.w >= 3) pool.push("plongeur", "plongeur");
    if(S.w >= 4) pool.push("blinde");
    if(S.w >= 6) pool.push("scindeur");
    for(let gy = 0; gy < lignes; gy++){
      const t = gy === 0 && S.w >= 4 ? (r() < .5 ? "blinde" : "tireur") : pool[Math.floor(r() * pool.length)];
      for(let gx = 0; gx < cols; gx++){
        const T = TYPES[t], el = r() < pElite ? 1 : 0;
        const hp = Math.ceil((T.hp + Math.floor(S.w / 6)) * dur(S.w) * (el ? 2.5 : 1));
        S.en.push({id: idSuiv++, t, hp, gx, gy, x: 0, y: 0, m: "form", gel: 0, cd: 2 + r() * 4, el});
      }
    }
    S.form = {x: 0, y: -220, dir: 1, n0: S.en.length};
  }
  ajouterTexte(S.w % 5 === 0 ? `⚠️ VAGUE ${S.w} : LA MÈRE-RUCHE` : `VAGUE ${S.w}`, LW / 2, LH * .45, 26, 2);
}
const posForm = e => [36 + e.gx * 47 + S.form.x, 70 + e.gy * 36 + S.form.y];

/* ---------- Augments ---------- */
function tirerOffres(v){
  const dispo = AUGS.filter(a => !a.inf && nb(v, a.k) < a.max && (!a.duel || mode === "duel"));
  const l = [];
  if(dispo.length < 3) dispo.push(...AUGS.filter(a => a.inf));
  while(l.length < 3 && dispo.length){
    const tot = dispo.reduce((s, a) => s + POIDS[a.r], 0);
    let x = Math.random() * tot, i = 0;
    for(; i < dispo.length - 1; i++){ x -= POIDS[dispo[i].r]; if(x <= 0) break; }
    l.push(dispo.splice(i, 1)[0].k);
  }
  return l;
}
function appliquerAug(v, k){
  if(!AUG[k] || nb(v, k) >= AUG[k].max) return;
  v.aug[k] = nb(v, k) + 1;
  if(k === "vie" || k === "soin") v.vies++;
  if(k === "bouclier") v.bouclier++;
}
function finVague(){
  S.score += 100 * S.w;
  S.phase = "choix"; S.tp = 0; S.offres = {}; S.choix = {};
  S.v.forEach(v => { S.offres[v.id] = tirerOffres(v); });
  if(mode === "duel" && S.t - S.debutVague < 25) envoyerAttaque(2, "vague éclair");
}
function choisir(id, k){
  if(S.phase !== "choix" || S.choix[id] != null) return;
  const v = S.v.find(x => x.id === id); if(!v || !(S.offres[id] || []).includes(k)) return;
  S.choix[id] = k; appliquerAug(v, k);
  if(S.v.every(x => S.choix[x.id] != null)) vagueSuivante();
}

/* ================= SIMULATION ================= */
function maj(dt){
  S.t += dt; S.tp += dt;
  if(S.phase === "fin" || S.phase === "choix"){ if(S.phase === "choix" && mode === "coop" && S.tp > 30) S.v.forEach(v => { if(S.choix[v.id] == null) choisir(v.id, S.offres[v.id][0]); }); bougerTirs(dt); return; }
  // vaisseaux
  for(const v of S.v){
    if(v.mort) continue;
    if(v.invul > 0) v.invul -= dt;
    if(v.frenesie > 0) v.frenesie -= dt;
    if(S.phase !== "jeu") continue;
    v.cd -= dt * (v.frenesie > 0 ? 2 : 1);
    if(v.cd <= 0){ v.cd = .34 / ((1 + .25 * nb(v, "cadence")) * (1 + .1 * nb(v, "surchauffe"))); salve(v); }
    if(nb(v, "drone")){ v.droneCd -= dt; if(v.droneCd <= 0){ v.droneCd = .55; for(let k = 0; k < nb(v, "drone"); k++){ const dx = (k % 2 ? 1 : -1) * (28 + 12 * Math.floor(k / 2)); balle(v, v.x + dx, YV - 4, 0, -480, {deg: 1, taille: 2.5}); } } }
    if(nb(v, "meteore")){ v.meteoCd -= dt; if(v.meteoCd <= 0){ v.meteoCd = 7.5 / nb(v, "meteore"); const c = cibles().sort(() => Math.random() - .5).slice(0, 3); c.forEach(e => balle(v, e.x + (Math.random() - .5) * 10, -20, 0, 650, {deg: 3, taille: 7, k: 2})); } }
  }
  // intro : la formation descend
  if(S.phase === "intro"){
    if(S.boss){ S.boss.y += (90 - S.boss.y) * Math.min(1, dt * 2); }
    else S.form.y += (0 - S.form.y) * Math.min(1, dt * 3);
    S.en.forEach(e => { if(e.m === "form"){ [e.x, e.y] = posForm(e); } });
    if(S.tp > 1.6) S.phase = "jeu";
    bougerTirs(dt); return;
  }
  // formation
  const form = S.en.filter(e => e.m === "form");
  if(form.length){
    const vit = (20 + S.w * 3) * (1 + 2.2 * (1 - form.length / S.form.n0));
    S.form.x += S.form.dir * vit * dt;
    let mn = 1e9, mx = -1e9;
    form.forEach(e => { const [x] = posForm(e); mn = Math.min(mn, x); mx = Math.max(mx, x); });
    if(mx > LW - 18 && S.form.dir > 0){ S.form.dir = -1; S.form.y += 12; }
    if(mn < 18 && S.form.dir < 0){ S.form.dir = 1; S.form.y += 12; }
  }
  for(const e of S.en){
    if(e.gel > 0) e.gel -= dt;
    const lent = e.gel > 0 ? .5 : 1;
    if(e.m === "form"){
      [e.x, e.y] = posForm(e);
      if(e.y > YV - 18){ invasion(e); continue; }
      if((e.t === "tireur" || e.el) && e.gel <= 0){ e.cd -= dt; if(e.cd <= 0){ e.cd = Math.max(1.6, 3 - S.w * .03) + Math.random() * 3; const c = vivants()[Math.floor(Math.random() * vivants().length)]; if(c){ const a = Math.atan2(YV - e.y, c.x - e.x), sp = Math.min(300, 190 + S.w * 2.5); S.te.push({x: e.x, y: e.y + 10, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp}); } } }
    }else if(e.m === "plonge" || e.m === "libre"){
      e.x += e.vx * dt * lent; e.y += e.vy * dt * lent;
      if(e.m === "plonge"){ const c = proche(e.x); if(c) e.vx += Math.sign(c.x - e.x) * 140 * dt; e.vx = Math.max(-160, Math.min(160, e.vx)); }
      if(e.m === "libre" && (e.x < 12 || e.x > LW - 12)) e.vx *= -1;
      if(e.y > LH + 20){ if(e.retour){ e.m = "retour"; e.y = -30; } else e.mort = true; }
      else if(e.y > YV - 18) touchePar(e);
    }else if(e.m === "retour"){
      const [hx, hy] = posForm(e); e.x += (hx - e.x) * Math.min(1, dt * 3); e.y += (hy - e.y) * Math.min(1, dt * 3);
      if(Math.hypot(hx - e.x, hy - e.y) < 3) e.m = "form";
    }
  }
  S.en = S.en.filter(e => !e.mort);
  // plongeons
  S.cdPlonge -= dt;
  if(S.cdPlonge <= 0 && form.length){
    S.cdPlonge = Math.max(1.1, 4 - S.w * .15) * (.7 + Math.random() * .6) / Math.sqrt(vivants().length || 1);
    const cand = form.filter(e => e.t === "plongeur" || S.w >= 8);

const cibles = () => S.en.concat(S.boss ? [{x: S.boss.x, y: S.boss.y, boss: true}] : []).concat(S.ovni ? [{x: S.ovni.x, y: S.ovni.y, ovni: true}] : []);
const proche = x => vivants().reduce((a, v) => !a || Math.abs(v.x - x) < Math.abs(a.x - x) ? v : a, null);
function balle(v, x, y, vx, vy, o){ S.tb.push({x, y, vx, vy, o: S.v.indexOf(v), deg: (o.deg || 1) * pm(v), taille: o.taille || 3, perce: o.perce || 0, rebond: o.rebond || 0, k: o.k || 0, vus: []}); }

function collisions(){

      if(S.ovni.hp <= 0){ S.score += TYPES.ovni.pts; ev(S.ovni.x, S.ovni.y, "#fff", 30); S.bo.push({x: S.ovni.x, y: S.ovni.y, t: BONUS[Math.floor(Math.random() * (Math.random() < .15 ? 4 : 3))]}); S.ovni = null; son(500, .3, "triangle", .05); }

function blesser(e, d, v){

/* ================= DESSIN ================= */

    else if(p.eclair){ ctx.strokeStyle = p.c; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x, p.y); const n = 5; for(let k = 1; k <= n; k++){ const f = k / n; ctx.lineTo(p.x + (p.x2 - p.x) * f + (k < n ? (Math.random() - .5) * 14 : 0), p.y + (p.y2 - p.y) * f + (k < n ? (Math.random() - .5) * 14 : 0)); } ctx.stroke(); }
    else if(p.flash){ ctx.fillStyle = p.c; ctx.fillRect(-20, -20, LW + 40, LH + 40); }
    else { ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }

function dessinerEnnemi(e, T){
  const Ty = TYPES[e.t], r = Ty.r, c = e.gel > 0 ? "#bfe9ff" : Ty.c, ph = T * 4 + e.id;

    ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 3; ctx.stroke();
  }else if(e.t === "plongeur"){

    ctx.beginPath(); ctx.moveTo(0, r); ctx.lineTo(r, -r * .6); ctx.lineTo(0, -r * .2); ctx.lineTo(-r, -r * .6); ctx.closePath(); ctx.fill();

  }

  }

  if(e.hp > 1 && e.t === "blinde"){ ctx.fillStyle = "#fff"; ctx.font = "800 9px Nunito"; ctx.textAlign = "center"; ctx.fillText(Math.ceil(e.hp), 0, r * .55 + 3); }
  ctx.restore();
}
function dessinerOvni(o, T){
  ctx.save(); ctx.translate(o.x, o.y);
  ctx.fillStyle = "#c9d3ff"; ctx.beginPath(); ctx.ellipse(0, 3, 20, 7, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = "rgba(160,240,255,.8)"; ctx.beginPath(); ctx.arc(0, -1, 9, Math.PI, 0); ctx.fill();
  for(let k = -2; k <= 2; k++){ ctx.fillStyle = Math.floor(T * 8 + k) % 2 ? "#ffd34d" : "#ff6fb5"; ctx.beginPath(); ctx.arc(k * 7, 4, 1.8, 0, 6.28); ctx.fill(); }

}
function dessinerBoss(b, T){
  ctx.save(); ctx.translate(b.x, b.y);
  const pul = 1 + Math.sin(T * 3) * .04;
  ctx.fillStyle = "#5b2bd8"; ctx.beginPath(); ctx.ellipse(0, 0, 56 * pul, 34 * pul, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = "#8b5cff"; for(let k = 0; k < 6; k++){ const a = k * Math.PI / 3 + T * .5; ctx.beginPath(); ctx.arc(Math.cos(a) * 36, Math.sin(a) * 20, 8, 0, 6.28); ctx.fill(); }
  ctx.fillStyle = b.hp < b.max / 2 ? "#ff4d6d" : "#ff9de2"; ctx.beginPath(); ctx.arc(0, 0, 15 + Math.sin(T * 6) * 2, 0, 6.28); ctx.fill();

  ctx.fillStyle = "#ff6fb5"; ctx.fillRect(60, 14, (LW - 120) * Math.max(0, b.hp / b.max), 8);
}
function dessinerVaisseau(v, i, T){
  if(v.invul > 0 && Math.floor(T * 12) % 2) ctx.globalAlpha = .45;
  ctx.save(); ctx.translate(v.x, YV);
  // flamme
  ctx.fillStyle = v.frenesie > 0 ? "#ff4d6d" : "#ffb347"; ctx.beginPath(); ctx.moveTo(-5, 12); ctx.lineTo(0, 18 + Math.random() * 7); ctx.lineTo(5, 12); ctx.fill();

  ctx.restore(); ctx.globalAlpha = 1;
  if(S.v.length > 1 && mode === "coop"){ ctx.font = "800 9px Nunito, sans-serif"; ctx.textAlign = "center"; ctx.fillStyle = v.coul; ctx.fillText(v.nom.slice(0, 10), v.x, YV + 30); }
}
function dessinerHud(){
  ctx.font = "800 14px Fredoka, sans-serif"; ctx.textBaseline = "top";

  ctx.textAlign = "right"; ctx.fillText(`Vague ${S.w}`, LW - 10, 28);

function salonLigne(){

function recu(m, j){
  if(!m || !m.t) return;
  const de = m.de;
  if(m.t === "etat?" && salle.hote){ if(mode === "coop" && S) envoyerMeta(); else if(mode === "duel" && duel) salle.envoyer({t: "duel", graine, ids: duel.ids, pid: duel.pid}); else salle.envoyer({t: "salon", m: modeSalle}); return; }
  if(m.t === "salon" && !salle.hote){ modeSalle = m.m || modeSalle; salonLigne(); return; }
  // coop
  if(m.t === "x" && salle.hote && mode === "coop" && S){ const v = S.v.find(x => x.id === de); if(v && !v.mort && typeof m.x === "number") v.x = Math.max(14, Math.min(LW - 14, m.x)); return; }
  if(m.t === "choix" && salle.hote && mode === "coop" && S && m.w === S.w){ choisir(de, m.k); envoyerMeta(); return; }
  if(m.t === "meta" && !salle.hote){ recuMeta(m); return; }
  if(m.t === "s" && !salle.hote && mode === "coop" && S){ recuEtat(m); return; }
  // duel
  if(m.t === "duel" && !salle.hote){ if(!duel || duel.pid !== m.pid) demarrerDuel(m.graine, m.ids, m.pid); return; }
  if(m.t === "st" && mode === "duel" && duel){ duel.statuts[de] = {w: m.w | 0, vies: m.vies | 0, sc: m.sc | 0, mort: !!m.mort, pid: m.pid}; verifierVictoire(); return; }
  if(m.t === "att" && mode === "duel" && duel && S && m.pid === duel.pid && m.a !== undefined){ if(m.a === salle.moi || m.a === "*") recevoirAttaque(m.n | 0, de); return; }
}

/* ---------- Coop : l'hôte fait tourner la simulation ---------- */
function lancerCoop(){
  mode = "coop"; graine = Math.floor(Math.random() * 1e6); idSuiv = 1; parts = [];
  nouvelleSim(salle.joueurs.map(j => ({id: j.id, nom: j.pseudo})));
  const me = S.v.find(v => v.id === salle.moi); xLocal = me.x;
  phaseVue = ""; cacherVoile(); envoyerMeta();
}
const r1 = x => Math.round(x);
function envoyerMeta(){
  if(!salle || !S) return;
  salle.envoyer({t: "meta", ph: S.phase, w: S.w, sc: S.score, v: S.v.map(v => ({id: v.id, nom: v.nom, coul: v.coul, aug: v.aug})), offres: S.offres, choix: S.choix});
}
let metaT = 0, phaseEnvoyee = "";
function envoyerEtat(){
  const now = performance.now();
  const ph = S.phase + S.w + Object.keys(S.choix).length;
  if(ph !== phaseEnvoyee || now - metaT > 1000){ phaseEnvoyee = ph; metaT = now; envoyerMeta(); }
  salle.envoyer({t: "s", ph: S.phase, w: S.w, sc: S.score,
    v: S.v.map(v => [r1(v.x), v.vies, v.invul > 0 ? 1 : 0, v.bouclier, v.mort ? 1 : 0, v.frenesie > 0 ? 1 : 0]),
    e: S.en.map(e => [e.id, TNOMS.indexOf(e.t), r1(e.x), r1(e.y), Math.ceil(e.hp), e.gel > 0 ? 1 : 0, e.m === "plonge" ? 1 : 0, e.el ? 1 : 0]),
    b: S.tb.slice(-140).map(b => [r1(b.x), r1(b.y), r1(b.vx), r1(b.vy), b.o, b.k, Math.round(b.taille * 2)]),
    te: S.te.map(b => [r1(b.x), r1(b.y), r1(b.vx), r1(b.vy)]),
    bo: S.bo.map(b => [r1(b.x), r1(b.y), BONUS.indexOf(b.t)]),
    bs: S.boss ? [r1(S.boss.x), r1(S.boss.y), Math.ceil(S.boss.hp), S.boss.max] : 0,
    o: S.ovni ? [r1(S.ovni.x), r1(S.ovni.y)] : 0,
    ev: evEnvoi.splice(0)});
}
setInterval(() => { evEnvoi.length > 200 && evEnvoi.splice(0, evEnvoi.length - 200); }, 1000);
// invité
function nouvelleSimInvite(){ S = {w: 0, phase: "intro", t: 0, tp: 0, score: 0, v: [], en: [], tb: [], te: [], bo: [], boss: null, ovni: null, ev: [], offres: {}, choix: {}, form: {x: 0, y: 0}}; }
function recuMeta(m){
  if(!S || mode !== "coop"){ mode = "coop"; nouvelleSimInvite(); parts = []; phaseVue = ""; cacherVoile(); }
  S.phase = m.ph; S.w = m.w; S.score = m.sc; S.offres = m.offres || {}; S.choix = m.choix || {};
  if(attenteChoix && (S.choix[moi()] != null || S.w !== attenteChoix.w)) attenteChoix = null;
  if(attenteChoix){ S.choix[moi()] = attenteChoix.k; if(Date.now() - attenteChoix.t > 1500){ attenteChoix.t = Date.now(); salle.envoyer({t: "choix", w: attenteChoix.w, k: attenteChoix.k}); } }
  m.v.forEach((x, i) => {
    let v = S.v[i];
    if(!v || v.id !== x.id){ v = S.v[i] = {...nouveauVaisseau(i, x.nom, x.id)}; if(x.id === salle.moi) xLocal = v.x; }
    v.nom = x.nom; v.coul = x.coul; v.aug = x.aug || {};
  });
  S.v.length = m.v.length;
}
function recuEtat(m){
  S.phase = m.ph; S.w = m.w; S.score = m.sc;
  m.v.forEach((x, i) => { const v = S.v[i]; if(!v) return; if(v.id !== salle.moi) v.cx = x[0]; v.vies = x[1]; v.invul = x[2] ? 1 : 0; v.bouclier = x[3]; v.mort = !!x[4]; v.frenesie = x[5] ? 1 : 0; });
  const par = new Map(S.en.map(e => [e.id, e]));
  S.en = m.e.map(x => { const e = par.get(x[0]) || {id: x[0], x: x[2], y: x[3]}; e.t = TNOMS[x[1]]; e.cx = x[2]; e.cy = x[3]; e.hp = x[4]; e.gel = x[5]; e.el = x[7] || 0; e.m = x[6] ? "plonge" : "form"; return e; });
  S.tb = m.b.map(x => ({x: x[0], y: x[1], vx: x[2], vy: x[3], o: x[4], k: x[5], taille: x[6] / 2}));
  S.te = m.te.map(x => ({x: x[0], y: x[1], vx: x[2], vy: x[3]}));
  S.bo = m.bo.map(x => ({x: x[0], y: x[1], t: BONUS[x[2]]}));
  if(m.bs){ S.boss = S.boss || {x: m.bs[0], y: m.bs[1], t: 0}; S.boss.cx = m.bs[0]; S.boss.cy = m.bs[1]; S.boss.hp = m.bs[2]; S.boss.max = m.bs[3]; } else S.boss = null;
  S.ovni = m.o ? {x: m.o[0], y: m.o[1]} : null;
  if(m.ev && m.ev.length) jouerEvenements(m.ev);
}
let xEnvoi = 0;
function majInvite(dt, t){
  const k = Math.min(1, dt * 12);
  for(const e of S.en){ if(e.cx != null){ e.x += (e.cx - e.x) * k; e.y += (e.cy - e.y) * k; } }
  for(const v of S.v){ if(v.id !== salle.moi && v.cx != null) v.x += (v.cx - v.x) * k; if(v.invul > 0) v.invul -= dt; }
  if(S.boss && S.boss.cx != null){ S.boss.x += (S.boss.cx - S.boss.x) * k; S.boss.y += (S.boss.cy - S.boss.y) * k; S.boss.t += dt; }
  for(const b of S.tb){ b.x += b.vx * dt; b.y += b.vy * dt; }
  for(const b of S.te){ b.x += b.vx * dt; b.y += b.vy * dt; }
  for(const b of S.bo) b.y += 85 * dt;
  if(t - xEnvoi > 50){ xEnvoi = t; const v = monVaisseau(); if(v && !v.mort) salle.envoyer({t: "x", x: Math.round(xLocal)}); }
}

/* ---------- Duel : chacun sa simulation, on s'envoie des attaques ---------- */
function lancerDuel(){
  const pid = ((duel && duel.pid) || 0) + 1, g = Math.floor(Math.random() * 1e6), ids = salle.joueurs.map(j => j.id);
  salle.envoyer({t: "duel", graine: g, ids, pid});
  demarrerDuel(g, ids, pid);
}
function demarrerDuel(g, ids, pid){
  duel = {pid, ids, statuts: {}, mortOrdre: [], fini: false};
  ids.forEach(id => { if(id !== salle.moi) duel.statuts[id] = {w: 1, vies: 3, sc: 0, mort: false, pid}; });
  mode = "duel"; graine = g; idSuiv = 1; parts = [];
  if(!ids.includes(salle.moi)){ voile(`<h2>⏳ Duel en cours</h2><p>Tu joueras le prochain !</p><div class="boutons"><button class="btn ghost" id="q">🚪 Quitter</button></div>`).querySelector("#q").onclick = quitter; S = null; return; }
  nouvelleSim([{id: "moi", nom: Base.joueur.pseudo() || "Toi"}]);
  xLocal = LW / 2; phaseVue = ""; cacherVoile();
}
function envoyerStatut(){
  if(!duel || !S || !salle) return;
  const v = S.v[0];
  salle.envoyer({t: "st", pid: duel.pid, w: S.w, vies: v.vies, sc: S.score, mort: v.mort});
}
function envoyerAttaque(n, pourquoi){
  if(!duel || !salle || duel.fini) return;
  n += nb(S.v[0], "sabotage");
  const cibles = Object.entries(duel.statuts).filter(([id, st]) => !st.mort).map(([id]) => id);
  if(!cibles.length) return;
  const a = cibles[Math.floor(Math.random() * cibles.length)], j = salle.joueurs.find(x => x.id === a);
  salle.envoyer({t: "att", pid: duel.pid, a, n});
  ajouterTexte(`☠️ ${n} plongeur${n > 1 ? "s" : ""} → ${j ? j.pseudo : "?"}`, LW / 2, LH * .62, 14, 1.6, "#ffb347");
}
function recevoirAttaque(n, de){
  if(!S || S.phase === "fin") return;
  const j = salle.joueurs.find(x => x.id === de);
  ajouterTexte(`⚠️ ${j ? j.pseudo : "Un rival"} t'envoie ${n} plongeur${n > 1 ? "s" : ""} !`, LW / 2, LH * .35, 15, 2, "#ff6f6f");
  son(220, .3, "sawtooth", .05);
  for(let i = 0; i < Math.min(n, 8); i++) S.en.push({id: idSuiv++, t: "plongeur", hp: Math.ceil((1 + Math.floor(S.w / 6)) * dur(S.w)), x: 40 + Math.random() * (LW - 80), y: -20 - i * 30, m: "plonge", vx: 0, vy: Math.min(380, 150 + S.w * 6), gel: 0, piege: true});
}
function duelMort(){
  if(!duel) return;
  envoyerStatut();
  afficherDuel();
}
function verifierVictoire(){
  if(!duel || !S) return;
  const autresVivants = Object.values(duel.statuts).filter(s => !s.mort).length;
  if(!autresVivants && !S.v[0].mort && !duel.fini){
    duel.fini = true; S.phase = "fin"; S.v[0].mort = false;
    son(660, .2, "triangle", .1); setTimeout(() => son(990, .3, "triangle", .1), 150);
    envoyerStatut(); afficherDuel(true);
  }else if(S.phase === "fin") afficherDuel();
}
function afficherDuel(gagne){
  const moiSt = {id: salle.moi, nom: (salle.joueurs.find(x => x.id === salle.moi) || {}).pseudo || Base.joueur.pseudo(), w: S.w, sc: S.score, mort: S.v[0].mort, moi: true};
  const l = [moiSt].concat(Object.entries(duel.statuts).map(([id, s]) => ({id, nom: (salle.joueurs.find(x => x.id === id) || {}).pseudo || "?", ...s})))
    .sort((a, b) => (a.mort - b.mort) || (b.w - a.w) || (b.sc - a.sc));
  const tous = l.filter(x => !x.mort).length <= 1;
  const titre = gagne || (tous && !moiSt.mort) ? "🏆 Tu gagnes le duel !" : tous ? `🏆 ${esc(l[0].nom)} gagne !` : "💥 Éliminé !";
  const cle = JSON.stringify([titre, l.map(x => [x.nom, x.w, x.sc, x.mort]), salle.hote]);
  if(cle === afficherDuel.cle && $("voile").style.display !== "none") return;
  afficherDuel.cle = cle;
  const el = voile(`<h2>${titre}</h2><ol class="rang">${l.map((x, i) => `<li class="${x.moi ? "moi" : ""}"><span>${["🥇", "🥈", "🥉"][i] || i + 1 + "."}</span><span class="n">${esc(x.nom)}</span><span>V${x.w}</span><b>${(x.sc || 0).toLocaleString("fr-FR")}</b><span>${x.mort ? "💀" : "🚀"}</span></li>`).join("")}</ol>
    ${tous ? "" : `<p>⏳ Les autres se battent encore…</p>`}
    <div class="boutons">${tous && salle.hote ? `<button class="btn" id="rev">🔁 Revanche</button><button class="btn ghost" id="sal">👥 Salon</button>` : tous ? `<p>⏳ L'hôte choisit la suite…</p>` : ""}<button class="btn ghost" id="q">🚪 Quitter</button></div>`);
  el.dataset.k = "fin";
  const rev = el.querySelector("#rev"); if(rev) rev.onclick = lancerDuel;
  const sal = el.querySelector("#sal"); if(sal) sal.onclick = () => { salle.envoyer({t: "salon", m: modeSalle}); salonLigne(); };
  el.querySelector("#q").onclick = quitter;
}

/* ================= DÉMARRAGE ================= */
taille(); menu(); requestAnimationFrame(boucle);
const codeLien = Reseau.codeDansAdresse();
if(codeLien){ menuLigne("coop"); $("codeIn").value = codeLien; if(Base.joueur.pseudo()) menuLigne.rejoindre(codeLien); }
</script>
