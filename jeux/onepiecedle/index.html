<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Piece-dle</title>
<link rel="stylesheet" href="../commun/base.css">
<link rel="stylesheet" href="../commun/dle.css">
<style>:root{--accent:#1f6fb8;--fond1:rgba(224,165,38,.2);--fond2:rgba(214,61,61,.12)}</style>
</head>
<body>
<script src="../commun/garde.js"></script>
<script src="../commun/base.js"></script>
<script src="../commun/classement.js"></script>
<script src="../commun/series.js"></script>
<script src="../commun/dle.js"></script>
<script src="persos.js"></script>
<script>
const fr=(n,o)=>n.toLocaleString("fr-FR",o);
const fmtPrime=p=>!p?"Aucune":p>=1e9?fr(p/1e9,{maximumFractionDigits:2})+" Md ฿":p>=1e6?fr(p/1e6,{maximumFractionDigits:1})+" M ฿":fr(p)+" ฿";
const fmtTaille=t=>t>=100?fr(t/100,{minimumFractionDigits:2,maximumFractionDigits:2})+" m":t+" cm";
window.JEU=Dle.lancer({
  slug:"onepiecedle", titre:"One Piece-dle", emoji:"🏴‍☠️", quoi:"personnage", liste:PERSOS, graine:9001,
  question:"Devine le personnage de One Piece",
  intro:"Tape le nom de n'importe quel personnage pour commencer.",
  colonnes:[{t:"Genre",k:"genre"},{t:"Affiliation",k:"affiliation"},{t:"Fruit du démon",k:"fruit"},{t:"Haki",k:"haki"},
    {t:"Prime",k:"prime",num:true,fmt:fmtPrime},{t:"Taille",k:"taille",num:true,fmt:fmtTaille},{t:"Origine",k:"origine"},
    {t:"1er arc",k:"arc",num:true,v:c=>c.arcN}],
  indice2:["🏴 Affiliation",a=>`🏴 Affiliation : ${a.affiliation[0]}`],
  legende:"↑ ↓ prime / taille plus grande ou plus petite, arc plus tardif ou plus ancien",
  exemple:"ex : une affiliation en commun sur deux",
  aide:`<li>↑ / ↓ : la prime ou la taille du personnage mystère est <b>plus grande</b> / <b>plus petite</b>, ou il apparaît dans un arc <b>plus tardif</b> / <b>plus ancien</b>.</li>
    <li>Prime : dernière prime connue (« Aucune » si pas de prime). Infos à jour jusqu'à l'arc Egghead : attention aux spoilers !</li>`
});
</script>
</body>
</html>
