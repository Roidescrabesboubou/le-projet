<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bataille Laser</title>
<link rel="stylesheet" href="../commun/base.css">
<style>
:root{--accent:#7b4fe0;--fond1:rgba(123,79,224,.15);--fond2:rgba(62,123,250,.12);
  --grille:#191529;--case:#241e3b;--trait:rgba(255,255,255,.07)}
.b-page{max-width:1000px}

/* ---------- Menu ---------- */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:100%;max-width:640px}
.mode{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 12px;transition:transform .15s,box-shadow .15s}
.mode:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.1)}
.mode .ic{font-size:2.2rem}
.mode b{font-family:Fredoka,sans-serif;font-size:1.15rem}
.mode small{color:var(--muted)}
.panneau{max-width:640px}
.panneau h2{margin:0 0 8px;font-size:1.2rem}
.ligne{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ligne .champ{flex:1;min-width:140px}
.code{font-family:Fredoka,sans-serif;font-size:2.4rem;letter-spacing:6px;text-align:center;margin:6px 0}
.msg{min-height:1.3em;font-weight:700;font-size:.9rem;margin:8px 0 0}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;margin:14px 0}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.intro{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;color:var(--muted);font-size:.92rem;text-align:center;max-width:640px}

/* ---------- Partie ---------- */
#jeu{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.joueurs{display:flex;gap:10px;width:100%;max-width:640px}
.jr{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0;transition:border-color .2s,transform .2s}
.jr.actif{border-color:var(--c);transform:scale(1.03)}
.jr .dsq{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.jr .nom{flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr .pts{font-family:Fredoka,sans-serif;font-size:1.05rem;white-space:nowrap}
.statut{font-weight:800;text-align:center;min-height:1.4em;font-size:1.05rem;max-width:640px}
.detail{font-size:.9rem;text-align:center;color:var(--muted);min-height:1.2em;margin-top:-6px;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}

.plateaux{display:flex;gap:18px;width:100%;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.bloc{flex:1 1 340px;max-width:470px;display:flex;flex-direction:column;gap:8px}
.bloc h3{margin:0;font-size:1.02rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bloc h3 small{font-family:Nunito,sans-serif;color:var(--muted);font-weight:700;font-size:.8rem}

.grille{--n2:10;position:relative;display:grid;grid-template-columns:repeat(var(--n2),1fr);background:var(--grille);border-radius:14px;padding:4px;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.grille>.k{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
.k.case{background:var(--case);box-shadow:inset 0 0 0 1px var(--trait)}
.k.port{color:rgba(255,255,255,.32);font-size:clamp(.55rem,2.1vw,.78rem);font-weight:800;border-radius:8px}
.grille.actif .k.port.libre{cursor:pointer}
.grille.actif .k.port.libre:hover{background:rgba(255,255,255,.12);color:#fff}
.grille.actif .k.case.libre{cursor:crosshair}
.grille.actif .k.case.libre:hover{background:#3a3160}
.grille.pose .k.case{cursor:pointer}
.grille.pose .k.case:hover{background:#3a3160}
.grille:not(.actif):not(.pose){cursor:default}
.k svg{width:84%;height:84%;display:block;pointer-events:none}
.marq{position:absolute;inset:10%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(.5rem,2vw,.74rem);font-weight:800;
  color:#fff;border:2px solid rgba(255,255,255,.75);text-shadow:0 1px 2px rgba(0,0,0,.7);pointer-events:none}
.marq.clair{color:#22192b;text-shadow:none}
.rate::after{content:"✕";color:rgba(255,255,255,.4);font-weight:800;font-size:clamp(.8rem,3vw,1.2rem)}
.touche{box-shadow:inset 0 0 0 2px #ffd166!important}
.coule svg{opacity:.45}
.coule::after{content:"💥";position:absolute;font-size:clamp(.7rem,2.6vw,1rem)}
.boum{animation:boum .6s}
@keyframes boum{30%{transform:scale(1.35)}}
.flash .marq{animation:flash .5s 4 alternate}
@keyframes flash{to{transform:scale(1.25);box-shadow:0 0 12px #fff}}
.choisi{background:rgba(255,255,255,.18)!important}
.laser{position:absolute;left:4px;top:4px;width:calc(100% - 8px);height:calc(100% - 8px);pointer-events:none;overflow:visible}
.laser line{stroke-linecap:round;stroke-width:2.6;animation:trace linear forwards}
.laser.statique line{animation:none;stroke-dashoffset:0!important}
@keyframes trace{to{stroke-dashoffset:0}}
.laser.fondu{transition:opacity .8s;opacity:0}

.journal{display:flex;flex-direction:column;gap:3px;font-size:.84rem;max-height:150px;overflow:auto;padding-right:2px}
.journal button{display:flex;align-items:center;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-weight:700;cursor:default}
.journal button.voir{cursor:pointer}
.journal button.voir:hover{border-color:var(--accent)}
.journal .pt{width:13px;height:13px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.25)}
.journal .vide{color:var(--muted);font-weight:600;padding:2px}

/* ---------- Pose ---------- */
.palette{display:flex;flex-direction:column;gap:10px;max-width:470px}
.palette .rang{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center}
.outil{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font-weight:800;font-size:.88rem}
.outil.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.outil svg{width:22px;height:22px}
.pastille{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.pastille.on{border-color:var(--text)}
.compte{font-weight:800;text-align:center}
.legende{font-size:.82rem;color:var(--muted);text-align:center;line-height:1.5}
.legende i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin:0 2px}

/* ---------- Rideau (à deux sur le même écran) ---------- */
#rideau{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#rideau .ic{font-size:3.4rem}
#rideau h2{margin:0}
</style>
</head>
<body>
<main class="b-page">

  <!-- MENU -->
  <p class="intro" id="intro">Cache tes formes, tire des lasers chez l'adversaire et déduis où sont les siennes grâce à la sortie et la couleur du rayon.</p>
  <section id="menu" class="modes">
    <button class="mode" data-mode="ordi"><span class="ic">🤖</span><b>Contre l'ordi</b><small>3 niveaux de difficulté</small></button>
    <button class="mode" data-mode="local"><span class="ic">👥</span><b>À deux</b><small>Sur le même écran, chacun son tour</small></button>
    <button class="mode" data-mode="ligne"><span class="ic">🌐</span><b>En ligne</b><small>Contre un ami, chacun chez soi</small></button>
  </section>

  <!-- OPTIONS (ordi / local) -->
  <section id="pOptions" class="b-carte panneau cache">
    <h2 id="optTitre"></h2>
    <label class="etiquette">Taille de la grille</label>
    <div class="pilules tailles"></div>
    <div id="blocNiveau">
      <label class="etiquette">Niveau de l'ordi</label>
      <div class="pilules" id="niveaux"></div>
      <p class="msg muted" id="statsOrdi"></p>
    </div>
    <div id="blocNoms" class="cache">
      <label class="etiquette">Prénoms</label>
      <div class="ligne"><input class="champ" id="nom1" maxlength="16" placeholder="Joueur 1"><input class="champ" id="nom2" maxlength="16" placeholder="Joueur 2"></div>
    </div>
    <div class="actions" style="margin-top:14px"><button class="btn" id="goOptions">Jouer</button><button class="btn ghost retour">Retour</button></div>
  </section>

  <!-- EN LIGNE -->
  <section id="pLigne" class="b-carte panneau cache">
    <h2>🌐 Jouer en ligne</h2>
    <label class="etiquette" for="pseudo">Ton pseudo</label>
    <input class="champ" id="pseudo" maxlength="16" placeholder="Ton pseudo">
    <label class="etiquette">Taille de la grille (si tu crées la salle)</label>
    <div class="pilules tailles"></div>
    <div class="actions" style="margin-top:12px;justify-content:flex-start"><button class="btn" id="creer">Créer une salle</button></div>
    <div class="sep">ou rejoindre un ami</div>
    <div class="ligne"><input class="champ" id="codeIn" maxlength="5" placeholder="Code (ex. KXRT1)" style="text-transform:uppercase"><button class="btn" id="rejoindre">Rejoindre</button></div>
    <p class="msg" id="msgLigne"></p>
    <div class="actions" style="margin-top:8px;justify-content:flex-start"><button class="btn ghost petit retour">Retour</button><button class="btn ghost petit" id="tester">🩺 Tester ma connexion</button></div>
  </section>

  <!-- ATTENTE (hôte) -->
  <section id="pAttente" class="b-carte panneau cache" style="text-align:center">
    <h2>⏳ En attente d'un adversaire…</h2>
    <p class="muted">Donne ce code à ton ami :</p>
    <p class="code" id="code"></p>
    <div class="actions"><button class="btn" id="copier">🔗 Copier le lien d'invitation</button><button class="btn ghost" id="annuler">Annuler</button></div>
  </section>

  <!-- PARTIE -->
  <section id="jeu" class="cache">
    <div class="joueurs">
      <div class="jr" id="jr0" style="--c:#7b4fe0"><span class="dsq"></span><span class="nom"></span><span class="pts"></span></div>
      <div class="jr" id="jr1" style="--c:#2fb3a0"><span class="dsq"></span><span class="nom"></span><span class="pts"></span></div>
    </div>
    <div class="statut" id="statut"></div>
    <div class="detail" id="detail"></div>
    <button class="btn cache" id="passer"></button>

    <!-- Pose des formes -->
    <div class="plateaux cache" id="zonePose">
      <div class="bloc">
        <h3><span>🛡️ Ta grille</span><small id="poseInfo"></small></h3>
        <div class="grille pose" id="gPose"></div>
      </div>
      <div class="bloc palette b-carte" id="palette">
        <div class="rang" id="outils"></div>
        <div class="rang" id="couleurs"></div>
        <div class="rang"><button class="btn ghost petit" id="tourner">↻ Tourner le miroir</button></div>
        <p class="compte" id="compteFormes"></p>
        <div class="rang"><button class="btn ghost petit" id="hasard">🎲 Au hasard</button><button class="btn ghost petit" id="vider">🗑️ Vider</button><button class="btn" id="pret">✅ Je suis prêt</button></div>
        <p class="legende" id="legendePose"></p>
      </div>
    </div>

    <!-- Bataille -->
    <div class="plateaux cache" id="zoneJeu">
      <div class="bloc">
        <h3><span id="titreCible">🎯 Grille adverse</span><small id="infoCible"></small></h3>
        <div class="grille" id="gCible"></div>
        <div class="journal" id="jCible"></div>
      </div>
      <div class="bloc">
        <h3><span>🛡️ Ta grille</span><small id="infoMoi"></small></h3>
        <div class="grille" id="gMoi"></div>
        <div class="journal" id="jMoi"></div>
      </div>
    </div>
    <p class="legende" id="legendeJeu"></p>

    <div class="actions">
      <button class="btn cache" id="rejouer">🔁 Revanche</button>
      <button class="btn ghost" id="quitter">🏠 Menu</button>
    </div>
  </section>
</main>

<div id="rideau" class="cache">
  <div class="ic">📱</div>
  <h2 id="rideauTitre"></h2>
  <p class="muted" id="rideauTexte"></p>
  <button class="btn" id="rideauOk"></button>
</div>

<script src="../commun/garde.js"></script>
<script src="../commun/base.js"></script>
<script src="../commun/reseau.js"></script>
<script>
const $ = id => document.getElementById(id);
const stock = Base.stock("laser_");

Base.entete({
  titre: "Bataille Laser", emoji: "🔦",
  aide: `<p>Chacun cache des <b>formes colorées</b> sur sa grille. Le premier qui trouve <b>toutes</b> les formes de l'autre gagne.</p>
  <ul>
    <li><b>◣ Miroir</b> : le laser qui touche le grand côté tourne à 90°. S'il arrive sur un côté droit, il repart d'où il vient.</li>
    <li><b>■ Bloc</b> : renvoie le laser d'où il vient.</li>
    <li><b>● Filtre</b> : le laser le traverse tout droit.</li>
    <li>Chaque forme touchée <b>colore</b> le laser : 🔴+🔵 = 🟣 violet, 🔴+🟡 = 🟠 orange, 🔵+🟡 = 🟢 vert, les trois = ⚫ noir. Un laser blanc n'a rien touché.</li>
  </ul>
  <p>À ton tour, fais <b>une</b> action sur la grille adverse :</p>
  <ul>
    <li><b>🔦 Tirer un laser</b> : touche une case du bord. Tu apprends où il ressort et de quelle couleur. Puis c'est à l'autre.</li>
    <li><b>🎯 Frapper une case</b> : touche une case de la grille. Touché ? La forme est dévoilée et tu <b>rejoues</b>. Raté ? Ton tour s'arrête.</li>
  </ul>
  <p class="muted">Astuce : un rayon fait le même chemin dans les deux sens, donc on ne peut pas retirer depuis une sortie déjà connue.</p>`
});

/* =================================================================
   RÈGLES DU LASER
   ================================================================= */
const TAILLES = {
  petite:  {N: 6,  K: 4, t: "Petite · 6×6 · 4 formes"},
  normale: {N: 8,  K: 5, t: "Normale · 8×8 · 5 formes"},
  grande:  {N: 10, K: 7, t: "Grande · 10×10 · 7 formes"}
};
const COUL = {
  0: {n: "blanc",  h: "#f4f2fa", e: "⚪"}, 1: {n: "rouge", h: "#e5484d", e: "🔴"}, 2: {n: "bleu",  h: "#3e7bfa", e: "🔵"},
  4: {n: "jaune",  h: "#f5c518", e: "🟡"}, 3: {n: "violet", h: "#9b5de5", e: "🟣"}, 5: {n: "orange", h: "#f08c2e", e: "🟠"},
  6: {n: "vert",   h: "#2fb36b", e: "🟢"}, 7: {n: "noir",  h: "#1a1a1a", e: "⚫"}
};
const CLAIRES = [0, 4];
const FORMES = {tri: "Miroir", car: "Bloc", rond: "Filtre"};
const LETTRES = "ABCDEFGHIJKLMNOP";
/* Triangle : r = coin de l'angle droit (0 bas-gauche ◣, 1 haut-gauche ◤, 2 haut-droit ◥, 3 bas-droit ◢)
   côtés pleins (le laser y rebondit) : g=gauche h=haut d=droite b=bas */
const SOLIDE = [["g", "b"], ["g", "h"], ["h", "d"], ["d", "b"]];
const TRI = ["8,8 8,92 92,92", "8,8 92,8 8,92", "8,8 92,8 92,92", "92,8 92,92 8,92"];

/* Ports : 0..N-1 haut (colonnes), N..2N-1 droite (lignes), 2N..3N-1 bas, 3N..4N-1 gauche */
function infoPort(p, N){
  const s = Math.floor(p / N), i = p % N;
  const pos = [[i, -1], [N, i], [i, N], [-1, i]][s];
  return {s, i, x: pos[0], y: pos[1], d: [[0, 1], [-1, 0], [0, -1], [1, 0]][s]};
}
function portDe(x, y, N){ if(y < 0) return x; if(x >= N) return N + y; if(y >= N) return 2 * N + x; return 3 * N + y; }
function nomPort(p, N){
  const {s, i} = infoPort(p, N);
  return ["haut " + LETTRES[i], "droite " + (i + 1), "bas " + LETTRES[i], "gauche " + (i + 1)][s];
}
function etiquettePort(p, N){ const {s, i} = infoPort(p, N); return s % 2 === 0 ? LETTRES[i] : String(i + 1); }

/* Trace le laser tiré depuis le port p sur une grille de formes.
   → {sortie, c (masque de couleur), pts (points du tracé), cases (toutes les cases traversées)} */
function tracer(formes, port, N){
  const carte = {};
  formes.forEach(f => { if(f) carte[f.y * N + f.x] = f; });
  let {x, y, d: [dx, dy]} = infoPort(port, N), c = 0;
  const pts = [{x, y, c}], cases = [];
  for(let k = 0; k < N * N * 4 + 8; k++){
    x += dx; y += dy;
    if(x < 0 || y < 0 || x >= N || y >= N){ pts.push({x, y, c}); return {sortie: portDe(x, y, N), c, pts, cases}; }
    cases.push(y * N + x);
    const f = carte[y * N + x];
    if(!f) continue;
    c |= f.c;
    if(f.f === "car"){ dx = -dx; dy = -dy; }
    else if(f.f === "tri"){
      const entree = dx === 1 ? "g" : dx === -1 ? "d" : dy === 1 ? "h" : "b";
      if(SOLIDE[f.r].includes(entree)){ dx = -dx; dy = -dy; }
      else if(f.r % 2 === 0) [dx, dy] = [dy, dx];       // grand côté « \ »
      else [dx, dy] = [-dy, -dx];                       // grand côté « / »
    }
    pts.push({x, y, c});
  }
  return {sortie: -1, c, pts, cases};   // impossible en théorie (chemin réversible)
}

function formesAuHasard(N, K){
  const pris = new Set(), res = [];
  while(res.length < K){
    const x = Math.floor(Math.random() * N), y = Math.floor(Math.random() * N);
    if(pris.has(y * N + x)) continue;
    pris.add(y * N + x);
    const r = Math.random();
    res.push({x, y, f: r < .6 ? "tri" : r < .8 ? "car" : "rond", c: [1, 2, 4][Math.floor(Math.random() * 3)], r: Math.floor(Math.random() * 4)});
  }
  return res;
}
function formesValides(fs, N, K){
  if(!Array.isArray(fs) || fs.length !== K) return null;
  const pris = new Set(), res = [];
  for(const f of fs){
    const x = f.x | 0, y = f.y | 0;
    if(x < 0 || y < 0 || x >= N || y >= N || pris.has(y * N + x)) return null;
    if(!FORMES[f.f] || ![1, 2, 4].includes(f.c)) return null;
    pris.add(y * N + x);
    res.push({x, y, f: f.f, c: f.c, r: ((f.r | 0) % 4 + 4) % 4});
  }
  return res;
}

/* =================================================================
   ÉTAT DE LA PARTIE (G est envoyé à l'invité, sans les formes cachées)
   ================================================================= */
let G = null, mode = null, niveau = stock.lire("niveau", "moyen"), taille = stock.lire("taille", "normale");
let salle = null, moi = 0, ordiPense = false, attenteCoup = false, envoiPose = false;
let vueLocale = 0, passageDemande = false, nevVu = -1, mancheVue = -1;
let brouillon = [], outil = {f: "tri", c: 1, r: 0};

function nouvellePartie(noms, t){
  const T = TAILLES[t] || TAILLES.normale;
  G = {N: T.N, K: T.K, noms, scores: [0, 0], premier: 1, manche: 0};
  nouvelleManche();
}
function nouvelleManche(){
  Object.assign(G, {phase: "pose", b: [[], []], pret: [false, false], tirs: [[], []], frappes: [{}, {}],
    coups: [0, 0], tour: 0, gagnant: -1, ev: null, nev: (G.nev || 0) + 1, premier: 1 - G.premier, manche: G.manche + 1});
}
function poserPlateau(p, formes){
  if(!G || G.phase !== "pose" || G.pret[p]) return false;
  const v = formesValides(formes, G.N, G.K);
  if(!v) return false;
  G.b[p] = v; G.pret[p] = true;
  if(G.pret[0] && G.pret[1]){ G.phase = "jeu"; G.tour = G.premier; G.nev++; G.ev = null; }
  return true;
}
const trouvees = p => Object.values(G.frappes[p]).filter(i => i >= 0).length;
function portsUtilises(p){ const s = new Set(); G.tirs[p].forEach(t => { s.add(t.e); s.add(t.s); }); return s; }

/* Action d'un joueur : {t:"tir", port} ou {t:"frappe", cell} */
function agir(p, a){
  if(!G || G.phase !== "jeu" || G.tour !== p || !a) return false;
  const q = 1 - p, N = G.N;
  if(a.t === "tir"){
    const port = a.port | 0;
    if(port < 0 || port >= 4 * N || portsUtilises(p).has(port)) return false;
    const r = tracer(G.b[q], port, N);
    const n = G.tirs[p].length + 1;
    G.tirs[p].push({e: port, s: r.sortie, c: r.c, n});
    G.coups[p]++; G.tour = q;
    G.ev = {p, t: "tir", e: port, s: r.sortie, c: r.c, n};
  }else if(a.t === "frappe"){
    const cell = a.cell | 0;
    if(cell < 0 || cell >= N * N || cell in G.frappes[p]) return false;
    const idx = G.b[q].findIndex(f => f.y * N + f.x === cell);
    G.frappes[p][cell] = idx;
    G.coups[p]++;
    G.ev = {p, t: "frappe", cell, hit: idx >= 0};
    if(idx >= 0){
      if(trouvees(p) >= G.K){ G.phase = "fin"; G.gagnant = p; G.scores[p]++; }
    }else G.tour = q;
  }else return false;
  G.nev++;
  return true;
}
/* Ce que le joueur p a le droit de voir (formes adverses non trouvées masquées) */
function vuePour(p){
  const V = JSON.parse(JSON.stringify(G));
  if(V.phase !== "fin"){
    const q = 1 - p, ok = new Set(Object.values(V.frappes[p]).filter(i => i >= 0));
    V.b[q] = V.b[q].map((f, i) => ok.has(i) ? f : null);
  }
  return V;
}

/* =================================================================
   ORDI : il ne voit que ses résultats, jamais ta grille
   ================================================================= */
function coupOrdi(){
  const N = G.N, tirs = G.tirs[1], fr = G.frappes[1];
  const connues = Object.values(fr).filter(i => i >= 0).map(i => G.b[0][i]);
  const occupe = new Set(connues.map(f => f.y * N + f.x));
  const libresPorts = [...Array(4 * N).keys()].filter(q => !portsUtilises(1).has(q));
  const libresCases = [...Array(N * N).keys()].filter(i => !(i in fr));
  const hasard = l => l[Math.floor(Math.random() * l.length)];
  const bruit = {facile: .7, moyen: .3, difficile: 0}[niveau];

  // Cases sûrement (ou presque) vides : sur un rayon déjà expliqué par les formes connues
  const vide = new Set(Object.keys(fr).filter(k => fr[k] < 0).map(Number));
  const mysteres = [];
  for(const t of tirs){
    const sim = tracer(connues, t.e, N);
    if(sim.sortie === t.s && sim.c === t.c) sim.cases.forEach(i => { if(!occupe.has(i)) vide.add(i); });
    else mysteres.push(t);
  }
  const possible = i => !vide.has(i) && !occupe.has(i) && !(i in fr);
  // Une forme inconnue est forcément sur le début du chemin (depuis l'entrée) ET sur la fin (depuis la sortie)
  const poids = new Array(N * N).fill(0);
  for(const t of mysteres){
    const a = new Set(tracer(connues, t.e, N).cases.filter(possible));
    const b = t.s >= 0 ? new Set(tracer(connues, t.s, N).cases.filter(possible)) : new Set();
    let rang = 0;
    for(const i of a){ poids[i] += 2 + Math.max(0, 2 - rang) + (b.has(i) ? 4 : 0); rang++; }
    rang = 0;
    for(const i of b){ if(!a.has(i)) poids[i] += 2 + Math.max(0, 2 - rang); rang++; }
  }
  let cand = libresCases.filter(i => !vide.has(i));
  if(!cand.length) cand = libresCases;

  if(Math.random() < bruit){
    if(libresPorts.length && Math.random() < .5) return {t: "tir", port: hasard(libresPorts)};
    return {t: "frappe", cell: hasard(niveau === "facile" ? libresCases : cand)};
  }
  const best = Math.max(0, ...cand.map(i => poids[i]));
  const viser = () => ({t: "frappe", cell: hasard(cand.filter(i => poids[i] === best))});
  if(best > 0 && (best >= 7 || !libresPorts.length || Math.random() < .55)) return viser();
  if(libresPorts.length){
    // le laser qui traverse le plus de cases encore inconnues
    const score = q => { const {x, y, d} = infoPort(q, N); let s = 0, cx = x + d[0], cy = y + d[1];
      while(cx >= 0 && cy >= 0 && cx < N && cy < N){ if(possible(cy * N + cx)) s++; cx += d[0]; cy += d[1]; } return s; };
    const sc = libresPorts.map(score), m = Math.max(...sc);
    if(m > 0) return {t: "tir", port: hasard(libresPorts.filter((q, i) => sc[i] === m))};
  }
  return best > 0 ? viser() : {t: "frappe", cell: hasard(cand)};
}

/* =================================================================
   DESSIN DES GRILLES
   ================================================================= */
function svgForme(f){
  const h = COUL[f.c].h, trait = `stroke="rgba(255,255,255,.8)" stroke-width="5" stroke-linejoin="round"`;
  const s = f.f === "tri" ? `<polygon points="${TRI[f.r]}" fill="${h}" ${trait}/>`
    : f.f === "car" ? `<rect x="11" y="11" width="78" height="78" rx="9" fill="${h}" ${trait}/>`
    : `<circle cx="50" cy="50" r="36" fill="${h}" fill-opacity=".55" ${trait}/><circle cx="50" cy="50" r="14" fill="${h}"/>`;
  return `<svg viewBox="0 0 100 100">${s}</svg>`;
}

/* o = {formes, tirs (marqueurs sur les bords), frappes, mode: "cible"|"moi"|"pose", actif, coule (frappes reçues)} */
function dessinerGrille(el, N, o){
  el.style.setProperty("--n2", N + 2);
  el.classList.toggle("actif", !!o.actif);
  el.classList.toggle("pose", o.mode === "pose");
  const carte = {};
  (o.formes || []).forEach((f, i) => { if(f) carte[f.y * N + f.x] = {f, i}; });
  const marq = {};
  (o.tirs || []).forEach(t => {
    const lab = t.e === t.s ? t.n + "↩" : String(t.n);
    marq[t.e] = {lab, c: t.c};
    if(t.s >= 0 && t.s !== t.e) marq[t.s] = {lab, c: t.c};
  });
  const fr = o.frappes || {};
  const h = [];
  for(let y = -1; y <= N; y++) for(let x = -1; x <= N; x++){
    const coin = (x < 0 || x >= N) && (y < 0 || y >= N);
    if(coin){ h.push(`<div class="k"></div>`); continue; }
    if(x < 0 || y < 0 || x >= N || y >= N){
      const p = portDe(x, y, N), m = marq[p];
      if(m) h.push(`<div class="k port" data-port="${p}" title="${nomPort(p, N)}"><span class="marq${CLAIRES.includes(m.c) ? " clair" : ""}" style="background:${COUL[m.c].h}">${m.lab}</span></div>`);
      else h.push(`<div class="k port libre" data-port="${p}" title="${nomPort(p, N)}">${etiquettePort(p, N)}</div>`);
      continue;
    }
    const i = y * N + x, f = carte[i], frappe = i in fr;
    let cls = "k case";
    if(!frappe && o.mode === "cible") cls += " libre";
    if(frappe && fr[i] < 0) cls += " rate";
    if(frappe && fr[i] >= 0) cls += o.mode === "moi" ? " coule" : " touche";
    h.push(`<div class="${cls}" data-case="${i}">${f ? svgForme(f.f) : ""}</div>`);
  }
  el.innerHTML = h.join("");
}

/* Animation du rayon : segments colorés au fil des formes touchées */
function dessinerLaser(el, N, pts, anime){
  el.querySelectorAll(".laser").forEach(s => s.remove());
  const W = (N + 2) * 10, P = q => [(q.x + 1) * 10 + 5, (q.y + 1) * 10 + 5];
  let t = 0, lignes = "";
  for(let k = 0; k < pts.length - 1; k++){
    const [x1, y1] = P(pts[k]), [x2, y2] = P(pts[k + 1]);
    const L = Math.hypot(x2 - x1, y2 - y1) || 1, d = L / 10 * .07, c = COUL[pts[k].c].h;
    lignes += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-dasharray="${L}" stroke-dashoffset="${L}" style="animation-duration:${d}s;animation-delay:${t}s;filter:drop-shadow(0 0 2px ${c})"/>`;
    t += d;
  }
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${W}`);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("class", "laser" + (anime ? "" : " statique"));
  svg.innerHTML = lignes;
  el.appendChild(svg);
  if(anime) setTimeout(() => { svg.classList.add("fondu"); setTimeout(() => svg.remove(), 900); }, t * 1000 + 2200);
  return svg;
}

/* =================================================================
   AFFICHAGE GÉNÉRAL
   ================================================================= */
function spectateur(){                       // de quel joueur on montre le point de vue
  if(mode === "ligne") return moi;
  if(mode === "local") return vueLocale;
  return 0;
}
function attendu(){                          // à deux sur un écran : qui doit tenir l'appareil
  if(G.phase === "pose") return G.pret[0] ? 1 : 0;
  if(G.phase === "jeu") return G.tour;
  return vueLocale;
}
function vue(){ return mode === "ligne" && !salle.hote ? G : vuePour(spectateur()); }
function monTour(){
  if(!G || G.phase !== "jeu") return false;
  if(mode === "ordi") return G.tour === 0 && !ordiPense;
  if(mode === "local") return G.tour === vueLocale;
  if(mode === "ligne") return G.tour === moi && !attenteCoup;
  return false;
}
const pastille = c => `<span class="pt" style="background:${COUL[c].h}"></span>`;
function texteTir(t, N){ return `${nomPort(t.e, N)} → ${t.s === t.e ? "revient au départ" : nomPort(t.s, N)}, ${COUL[t.c].n}`; }

function dessiner(){
  if(!G) return;
  const V = vue(), v = spectateur(), q = 1 - v, N = V.N;
  if(V.manche !== mancheVue){ mancheVue = V.manche; brouillon = []; envoiPose = false; }

  // rideau (à deux sur le même écran)
  const changer = mode === "local" && G.phase !== "fin" && vueLocale !== attendu();
  const rideau = changer && (G.phase === "pose" || passageDemande);
  $("rideau").classList.toggle("cache", !rideau);
  if(rideau){
    const n = G.noms[attendu()];
    $("rideauTitre").textContent = "Passe l'appareil à " + n;
    $("rideauTexte").textContent = G.phase === "pose" ? "Chacun place ses formes en secret : ne regarde pas !" : "Sa grille va s'afficher : l'autre joueur ne regarde pas.";
    $("rideauOk").textContent = "C'est moi, " + n + " !";
  }
  $("passer").classList.toggle("cache", !(changer && G.phase === "jeu" && !passageDemande));
  if(changer && G.phase === "jeu") $("passer").textContent = "➡️ Fin du tour : passer à " + G.noms[attendu()];

  // joueurs
  for(const p of [0, 1]){
    const b = $("jr" + p);
    b.querySelector(".nom").textContent = V.noms[p];
    b.querySelector(".pts").textContent = (V.phase === "pose" ? (V.pret[p] ? "✅ prêt" : "✍️ pose…") : `💎 ${Object.values(V.frappes[p]).filter(i => i >= 0).length}/${V.K}`) + (V.scores[0] + V.scores[1] ? ` · 🏆${V.scores[p]}` : "");
    b.classList.toggle("actif", V.phase === "jeu" && V.tour === p);
  }

  const pose = V.phase === "pose";
  $("zonePose").classList.toggle("cache", !pose);
  $("zoneJeu").classList.toggle("cache", pose);
  $("rejouer").classList.toggle("cache", V.phase !== "fin");
  if(pose) dessinerPose(V, v); else dessinerJeu(V, v, q);
  statut(V, v);
}

function statut(V, v){
  const nom = p => V.noms[p], N = V.N;
  let s = "", d = "";
  if(V.phase === "pose"){
    const pret = mode === "ligne" ? (V.pret[v] || envoiPose) : V.pret[v];
    s = pret ? `⏳ En attente que ${nom(1 - v)} place ses formes…` : `Place tes ${V.K} formes en secret`;
  }else if(V.phase === "fin"){
    const g = V.gagnant;
    s = mode === "local" ? `🎉 ${nom(g)} a trouvé toutes les formes !` : g === v ? "🎉 Tu as trouvé toutes ses formes, victoire !" : `😵 ${nom(g)} a trouvé toutes tes formes…`;
    d = `${V.coups[g]} actions pour gagner · touche un tir du journal pour revoir son chemin`;
  }else{
    if(mode === "ordi" && V.tour === 1) s = "🤖 L'ordi réfléchit…";
    else if(monTour()) s = "À toi : tire un laser depuis un bord 🔦 ou frappe une case 🎯";
    else if(mode === "local") s = `Tour de ${nom(V.tour)}`;
    else s = `Au tour de ${nom(V.tour)}…`;
  }
  const ev = V.ev;
  if(ev && V.phase !== "pose" && V.phase !== "fin"){
    if(ev.t === "tir"){
      const auteur = ev.p === v && mode !== "local" ? "Ton laser" : `Laser de ${nom(ev.p)}`;
      d = `${auteur} #${ev.n} : ${texteTir(ev, N)} ${COUL[ev.c].e}`;
    }else{
      const c = LETTRES[ev.cell % N] + (Math.floor(ev.cell / N) + 1);
      const auteur = ev.p === v && mode !== "local" ? "Tu frappes" : `${nom(ev.p)} frappe`;
      d = `${auteur} ${c} : ${ev.hit ? "💥 touché ! " + (V.phase === "jeu" ? "et rejoue" : "") : "raté"}`;
    }
  }
  $("statut").textContent = s;
  $("detail").textContent = d;
}

/* ---------- Pose ---------- */
function dessinerPose(V, v){
  const N = V.N;
  const fini = mode === "ligne" ? (V.pret[v] || envoiPose) : V.pret[v];
  const formes = fini && V.b[v] && V.b[v].length ? V.b[v] : brouillon;
  dessinerGrille($("gPose"), N, {formes, mode: fini ? "moi" : "pose"});
  $("palette").classList.toggle("cache", fini);
  $("poseInfo").textContent = fini ? "✅ prête" : `${brouillon.length}/${V.K} formes`;
  $("compteFormes").textContent = `${brouillon.length} / ${V.K} formes posées`;
  $("pret").disabled = brouillon.length !== V.K;
  // palette
  const ou = $("outils"); ou.innerHTML = "";
  const exemple = f => svgForme({f, c: outil.c, r: f === "tri" ? outil.r : 0});
  [["tri", "Miroir"], ["car", "Bloc"], ["rond", "Filtre"], ["gomme", "Gomme"]].forEach(([k, t]) => {
    const b = document.createElement("button");
    b.className = "outil" + (outil.f === k ? " on" : "");
    b.innerHTML = (k === "gomme" ? "🧽" : exemple(k)) + `<span>${t}</span>`;
    b.onclick = () => { outil.f = k; dessiner(); };
    ou.appendChild(b);
  });
  const co = $("couleurs"); co.innerHTML = "";
  [1, 2, 4].forEach(c => {
    const b = document.createElement("button");
    b.className = "pastille" + (outil.c === c ? " on" : ""); b.style.background = COUL[c].h; b.title = COUL[c].n;
    b.onclick = () => { outil.c = c; if(outil.f === "gomme") outil.f = "tri"; dessiner(); };
    co.appendChild(b);
  });
  $("tourner").classList.toggle("cache", outil.f !== "tri");
  $("legendePose").innerHTML = "Touche une case pour poser la forme choisie. Touche un miroir déjà posé pour le tourner.<br>" + legende();
}
function legende(){
  const i = c => `<i style="background:${COUL[c].h}"></i>`;
  return `${i(1)}+${i(2)}=${i(3)} violet · ${i(1)}+${i(4)}=${i(5)} orange · ${i(2)}+${i(4)}=${i(6)} vert · les trois = ${i(7)} noir · ${i(0)} blanc = rien touché`;
}
$("gPose").addEventListener("click", e => {
  const k = e.target.closest("[data-case]");
  if(!k || !G || G.phase !== "pose") return;
  const v = spectateur();
  if(G.pret[v] || envoiPose) return;
  const N = G.N, i = +k.dataset.case, x = i % N, y = Math.floor(i / N);
  const j = brouillon.findIndex(f => f.x === x && f.y === y);
  if(outil.f === "gomme"){ if(j >= 0) brouillon.splice(j, 1); }
  else if(j >= 0){
    const f = brouillon[j];
    if(f.f === "tri" && outil.f === "tri" && f.c === outil.c){ f.r = (f.r + 1) % 4; outil.r = f.r; }
    else brouillon[j] = {x, y, f: outil.f, c: outil.c, r: outil.r};
  }else if(brouillon.length < G.K) brouillon.push({x, y, f: outil.f, c: outil.c, r: outil.r});
  else Base.toast(`Déjà ${G.K} formes : utilise la gomme 🧽 pour en enlever une`);
  dessiner();
});
$("tourner").onclick = () => { outil.r = (outil.r + 1) % 4; dessiner(); };
$("hasard").onclick = () => { brouillon = formesAuHasard(G.N, G.K); dessiner(); };
$("vider").onclick = () => { brouillon = []; dessiner(); };
$("pret").onclick = () => {
  if(!G || brouillon.length !== G.K) return;
  const v = spectateur();
  if(mode === "ligne" && !salle.hote){ envoiPose = true; salle.envoyer({t: "pose", formes: brouillon}); dessiner(); return; }
  if(!poserPlateau(v, brouillon)) return;
  if(mode === "ligne") diffuser();
  if(mode === "local") passageDemande = true;     // on cache tout de suite la grille posée
  dessiner();
  if(mode === "ordi" && G.phase === "jeu" && G.tour === 1) tourOrdi();
};

/* ---------- Bataille ---------- */
function dessinerJeu(V, v, q){
  const N = V.N, fin = V.phase === "fin";
  $("titreCible").textContent = "🎯 Grille de " + V.noms[q];
  $("infoCible").textContent = `${Object.values(V.frappes[v]).filter(i => i >= 0).length}/${V.K} trouvées`;
  $("infoMoi").textContent = `${Object.values(V.frappes[q]).filter(i => i >= 0).length}/${V.K} perdues`;
  const actif = monTour();
  dessinerGrille($("gCible"), N, {formes: V.b[q], tirs: V.tirs[v], frappes: V.frappes[v], mode: "cible", actif});
  dessinerGrille($("gMoi"), N, {formes: V.b[v], tirs: V.tirs[q], frappes: V.frappes[q], mode: "moi"});
  journal($("jCible"), V.tirs[v], N, fin ? V.b[q] : null, $("gCible"), "Tes lasers apparaîtront ici.");
  journal($("jMoi"), V.tirs[q], N, V.b[v], $("gMoi"), `Les lasers de ${V.noms[q]} apparaîtront ici.`);
  $("legendeJeu").innerHTML = legende();

  // événement du dernier coup (animation une seule fois)
  if(V.nev !== nevVu){
    nevVu = V.nev;
    const ev = V.ev;
    if(ev && ev.t === "tir"){
      if(ev.p === v) marquerPorts($("gCible"), [ev.e, ev.s]);
      else if(V.b[v] && V.b[v].length){ dessinerLaser($("gMoi"), N, tracer(V.b[v], ev.e, N).pts, true); marquerPorts($("gMoi"), [ev.e, ev.s]); }
    }
    if(ev && ev.t === "frappe"){
      const g = ev.p === v ? $("gCible") : $("gMoi"), k = g.querySelector(`[data-case="${ev.cell}"]`);
      if(k) k.classList.add("boum");
    }
  }
}
function marquerPorts(g, ports){
  ports.forEach(p => { const k = g.querySelector(`[data-port="${p}"]`); if(k) k.classList.add("flash"); });
}
function journal(el, tirs, N, formes, grille, videTxt){
  el.innerHTML = "";
  if(!tirs.length){ const s = document.createElement("span"); s.className = "vide"; s.textContent = videTxt; el.appendChild(s); return; }
  [...tirs].reverse().forEach(t => {
    const b = document.createElement("button");
    b.innerHTML = pastille(t.c) + `<span>#${t.n} · ${texteTir(t, N)}</span>`;
    if(formes && formes.every(Boolean)){
      b.className = "voir"; b.title = "Voir le chemin";
      b.onclick = () => { dessinerLaser(grille, N, tracer(formes, t.e, N).pts, true); marquerPorts(grille, [t.e, t.s]); };
    }
    el.appendChild(b);
  });
}

$("gCible").addEventListener("click", e => {
  if(!monTour()) return;
  const port = e.target.closest("[data-port]"), cell = e.target.closest("[data-case]");
  let a = null;
  if(port && port.classList.contains("libre")) a = {t: "tir", port: +port.dataset.port};
  else if(cell && cell.classList.contains("libre")) a = {t: "frappe", cell: +cell.dataset.case};
  if(!a) return;
  if(mode === "ligne" && !salle.hote){
    attenteCoup = true; salle.envoyer(a);
    (port || cell).classList.add("choisi"); $("gCible").classList.remove("actif");
    setTimeout(() => { if(attenteCoup){ attenteCoup = false; dessiner(); } }, 5000);
    return;
  }
  if(!agir(spectateur(), a)) return;
  if(mode === "ligne") diffuser();
  dessiner(); finDePartie();
  if(mode === "ordi" && G.phase === "jeu" && G.tour === 1) tourOrdi();
});

function tourOrdi(){
  ordiPense = true; dessiner();
  setTimeout(() => {
    if(!G || mode !== "ordi" || G.phase !== "jeu"){ ordiPense = false; return; }
    agir(1, coupOrdi());
    ordiPense = false; dessiner(); finDePartie();
    if(G.phase === "jeu" && G.tour === 1) tourOrdi();
  }, 1000 + Math.random() * 500);
}

function finDePartie(){
  if(!G || G.phase !== "fin" || mode !== "ordi" || G.gagnant !== 0) return;
  const v = stock.lire("victoires", {facile: 0, moyen: 0, difficile: 0});
  v[niveau] = (v[niveau] || 0) + 1; stock.ecrire("victoires", v);
  const total = v.facile + v.moyen + v.difficile;
  Base.record("laser", total, {texte: `${total} victoire${total > 1 ? "s" : ""} contre l'ordi` + (v.difficile ? ` (dont ${v.difficile} en Difficile)` : "")});
}

const NIVEAUX = {facile: "😊 Facile", moyen: "🤔 Moyen", difficile: "😈 Difficile"};
function afficherNiveaux(){
  const z = $("niveaux"); z.innerHTML = "";
  for(const [k, t] of Object.entries(NIVEAUX)){
    const b = document.createElement("button"); b.textContent = t; if(k === niveau) b.className = "on";
    b.onclick = () => { niveau = k; stock.ecrire("niveau", k); afficherNiveaux(); };
    z.appendChild(b);
  }
  const v = stock.lire("victoires", {}), n = v[niveau] || 0;
  $("statsOrdi").textContent = n ? `Tu as battu l'ordi ${n} fois dans ce niveau.` : "Tu n'as pas encore battu l'ordi dans ce niveau.";
}

let modeChoisi = null;
document.querySelectorAll(".mode").forEach(b => b.onclick = () => {
  modeChoisi = b.dataset.mode;
  afficherTailles();
  if(modeChoisi === "ligne"){ $("pseudo").value = Base.joueur.pseudo(); $("msgLigne").textContent = ""; ecran("pLigne"); return; }
  $("optTitre").textContent = modeChoisi === "ordi" ? "🤖 Contre l'ordi" : "👥 À deux sur le même écran";
  $("blocNiveau").classList.toggle("cache", modeChoisi !== "ordi");
  $("blocNoms").classList.toggle("cache", modeChoisi !== "local");
  if(modeChoisi === "ordi") afficherNiveaux();
  else { $("nom1").value = stock.lire("nom1", Base.joueur.pseudo() || ""); $("nom2").value = stock.lire("nom2", ""); }
  ecran("pOptions");
});
$("goOptions").onclick = () => {
  mode = modeChoisi;
  if(mode === "ordi"){
    nouvellePartie([Base.joueur.pseudo() || "Toi", "Ordi (" + NIVEAUX[niveau].split(" ")[1] + ")"], taille);
    poserPlateau(1, formesAuHasard(G.N, G.K));
  }else{
    const n1 = $("nom1").value.trim() || "Joueur 1", n2 = $("nom2").value.trim() || "Joueur 2";
    stock.ecrire("nom1", n1); stock.ecrire("nom2", n2);
    nouvellePartie([n1, n2 === n1 ? n2 + " (2)" : n2], taille);
    vueLocale = 0; passageDemande = false;
  }
  lancer();
};
function lancer(){ nevVu = -1; mancheVue = -1; ecran("jeu"); dessiner(); }

$("rejouer").onclick = () => {
  if(mode === "ligne"){
    if(salle.hote){ nouvelleManche(); diffuser(); dessiner(); }
    else { salle.envoyer({t: "rejouer"}); $("statut").textContent = "Revanche demandée…"; }
    return;
  }
  nouvelleManche();
  if(mode === "ordi") poserPlateau(1, formesAuHasard(G.N, G.K));
  if(mode === "local"){ vueLocale = -1; passageDemande = false; }
  dessiner();
};
$("quitter").onclick = () => {
  if(salle){ salle.quitter(); salle = null; }
  G = null; mode = null; ordiPense = false; ecran("menu");
};
document.addEventListener("keydown", e => {
  if(e.target.matches("input") || !G || G.phase !== "pose") return;
  if(e.key === "r" || e.key === "R"){ outil.r = (outil.r + 1) % 4; dessiner(); }
});

/* =================================================================
   EN LIGNE : l'hôte arbitre (il calcule les lasers), l'invité envoie ses actions
   et ne reçoit jamais les formes cachées de l'hôte
   ================================================================= */
function diffuser(){ if(salle && salle.hote && G) salle.envoyer({t: "etat", G: vuePour(1)}); }
function pseudoOK(){
  const p = $("pseudo").value.trim();
  if(!p){ $("pseudo").focus(); $("msgLigne").textContent = "Choisis d'abord un pseudo 🙂"; return false; }
  Base.joueur.changerPseudo(p); return true;
}
$("creer").onclick = async () => {
  if(!pseudoOK()) return;
  $("msgLigne").textContent = "Création de la salle…";
  try{
    salle = await Reseau.creer("laser", {
      max: 2,
      surEssai: t => $("msgLigne").textContent = t,
      surArrivee(j){
        mode = "ligne"; moi = 0;
        nouvellePartie([Base.joueur.pseudo() || "Hôte", j.pseudo], taille);
        lancer(); diffuser();
        Base.toast(j.avatar + " " + j.pseudo + " a rejoint la partie !");
      },
      surDepart(j){
        Base.toast(j.pseudo + " a quitté la partie.");
        G = null; $("code").textContent = salle.code; ecran("pAttente");
      },
      surMessage(m){
        if(!G) return;
        if(m.t === "etat?") diffuser();
        if(m.t === "pose"){ if(poserPlateau(1, m.formes)) dessiner(); diffuser(); }
        if(m.t === "tir" || m.t === "frappe"){ if(agir(1, m)) dessiner(); diffuser(); }
        if(m.t === "rejouer" && G.phase === "fin"){ nouvelleManche(); dessiner(); diffuser(); }
      }
    });
    $("code").textContent = salle.code; $("msgLigne").textContent = "";
    ecran("pAttente");
  }catch(e){ $("msgLigne").textContent = "❌ " + e.message; }
};
$("rejoindre").onclick = () => rejoindre($("codeIn").value);
$("codeIn").addEventListener("keydown", e => { if(e.key === "Enter") $("rejoindre").click(); });
async function rejoindre(code){
  if(!pseudoOK()) return;
  $("msgLigne").textContent = "Connexion à la salle…";
  try{
    salle = await Reseau.rejoindre("laser", code, {
      surMessage(m){
        if(m.t !== "etat") return;
        const nouveau = !G;
        G = m.G; attenteCoup = false;
        if(G.pret[1]) envoiPose = false;
        if(nouveau){ mode = "ligne"; moi = 1; lancer(); } else dessiner();
      },
      surFermeture(){ Base.toast("L'hôte a fermé la salle."); salle = null; G = null; ecran("menu"); }
    });
    $("msgLigne").textContent = "Connecté ! En attente de la partie…";
    salle.envoyer({t: "etat?"});
  }catch(e){ salle = null; $("msgLigne").textContent = "❌ " + e.message; }
}
$("annuler").onclick = () => { if(salle){ salle.quitter(); salle = null; } ecran("pLigne"); };
$("copier").onclick = async () => {
  try{ await navigator.clipboard.writeText(salle.lien); Base.toast("Lien copié ! Envoie-le à ton ami 📨"); }
  catch(e){ Base.fenetre("Lien d'invitation", salle.lien); }
};
$("tester").onclick = async () => { $("msgLigne").textContent = "Test des relais…"; $("msgLigne").textContent = await Reseau.tester(); };

/* Arrivée par un lien d'invitation (?salle=CODE) */
const codeLien = Reseau.codeDansAdresse();
if(codeLien){
  afficherTailles();
  $("codeIn").value = codeLien; $("pseudo").value = Base.joueur.pseudo(); ecran("pLigne");
  if(Base.joueur.pseudo()) rejoindre(codeLien);
  else $("msgLigne").textContent = "Choisis ton pseudo puis clique sur « Rejoindre ».";
}
</script>
</body>
</html>
